LAB.add({
  id:'attention', group:'Attention and Transformers', title:'Attention', slides:'231, 260', source:'CS231n Lecture 8 (2026)', keywords:'attention bahdanau query key value self-attention scaled dot product mask multihead flash',
  html: R`
<p>Recall the Seq2Seq RNN: the encoder squeezes the whole input "we see the sky" into one fixed-size context vector $c$ before the decoder produces the Spanish "vemos el cielo." <b>Problem:</b> the input sequence bottlenecks through a fixed-size $c$. What if $T=1000$? <b>Solution:</b> let the decoder look back at the whole input sequence at every output step (Bahdanau et al., ICLR 2015).</p>
<h2>Seq2Seq with RNNs and attention</h2>
<ol><li>Compute scalar <b>alignment scores</b> between the previous decoder state and every encoder state: $e_{t,i}=f_{att}(s_{t-1},h_i)$, where $f_{att}$ is a small linear layer.</li><li>Normalize with softmax to get <b>attention weights</b>: $0<a_{t,i}<1$, $\sum_i a_{t,i}=1$.</li><li>Compute the <b>context vector</b> as a weighted sum of hidden states: $c_t=\sum_i a_{t,i}h_i$.</li><li>Use it in the decoder: $s_t=g_U(y_{t-1},s_{t-1},c_t)$.</li></ol>
<p>Everything is differentiable, so there is no supervision on the attention weights: we just backpropagate through everything. A different context vector is used at each decoder step, so the input is no longer bottlenecked through one vector.</p>
${panel('Where does each output word look?', `<p class="small">Click an output word. "vemos" = "we see", so the weights might be 0.45, 0.45, 0.05, 0.05; "el" = "the", so mostly "the" (the lecture uses the same weights for its Italian version; the last two rows are illustrative).</p><div class="btnrow" id="attBtns"></div><div class="grid2"><div id="attBars"></div><div id="attHeat"></div></div><p class="small muted">Visualizing attention weights for translation shows mostly diagonal attention (words correspond in order), and attention also figures out other word orders. In Spanish, "European Economic Area" becomes "Espacio Económico Europeo" and "the red car" becomes "el coche rojo": the adjective moves after the noun, so the weights leave the diagonal there.</p>`)}
<h2>A general operator: the attention layer</h2>
<p>There is a general operator hiding here: <b>query</b> vectors (decoder states) and <b>data</b> vectors (encoder states) are transformed into <b>output</b> vectors (context). Each query attends to all data vectors and gives one output vector. The lecture generalizes it step by step:</p>
<div class="grid2"><div class="mini"><h4>1. Similarity by dot product, scaled</h4><p>$E_{ij}=Q_i\cdot K_j/\sqrt{D}$. Scaling by $\sqrt{D}$ keeps large dot products from saturating the softmax, which would make gradients vanish.</p></div><div class="mini"><h4>2. Many queries at once</h4><p>Stack queries into a matrix $Q$ and compute all similarities with one matrix multiply.</p></div><div class="mini"><h4>3. Separate keys and values</h4><p>Project the data vectors twice: <b>keys</b> $K=XW_K$ to compare with queries, <b>values</b> $V=XW_V$ to build the output.</p></div><div class="mini"><h4>4. Self-attention</h4><p>Compute queries from the same inputs too: $Q=XW_Q$. Every input vector attends to every other. In <b>cross-attention</b>, queries come from one set (decoder) and keys/values from another (encoder).</p></div></div>
$$Q=XW_Q,\;K=XW_K,\;V=XW_V,\qquad A=\operatorname{softmax}\!\Big(\frac{QK^\top}{\sqrt{D}}\Big),\qquad Y=AV$$
${panel('Self-attention calculator', `<div class="controls"><label class="opt" style="margin:0"><input type="checkbox" id="saScale" checked> Divide by √D</label><label class="opt" style="margin:0"><input type="checkbox" id="saMask"> Causal mask (masked self-attention)</label><div class="ctl"><label>Embedding magnitude <output id="saMag_v"></output></label><input type="range" id="saMag" min="0.5" max="4" step="0.5" value="1"></div><button class="btn ghost sm" id="saPerm">Permute the inputs</button><button class="btn ghost sm" id="saPos">Add positional encoding: off</button></div><div id="saOut" style="overflow-x:auto"></div><p class="small" id="saTxt"></p>`)}
<div class="grid2"><div class="mini"><h4>Permutation equivariance</h4><p>Permuting the inputs permutes the queries, keys, values, similarities, weights, and outputs in the same way: $F(\sigma(X))=\sigma(F(X))$. Self-attention works on <b>sets</b> of vectors, so it does not know the order of the sequence. Fix: add a <b>positional encoding</b>, a fixed function of the index, to each input. A modern alternative, <b>RoPE</b>, maps positions to angles and rotates queries and keys to encode relative positions (Su et al., 2021).</p></div><div class="mini"><h4>Masked self-attention</h4><p>Don't let vectors "look ahead": override the similarities of future positions with $-\infty$ before the softmax, so their weights become 0. This controls which inputs each vector may see, and it is used for language modeling, where you predict the next word.</p></div></div>
<h2>Multiheaded self-attention</h2>
<p>Run $H$ copies of self-attention in parallel, each with its own weights (each is a <b>head</b>). Each head uses a query/key/value dimension $D_H$, usually $D_H=D/H$ so inputs and outputs have the same size. Stack the $H$ outputs and fuse them with an output projection $W_O$ of shape $[HD_H\times D]$. In practice all heads are computed together with batched matrix multiplies.</p>
${panel('Self-attention is four matrix multiplies', `<div class="controls"><div class="ctl"><label>Sequence length N <output id="nN_v"></output></label><input type="range" id="nN" min="2" max="6" step="0.1" value="5"></div><div class="ctl"><label>Heads H <output id="nH_v"></output></label><input type="range" id="nH" min="1" max="128" value="64"></div><div class="ctl"><label>Model dim D <output id="nD_v"></output></label><input type="range" id="nD" min="256" max="12288" step="256" value="4096"></div></div><div class="readout" id="memOut"></div>`)}
${table(['','Recurrent Neural Network','Convolution','Self-Attention'],[['Works on','1D ordered sequences','N-dimensional grids','Sets of vectors'],['Strength','(+) Good at long sequences in theory: O(N) compute and memory','(+) Parallelizable: outputs computed in parallel','(+) Great for long sequences: each output depends directly on all inputs. (+) Highly parallel: just 4 matmuls'],['Weakness','(-) Not parallelizable: hidden states computed sequentially','(-) Bad for long sequences: many layers needed to build large receptive fields','(-) Expensive: O(N²) compute, O(N) memory (with Flash Attention)']])}
<p class="callout key">"Attention is all you need" (Vaswani et al., NeurIPS 2017): of the three ways of processing sequences, self-attention won, and the Transformer uses it everywhere.</p>`,
  init(root){
    const src=['we','see','the','sky'], out=['vemos','el','cielo','[STOP]'], W=[[.45,.45,.05,.05],[.05,.05,.8,.1],[.03,.02,.1,.85],[.25,.25,.25,.25]]; let sel=0;
    $('#attBtns',root).innerHTML=out.map((w,i)=>`<button class="stepchip ${i===0?'on':''}" data-i="${i}">${w}</button>`).join('');
    const draw=()=>{ $$('#attBtns .stepchip',root).forEach((b,i)=>b.classList.toggle('on',i===sel));
      $('#attBars',root).innerHTML=`<h4>Weights a<sub>${sel+1},i</sub> for "${out[sel]}"</h4>`+src.map((w,i)=>`<div class="flow" style="margin:5px 0"><div style="width:50px">${w}</div><div style="flex:1;background:var(--surface2);height:20px;border-radius:5px;overflow:hidden"><div style="width:${W[sel][i]*100}%;height:100%;background:var(--c1)"></div></div><b style="width:44px;text-align:right">${W[sel][i].toFixed(2)}</b></div>`).join('')+`<p class="small">Context $c_{${sel+1}}=\\sum_i a_{${sel+1},i}h_i$ is dominated by "${src[W[sel].indexOf(Math.max(...W[sel]))]}".</p>`;
      $('#attHeat',root).innerHTML=matHTML(W,'All attention weights (rows: outputs, columns: inputs)',{rows:out,cols:src}); typeset($('#attBars',root)); };
    $$('#attBtns .stepchip',root).forEach(b=>b.onclick=()=>{sel=+b.dataset.i;draw();}); draw();
    // self-attention calculator
    const toks=['the','cat','sat','down'], r=seeded(42); const X0=toks.map(()=>[0,1,2,3].map(()=>+(randn(r)*0.9).toFixed(2)));
    const WQ=[0,1,2,3].map(()=>[0,1,2].map(()=>+(randn(r)*0.7).toFixed(2))), WK=[0,1,2,3].map(()=>[0,1,2].map(()=>+(randn(r)*0.7).toFixed(2))), WV=[0,1,2,3].map(()=>[0,1,2].map(()=>+(randn(r)*0.7).toFixed(2)));
    let perm=[0,1,2,3], pos=false;
    const sa=()=>{ const mag=+$('#saMag',root).value, sc=$('#saScale',root).checked, mk=$('#saMask',root).checked;
      const X=perm.map((p,i)=>X0[p].map((v,j)=>v*mag + (pos?(j%2===0?Math.sin(i/10**(j/4)):Math.cos(i/10**((j-1)/4))):0)));
      const Q=matmul(X,WQ), K=matmul(X,WK), V=matmul(X,WV); const d=3;
      const E=matmul(Q,T_(K)).map((row,i)=>row.map((v,j)=> mk&&j>i ? -Infinity : (sc? v/Math.sqrt(d) : v)));
      const A=E.map(row=>{ const f=row.filter(isFinite); const m=Math.max(...f); const e=row.map(v=>isFinite(v)?Math.exp(v-m):0); const s=sum(e); return e.map(v=>v/s); }); const Y=matmul(A,V);
      const names=perm.map(p=>toks[p]);
      $('#saOut',root).innerHTML=matHTML(X,'X (inputs)',{rows:names})+matHTML(Q,'Q = XW_Q')+matHTML(K,'K = XW_K')+matHTML(V,'V = XW_V')+'<br>'+matHTML(E,`E = QKᵀ${sc?'/√D':''}`,{rows:names,cols:names})+matHTML(A,'A = softmax(E)',{rows:names,cols:names})+matHTML(Y,'Y = AV (outputs)',{rows:names});
      const peak=Math.max(...A.flat()); $('#saTxt',root).innerHTML=`Largest attention weight: <b>${peak.toFixed(2)}</b>. `+(peak>.9?'The softmax is nearly one-hot (saturated): gradients through it are tiny. Scaling by √D prevents this as dimensions grow.':'Weights are spread out, so gradients flow to many inputs.')+(mk?' With the causal mask, row i only attends to positions ≤ i (upper triangle is -∞ → weight 0).':'')+(perm.join()!=='0,1,2,3'?' Inputs were permuted: each output row is the same as before, just in a new order'+(pos?', except that positional encodings now change the values.':'.'):''); };
    ['saScale','saMask'].forEach(k=>$('#'+k,root).onchange=sa); bindRange(root,'saMag',sa);
    $('#saPerm',root).onclick=()=>{ perm=[perm[2],perm[0],perm[3],perm[1]]; sa(); };
    $('#saPos',root).onclick=e=>{ pos=!pos; e.target.textContent='Add positional encoding: '+(pos?'on':'off'); sa(); }; sa();
    const mem=()=>{ const N=Math.round(10**+$('#nN',root).value), H=+$('#nH',root).value, D=+$('#nD',root).value; $('#nN_v',root).textContent=N.toLocaleString();
      const bytes=H*N*N*2; const tb=bytes/2**40, gb=bytes/2**30; const flops=4*N*D*D*2+2*N*N*D*2;
      $('#memOut',root).textContent=`1. QKV projection   [N×D]·[D×3HD_H] → [N×3HD_H]\n2. QK similarity    [H×N×D_H]·[H×D_H×N] → [H×N×N]\n3. V-weighting      [H×N×N]·[H×N×D_H] → [H×N×D_H]\n4. Output projection [N×HD_H]·[HD_H×D] → [N×D]\n\nAttention weights H×N×N in 16-bit floats: ${gb>=1?Math.round(gb).toLocaleString()+' GB'+(gb>=1000?' ('+(gb/1000).toFixed(3)+' TB)':''):(bytes/2**20).toFixed(2)+' MB'}\nApprox. FLOPs per layer: ${flops.toExponential(2)}  (the N² term dominates when N ≫ D)\n\n`+(gb>500?'GPUs do not have that much memory! Flash Attention computes steps 2 and 3 together without storing the full N×N matrix, so memory becomes O(N) (Dao et al., 2022).':'Fits in memory at this length; at N = 100,000 with H = 64 it would take 1.192 TB.'); };
    ['nH','nD'].forEach(k=>bindRange(root,k,mem)); $('#nN',root).oninput=mem; mem();
  },
  quiz:[
    {q:'What problem of the basic Seq2Seq RNN does attention solve?', o:['Too many parameters in the decoder','The input is bottlenecked through a single fixed-size context vector','The softmax cannot be computed','RNNs cannot be trained with backpropagation'], a:1, e:'Attention builds a new context vector at every decoder step from all encoder states.'},
    {q:'Why are dot-product similarities divided by $\\sqrt{D}$?', o:['To make them positive','To keep large values from saturating the softmax and shrinking gradients','To reduce memory use','To make attention permutation equivariant'], a:1, e:'Dot products grow with dimension; scaling keeps the softmax in a well-behaved range.'},
    {q:'In masked (causal) self-attention, future positions are handled by:', o:['Deleting their value vectors','Setting their similarity scores to $-\\infty$ before the softmax','Multiplying queries by zero','Adding positional encodings'], a:1, e:'$e^{-\\infty}=0$, so masked positions receive zero attention weight.'}
  ]
});

LAB.add({
  id:'transformer', group:'Attention and Transformers', title:'The Transformer', slides:'260-261', source:'The Illustrated Transformer', keywords:'encoder decoder embedding positional encoding residual layer norm multi-head 512 64 8 heads',
  html: R`
<p>The Transformer (Vaswani et al., "Attention Is All You Need," 2017) was introduced for machine translation. Seen as a black box, it takes a sentence in one language and outputs its translation. Inside are an <b>encoding component</b> (a stack of encoders) and a <b>decoding component</b> (a stack of the same number of decoders). The paper stacks six of each; there is nothing magical about six. The encoders share a structure but not weights. This section follows Jay Alammar's <a href="https://jalammar.github.io/illustrated-transformer/" target="_blank" rel="noopener">The Illustrated Transformer</a>.</p>
${panel('Follow one sentence through the whole Transformer', `<div id="tfWalk"></div>`, 'Step by step')}
<h2>Zooming in on each part</h2>
${panel('Explore the architecture', `<div class="grid2"><div id="archSvg"></div><div id="archTxt" class="card" style="margin:0">Click any block.</div></div>`, 'Explore')}
<h2>Self-attention, step by step</h2>
<p>Each word is embedded into a vector of size 512 (only the bottom encoder receives embeddings; higher encoders receive the output of the one below). For each word we create a <b>query</b>, a <b>key</b>, and a <b>value</b> vector of size 64 by multiplying the embedding by three trained matrices $W^Q$, $W^K$, $W^V$. The smaller size is an architecture choice that keeps multi-head computation roughly constant.</p>
${panel('Score, scale, softmax, sum: "Thinking Machines"', `<p class="small">Process the word "Thinking" (position 1). The article's figure uses scores of 112 and 96. Adjust them to see each step.</p><div class="controls"><div class="ctl"><label>q₁·k₁ (Thinking·Thinking) <output id="s1_v"></output></label><input type="range" id="s1" min="0" max="160" value="112"></div><div class="ctl"><label>q₁·k₂ (Thinking·Machines) <output id="s2_v"></output></label><input type="range" id="s2" min="0" max="160" value="96"></div><div class="ctl"><label>d<sub>k</sub> <output id="dk_v"></output></label><input type="range" id="dk" min="1" max="256" value="64"></div></div><div class="flow" id="tmFlow"></div><div class="readout" id="tmOut" style="margin-top:10px"></div>`)}
<ol><li>Create query, key, and value vectors for each word.</li><li><b>Score</b> each word against the current one: $q_1\cdot k_1$, $q_1\cdot k_2$, ...</li><li>Divide by $\sqrt{d_k}=\sqrt{64}=8$ for more stable gradients.</li><li>Apply <b>softmax</b> so the scores are positive and sum to 1.</li><li>Multiply each value vector by its softmax score: keep relevant words, drown out irrelevant ones (e.g., multiplying by 0.001).</li><li><b>Sum</b> the weighted value vectors to get the self-attention output $z_1$.</li></ol>
<p>In matrix form, pack the embeddings into $X$ (one row per word), compute $Q=XW^Q$, $K=XW^K$, $V=XW^V$, and $Z=\operatorname{softmax}\!\big(QK^\top/\sqrt{d_k}\big)V$.</p>
${panel('What does "it" refer to?', `<p class="small">"The animal didn't cross the street because it was too tired." Self-attention lets the encoder bake understanding of related words into "it." Click a word; switch heads (weights are illustrative).</p><div class="seg" id="headSeg"><button class="on" data-v="0">Head 1</button><button data-v="1">Head 2</button><button data-v="2">Both heads</button></div><div id="itSvg" style="margin-top:10px;overflow-x:auto"></div><p class="small" id="itTxt"></p>`)}
<h2>Multi-headed attention</h2>
<p>The Transformer uses <b>8 heads</b>, each with its own randomly initialized $W^Q,W^K,W^V$, producing 8 different $Z$ matrices. The feed-forward layer expects one matrix, so the 8 are concatenated and multiplied by an extra weight matrix $W^O$. Benefits: the model can focus on different positions, and it gets multiple "representation subspaces." When encoding "it," one head focuses mostly on "the animal" while another focuses on "tired."</p>
<h2>Positional encoding</h2>
<p>To account for word order, a vector is added to each input embedding. The values follow a pattern the model learns to use, so distances between words become meaningful. The paper uses sines and cosines of different frequencies (interleaved); the Tensor2Tensor version concatenates a sine half and a cosine half. A big advantage: it extends to sequences longer than any seen in training.</p>
$$PE_{(pos,2i)}=\sin\!\big(pos/10000^{2i/d}\big),\qquad PE_{(pos,2i+1)}=\cos\!\big(pos/10000^{2i/d}\big)$$
${panel('Positional encoding heatmap', `<div class="controls"><div class="ctl"><label>Model dimension d <output id="pd_v"></output></label><input type="range" id="pd" min="16" max="512" step="16" value="128"></div><div class="ctl"><label>Position to inspect <output id="pp_v"></output></label><input type="range" id="pp" min="0" max="49" value="10"></div></div><canvas class="plot" id="peCv"></canvas><canvas class="plot" id="peVec" style="margin-top:10px"></canvas>`)}
<h2>Residuals, the decoder, and the output layer</h2>
<div class="grid3"><div class="mini"><h4>Residuals and layer norm</h4><p>Every sub-layer (self-attention, feed-forward) in every encoder and decoder has a residual connection around it, followed by layer normalization.</p></div><div class="mini"><h4>Decoder</h4><p>The top encoder's output becomes $K$ and $V$ for every decoder's <b>encoder-decoder attention</b> (queries come from the layer below). Decoder self-attention is <b>masked</b>: positions can attend only to earlier positions (future set to $-\infty$). Output is produced one word per step and fed back in until an end symbol appears.</p></div><div class="mini"><h4>Final linear and softmax</h4><p>A linear layer projects the decoder output to a logits vector with one cell per vocabulary word (10,000 cells for a 10,000-word vocabulary). Softmax turns logits into probabilities and the highest-probability word is chosen.</p></div></div>
${panel('Decoding: greedy versus beam search', `<p class="small">Toy translation of the Spanish "soy estudiante" into English. Greedy decoding keeps only the best word at each step; beam search keeps the top <b>beam_size</b> partial hypotheses.</p><div class="seg" id="beamSeg"><button class="on" data-v="1">Greedy (beam 1)</button><button data-v="2">Beam search (beam 2)</button></div><div id="beamOut" style="margin-top:10px"></div>`)}
<p class="small muted">Training recap from the article: with a toy output vocabulary of six words ("a," "am," "i," "thanks," "student," "&lt;eos&gt;"), each target word is one-hot encoded. For a one-word example such as "gracias" → "thanks," the untrained model's distribution is compared with the target (cross-entropy or KL divergence) and backpropagation nudges it toward the one-hot target. For "soy estudiante" → "i am a student" (the article uses French), the model should output five distributions in turn, ending with &lt;eos&gt;. Real vocabularies are 30,000 to 50,000 words.</p>`,
  init(root){
    const B={emb:['Embeddings (512)','Each input word becomes a 512-dimensional vector. Only the bottom encoder receives embeddings.'],pe:['Positional encoding','Added to each embedding so the model knows word order.'],esa:['Encoder self-attention','Each position attends to all positions in the previous layer of the encoder. 8 heads, q/k/v size 64.'],eff:['Encoder feed-forward','The same feed-forward network is applied independently to each position, so positions can be processed in parallel.'],add:['Add and normalize','Residual connection around each sub-layer, followed by layer normalization.'],dsa:['Masked decoder self-attention','Each output position may only attend to earlier output positions; future positions are set to -∞ before softmax.'],eda:['Encoder-decoder attention','Queries come from the decoder layer below; keys and values come from the top encoder output. Lets every decoder position look at the whole input.'],dff:['Decoder feed-forward','Position-wise feed-forward network, as in the encoder.'],lin:['Linear + softmax','Projects to one logit per vocabulary word, then softmax gives probabilities for the next word.'],stack:['×6 stacks','The paper stacks 6 encoders and 6 decoders. They share structure but not weights.']};
    const bx=(k,x,y,w,h,t,c)=>`<g class="clickable" data-k="${k}" style="cursor:pointer"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${c}" stroke="var(--border)"/><text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" font-size="11" fill="var(--text)">${t}</text></g>`;
    $('#archSvg',root).innerHTML=`<svg viewBox="0 0 330 330" width="100%"><rect x="10" y="70" width="140" height="190" rx="12" fill="none" stroke="var(--primary)" stroke-dasharray="5 4"/><rect x="175" y="40" width="145" height="220" rx="12" fill="none" stroke="var(--primary)" stroke-dasharray="5 4"/>
      ${bx('stack',40,74,80,18,'Encoder ×6','var(--surface)')}${bx('stack',210,44,80,18,'Decoder ×6','var(--surface)')}
      ${bx('add',20,100,120,24,'Add & Norm','var(--surface2)')}${bx('eff',20,130,120,30,'Feed Forward',alpha(cssVar('--c1'),.25))}${bx('add',20,166,120,24,'Add & Norm','var(--surface2)')}${bx('esa',20,196,120,40,'Multi-Head Self-Attn',alpha(cssVar('--c2'),.3))}
      ${bx('dff',185,70,125,28,'Feed Forward',alpha(cssVar('--c1'),.25))}${bx('add',185,102,125,20,'Add & Norm','var(--surface2)')}${bx('eda',185,126,125,40,'Enc-Dec Attention',alpha(cssVar('--c3'),.3))}${bx('add',185,170,125,20,'Add & Norm','var(--surface2)')}${bx('dsa',185,194,125,40,'Masked Self-Attn',alpha(cssVar('--c4'),.25))}${bx('add',185,238,125,18,'Add & Norm','var(--surface2)')}
      ${bx('pe',20,268,120,22,'+ Positional enc.','var(--surface2)')}${bx('emb',20,296,120,26,'Input embedding','var(--surface2)')}${bx('pe',185,268,125,22,'+ Positional enc.','var(--surface2)')}${bx('emb',185,296,125,26,'Output embedding','var(--surface2)')}${bx('lin',185,8,125,26,'Linear + Softmax',alpha(cssVar('--c5'),.3))}
      <path d="M150 140 C165 140 165 146 185 146" stroke="var(--primary)" fill="none" stroke-width="2"/></svg>`;
    TFW.init($('#tfWalk',root));
    $$('#archSvg g',root).forEach(g=>g.addEventListener('click',()=>{ const b=B[g.dataset.k]; $('#archTxt',root).innerHTML=`<h4>${b[0]}</h4><p>${b[1]}</p>`; }));
    const tm=()=>{ const s1=+$('#s1',root).value, s2=+$('#s2',root).value, dk=+$('#dk',root).value; const r=Math.sqrt(dk); const a=s1/r, b=s2/r; const p=softmax([a,b]);
      $('#tmFlow',root).innerHTML=['Score: '+s1+' , '+s2,`Divide by √${dk} = ${r.toFixed(2)}: ${a.toFixed(2)} , ${b.toFixed(2)}`,`Softmax: ${p[0].toFixed(2)} , ${p[1].toFixed(2)}`,`z₁ = ${p[0].toFixed(2)}·v₁ + ${p[1].toFixed(2)}·v₂`].map((t,i)=>`<div class="box ${i===3?'on':''}">${t}</div>`).join('<span class="arr">&#10140;</span>');
      $('#tmOut',root).textContent=`"Thinking" keeps ${(100*p[0]).toFixed(0)}% of its own value vector and takes ${(100*p[1]).toFixed(0)}% from "Machines".\n`+(dk===1?'Without scaling (d_k = 1) the softmax is fully saturated: 1.00 vs 0.00.':'With d_k = 64 the article shows 14 and 12 → softmax 0.88 and 0.12.'); };
    ['s1','s2','dk'].forEach(k=>bindRange(root,k,tm)); tm();
    const words=['The','animal','didn\'t','cross','the','street','because','it','was','too','tired'];
    const h1=[.08,.55,.02,.02,.03,.08,.02,.12,.02,.02,.04], h2=[.02,.12,.02,.02,.02,.05,.04,.1,.06,.1,.45]; let head=0, focus=7;
    const it=()=>{ const W=words.length*62+20; const base=focus===7?(head===0?h1:head===1?h2:h1.map((v,i)=>(v+h2[i])/2)):words.map((_,i)=>i===focus?.5:.5/(words.length-1));
      let s=`<svg viewBox="0 0 ${W} 150" width="100%" style="min-width:560px">`;
      words.forEach((w,i)=>{ const x=20+i*62+25; s+=`<line x1="${20+focus*62+25}" y1="40" x2="${x}" y2="112" stroke="${head===1&&focus===7?'var(--c2)':'var(--c1)'}" stroke-width="${1+base[i]*16}" opacity="${0.15+base[i]*1.6}"/>`; });
      words.forEach((w,i)=>{ const x=20+i*62; s+=`<g class="clickable" data-i="${i}" style="cursor:pointer"><rect x="${x}" y="14" width="50" height="24" rx="6" fill="${i===focus?'var(--primary)':'var(--surface2)'}" stroke="var(--border)"/><text x="${x+25}" y="30" text-anchor="middle" font-size="11" fill="${i===focus?'var(--primary-ink)':'var(--text)'}">${w}</text><rect x="${x}" y="114" width="50" height="24" rx="6" fill="${alpha(cssVar('--c1'),Math.min(1,base[i]*2))}" stroke="var(--border)"/><text x="${x+25}" y="130" text-anchor="middle" font-size="11" fill="var(--text)">${w}</text></g>`; });
      $('#itSvg',root).innerHTML=s+'</svg>'; $$('#itSvg g',root).forEach(g=>g.onclick=()=>{focus=+g.dataset.i;it();});
      $('#itTxt',root).textContent= focus===7?(head===0?'Head 1 associates "it" mostly with "animal".':head===1?'Head 2 associates "it" mostly with "tired": a different representation subspace.':'Combined, "it" carries information about both "the animal" and "tired".'):'Only "it" has illustrative learned weights here; other words show a uniform placeholder. Click "it".'; };
    segmented(root,'#headSeg',v=>{head=+v;it();}); it();
    const pe=()=>{ const d=+$('#pd',root).value, pp=+$('#pp',root).value, N=50; const cv=$('#peCv',root); const P=Plot(cv,{xmin:0,xmax:d,ymin:0,ymax:N,height:240,pad:{l:40,b:36,r:10,t:10}});
      const f=(pos,i)=> i%2===0?Math.sin(pos/10000**(i/d)):Math.cos(pos/10000**((i-1)/d)); const cw=(P.w-P.pad.l-P.pad.r)/d, ch=(P.h-P.pad.t-P.pad.b)/N;
      for(let pos=0;pos<N;pos++) for(let i=0;i<d;i++){ const v=f(pos,i); P.ctx.fillStyle=v>=0?alpha(cssVar('--c1'),v):alpha(cssVar('--c4'),-v); P.ctx.fillRect(P.pad.l+i*cw,P.pad.t+pos*ch,cw+.5,ch+.5); }
      P.ctx.strokeStyle=cssVar('--amber'); P.ctx.lineWidth=2; P.ctx.strokeRect(P.pad.l,P.pad.t+pp*ch,d*cw,ch);
      P.ctx.fillStyle=cssVar('--muted'); P.ctx.font='11px Inter'; P.ctx.fillText('dimension i →',P.w/2-30,P.h-10); P.ctx.save(); P.ctx.translate(14,P.h/2+30); P.ctx.rotate(-Math.PI/2); P.ctx.fillText('position →',0,0); P.ctx.restore();
      const Q=Plot($('#peVec',root),{xmin:0,xmax:d-1,ymin:-1.1,ymax:1.1,height:150}); Q.axes({xlabel:`Encoding vector of position ${pp} (blue = +, red = -)`,ny:2}); const xs=[],ys=[]; for(let i=0;i<d;i++){xs.push(i);ys.push(f(pp,i));} Q.line(xs,ys,cssVar('--c1'),1.5); };
    bindRange(root,'pd',pe); bindRange(root,'pp',pe); pe(); onResize(pe);
    const tree={'':[['a',.4],['i',.35],['am',.25]],'a':[['student',.5],['am',.5]],'i':[['am',.9],['is',.1]],'am':[['a',.6],['i',.4]],'a am':[['<eos>',.6],['a',.4]],'i is':[['a',.5],['<eos>',.5]],'i am':[['a',.95],['student',.05]],'i am a':[['student',.9],['<eos>',.1]]};
    const beam=k=>{ let hyps=[['',1]]; const steps=[]; for(let s=0;s<5;s++){ let cand=[]; hyps.forEach(([h,p])=>{ if(h.endsWith('<eos>')){ cand.push([h,p]); return; } const nx=tree[h]||[['<eos>',1]]; nx.forEach(([w,q])=>cand.push([(h?h+' ':'')+w,p*q])); }); cand.sort((a,b)=>b[1]-a[1]); steps.push(cand.slice(0,6)); hyps=cand.slice(0,k); } return {steps,best:hyps[0]}; };
    segmented(root,'#beamSeg',v=>bs(+v)); const bs=k=>{ const {steps,best}=beam(k); $('#beamOut',root).innerHTML=steps.map((c,i)=>`<div class="mini" style="margin:6px 0"><b>Step ${i+1}</b>: ${c.map((h,j)=>`<span class="pill ${j<k?'info':''}" style="margin:2px;${j<k?'':'opacity:.5'}">${h[0]} (${h[1].toFixed(3)})</span>`).join(' ')}</div>`).join('')+`<p>Result: <b>"${best[0]}"</b> with probability ${best[1].toFixed(3)}. `+(k===1?'Greedy grabbed the single most likely first word ("a") and got stuck with a short, low-probability sentence.':'Beam search kept "i" alive at step 1 and found "i am a student" with a higher total probability (the article uses beam_size = 2 and top_beams = 2).')+'</p>'; }; bs(1);
  },
  quiz:[
    {q:'In the original Transformer, the embedding size and the query/key/value vector size are:', o:['64 and 512','512 and 64','512 and 512','8 and 64'], a:1, e:'Embeddings are 512-dimensional; each head projects to 64-dimensional q, k, v vectors (512 / 8 heads).'},
    {q:'In the step-by-step example, why does the vector for "tired" gain noun and animal features after the attention layer?', o:['The embedding of "tired" was wrong','Head 1 gives "tired" a high attention weight on "cat", so the weighted sum of values copies information from "cat"','Positional encoding adds those features','Layer normalization creates them'], a:1, e:'Attention outputs are weighted sums of value vectors; with most weight on "cat", the features of "cat" flow into the representation of "tired".'},
    {q:'In encoder-decoder attention, where do the keys and values come from?', o:['The decoder layer below','The output of the top encoder','The positional encodings','The vocabulary projection'], a:1, e:'Queries come from the decoder; keys and values come from the encoder stack output.'}
  ]
});

LAB.add({
  id:'llm', group:'Attention and Transformers', title:'Transformers in Practice: LLMs, ViT, and Modern Tweaks', source:'CS231n Lecture 8 (2026)', keywords:'transformer block layer norm mlp gpt llm vision transformer vit pre-norm rmsnorm swiglu mixture of experts moe',
  html: R`
<h2>The Transformer block</h2>
<p>Input: a set of vectors $x$. Output: a set of vectors $y$. Self-attention is the <b>only interaction between vectors</b>; layer normalization and the MLP work on each vector independently. The block is highly scalable and parallelizable: most of the compute is just <b>6 matmuls</b> (4 from self-attention, 2 from the MLP). The MLP (also called FFN) is usually two layers, classically $D\to4D\to D$.</p>
${panel('Post-norm (original) versus pre-norm block', `<div class="seg" id="normSeg"><button class="on" data-v="post">Post-Norm (2017)</button><button data-v="pre">Pre-Norm (common today)</button></div><div class="grid2" style="margin-top:10px"><div id="blkSvg"></div><div id="blkTxt" class="card" style="margin:0"></div></div>`)}
<div class="mini"><h4>Layer normalization (Ba et al., 2016)</h4><p>For each vector $h_i$ of size $D$: $\mu_i=\frac1D\sum_j h_{i,j}$, $\sigma_i=\big(\frac1D\sum_j(h_{i,j}-\mu_i)^2\big)^{1/2}$, $z_i=(h_i-\mu_i)/\sigma_i$, $y_i=\gamma\odot z_i+\beta$, with learned scale $\gamma$ and shift $\beta$.</p></div>
<h2>A Transformer is a stack of identical blocks</h2>
<p>The architecture has not changed much since 2017, but it has gotten a lot bigger.</p>
${panel('Model scale explorer', `<div class="controls"><div class="ctl"><label>Preset</label><select id="mPre"><option value="0">Original (Vaswani 2017)</option><option value="1">GPT-2 (2019)</option><option value="2" selected>GPT-3 (2020)</option><option value="3">Custom</option></select></div><div class="ctl"><label>Blocks L <output id="mL_v"></output></label><input type="range" id="mL" min="1" max="128" value="96"></div><div class="ctl"><label>Width D <output id="mD_v"></output></label><input type="range" id="mD" min="256" max="16384" step="128" value="12288"></div><div class="ctl"><label>Vocabulary V</label><input type="number" id="mV" value="50257"></div></div><div class="readout" id="mOut"></div>`)}
<h2>Transformers for language modeling (LLMs)</h2>
<div class="flow"><div class="box">Tokens</div><span class="arr">&#10140;</span><div class="box">Embedding matrix [V×D]<br><small>lookup table</small></div><span class="arr">&#10140;</span><div class="box">Transformer blocks<br><small>masked self-attention</small></div><span class="arr">&#10140;</span><div class="box">Projection [D×V]</div><span class="arr">&#10140;</span><div class="box on">Softmax + cross-entropy<br><small>predict next token</small></div></div>
<p>Each token can only see the tokens before it (masked attention), so the model is trained to predict the next token at every position: "Attention is all you" → "need."</p>
<h2>Vision Transformers (ViT)</h2>
<p>"An Image is Worth 16×16 Words" (Dosovitskiy et al., ICLR 2021): break the image into patches, flatten each patch and apply a linear transform to get a $D$-dimensional vector (equivalently, a 16×16 convolution with stride 16, 3 input channels, and $D$ output channels), add positional encodings for the 2D position of each patch, and run a Transformer <b>without masking</b> so every patch sees every other patch. Average-pool the $N\times D$ outputs to $1\times D$ and apply a linear layer $D\to C$ for class scores.</p>
${panel('Patch calculator', `<div class="controls"><div class="ctl"><label>Image size <output id="vI_v"></output></label><input type="range" id="vI" min="64" max="512" step="32" value="224"></div><div class="ctl"><label>Patch size <output id="vP_v"></output></label><input type="range" id="vP" min="4" max="32" step="4" value="16"></div></div><div class="grid2"><canvas class="plot" id="vCv"></canvas><div class="readout" id="vOut"></div></div>`)}
<h2>Tweaking Transformers</h2>
<div class="grid2"><div class="mini"><h4>Pre-Norm</h4><p>In the original block, layer norm sits outside the residual connections, so the model cannot easily learn the identity function. Moving normalization inside the residual, before self-attention and the MLP, makes training more stable (Baevski and Auli, 2018).</p></div>
<div class="mini"><h4>QK-Norm and RMSNorm</h4><p>QK-Norm normalizes queries and keys before computing similarities, preventing gradient spikes. RMSNorm (Zhang and Sennrich, 2019) drops the mean: $y_i=\frac{x_i}{\mathrm{RMS}(x)}\gamma_i$ with $\mathrm{RMS}(x)=\sqrt{\varepsilon+\frac1N\sum_i x_i^2}$.</p></div>
<div class="mini"><h4>SwiGLU MLP</h4><p>Classic: $Y=\sigma(XW_1)W_2$ with $W_1:[D\times4D]$, $W_2:[4D\times D]$. SwiGLU (Shazeer, 2020): $Y=(\sigma(XW_1)\odot XW_2)W_3$ with $W_1,W_2:[D\times H]$ and $W_3:[H\times D]$. Setting $H=8D/3$ keeps the same total parameters. In the paper's words, the success is attributed "to divine benevolence."</p></div>
<div class="mini"><h4>Mixture of Experts (MoE)</h4><p>Learn $E$ separate MLPs (experts) per block; each token is routed to $A<E$ active experts. Parameters grow by $E$ but compute only by $A$ (Shazeer et al., 2017).</p></div></div>
${panel('Mixture-of-experts calculator', `<div class="controls"><div class="ctl"><label>Routed experts E <output id="eE_v"></output></label><input type="range" id="eE" min="1" max="256" value="128"></div><div class="ctl"><label>Active experts A <output id="eA_v"></output></label><input type="range" id="eA" min="1" max="16" value="8"></div><div class="ctl"><label>Shared experts <output id="eS_v"></output></label><input type="range" id="eS" min="0" max="4" value="1"></div></div><div class="readout" id="eOut"></div><p class="small muted">Lecture example: Gemma 4 26B-A4B (April 2026) has 1 shared expert and 128 routed experts; each token selects 8 of 128, so only about 4B of 26B parameters are active per token.</p>`)}
<p class="callout key">Summary: Transformers are the backbone of today's large AI models, used for language, vision, speech, and more, including the time-series foundation models in the forecasting part of this lab.</p>`,
  init(root){
    const nb=v=>{ const pre=v==='pre'; const bx=(y,t,c)=>`<rect x="70" y="${y}" width="150" height="30" rx="7" fill="${c}" stroke="var(--border)"/><text x="145" y="${y+19}" text-anchor="middle" font-size="12" fill="var(--text)">${t}</text>`;
      const items= pre?[['LN',alpha(cssVar('--c5'),.25)],['Self-Attention',alpha(cssVar('--c2'),.3)],['+',null],['LN',alpha(cssVar('--c5'),.25)],['MLP',alpha(cssVar('--c1'),.25)],['+',null]]:[['Self-Attention',alpha(cssVar('--c2'),.3)],['+',null],['Layer Norm',alpha(cssVar('--c5'),.25)],['MLP',alpha(cssVar('--c1'),.25)],['+',null],['Layer Norm',alpha(cssVar('--c5'),.25)]];
      let y=300, s=`<svg viewBox="0 0 300 340" width="100%" style="max-width:320px"><text x="145" y="330" text-anchor="middle" font-size="12" fill="var(--muted)">x₁ x₂ x₃ x₄</text>`; let resStart=315;
      items.forEach(it=>{ if(it[0]==='+'){ y-=34; s+=`<circle cx="145" cy="${y+15}" r="11" fill="var(--surface)" stroke="var(--primary)"/><text x="145" y="${y+20}" text-anchor="middle" font-size="14" fill="var(--primary)">+</text><path d="M145 ${resStart} H40 V${y+15} H134" stroke="var(--primary)" fill="none" stroke-dasharray="4 3"/>`; resStart=y+15; } else { y-=40; s+=bx(y,it[0],it[1]); } });
      s+=`<text x="145" y="${y-8}" text-anchor="middle" font-size="12" fill="var(--muted)">y₁ y₂ y₃ y₄</text></svg>`; $('#blkSvg',root).innerHTML=s;
      $('#blkTxt',root).innerHTML= pre?'<h4>Pre-Norm</h4><p>Normalization is moved inside the residual branch, before self-attention and the MLP. The residual path is a clean identity highway, which makes deep stacks train more stably.</p>':'<h4>Post-Norm</h4><p>The original design: sub-layer, then add the residual, then layer norm. Normalization sits on the residual path itself, so the block cannot easily learn the identity function.</p>'; };
    segmented(root,'#normSeg',nb); nb('post');
    const pres=[[12,1024,16,512,'213M',32000],[48,1600,25,1024,'1.5B',50257],[96,12288,96,2048,'175B',50257]];
    const ms=()=>{ const L=+$('#mL',root).value, D=+$('#mD',root).value, V=+$('#mV',root).value||0; const blk=12*L*D*D, emb=V*D; const fmtB=n=>n>=1e9?(n/1e9).toFixed(1)+'B':(n/1e6).toFixed(0)+'M'; const p=+$('#mPre',root).value;
      $('#mOut',root).textContent=(p<3?`Reported: ${pres[p][0]} blocks, D = ${pres[p][1]}, H = ${pres[p][2]} heads, context N = ${pres[p][3]}, ${pres[p][4]} parameters\n\n`:'')+`Estimate per block: 4D² (attention: Q, K, V, O) + 8D² (MLP D→4D→D) = 12D² = ${fmtB(12*D*D)}\nAll blocks: 12·L·D² = ${fmtB(blk)}\nEmbeddings: V·D = ${fmtB(emb)}\nTotal ≈ ${fmtB(blk+emb)}`; };
    $('#mPre',root).onchange=()=>{ const p=+$('#mPre',root).value; if(p<3){ $('#mL',root).value=pres[p][0]; $('#mD',root).value=pres[p][1]; $('#mV',root).value=pres[p][5]; $('#mL_v',root).textContent=pres[p][0]; $('#mD_v',root).textContent=pres[p][1]; } ms(); };
    bindRange(root,'mL',()=>{ $('#mPre',root).value=3; ms(); }); bindRange(root,'mD',()=>{ $('#mPre',root).value=3; ms(); }); $('#mV',root).oninput=ms; $('#mPre',root).value=2; $('#mPre',root).onchange();
    const vit=()=>{ const I=+$('#vI',root).value, Pp=+$('#vP',root).value; const n=Math.floor(I/Pp); const P=Plot($('#vCv',root),{xmin:0,xmax:I,ymin:0,ymax:I,height:240,pad:{l:20,r:20,t:10,b:10}}); const cx=P.ctx; const side=Math.min(P.w-40,P.h-20); const x0=(P.w-side)/2, y0=10;
      const g=cx.createLinearGradient(x0,y0,x0+side,y0+side); g.addColorStop(0,alpha(cssVar('--c1'),.55)); g.addColorStop(1,alpha(cssVar('--c3'),.55)); cx.fillStyle=g; cx.fillRect(x0,y0,side,side);
      cx.strokeStyle=cssVar('--surface'); cx.lineWidth=1; for(let i=0;i<=n;i++){ const t=i*Pp/I*side; cx.beginPath(); cx.moveTo(x0+t,y0); cx.lineTo(x0+t,y0+side); cx.stroke(); cx.beginPath(); cx.moveTo(x0,y0+t); cx.lineTo(x0+side,y0+t); cx.stroke(); }
      $('#vOut',root).textContent=`Image ${I}×${I}×3, patches ${Pp}×${Pp}×3\nPatches per side: ${I}/${Pp} = ${n}\nSequence length N = ${n}² = ${n*n} tokens\nFlattened patch: ${Pp}·${Pp}·3 = ${Pp*Pp*3} values → linear map to D\nAttention matrix per head: ${(n*n)**2} entries\n\nHalving the patch size multiplies N by 4 and attention cost by 16.`; };
    bindRange(root,'vI',vit); bindRange(root,'vP',vit); vit(); onResize(vit);
    const moe=()=>{ const E=+$('#eE',root).value, A=Math.min(+$('#eA',root).value,E), S=+$('#eS',root).value; $('#eA_v',root).textContent=A;
      $('#eOut',root).textContent=`MLP weights: W1 [D×4D] → [E×D×4D], W2 [4D×D] → [E×4D×D]\nMLP parameters vs dense model: ×${E+S}\nMLP compute per token vs dense model: ×${A+S}\nActive fraction of expert parameters: ${(100*(A+S)/(E+S)).toFixed(1)}%\n\nMassively more parameters (capacity) for a modest increase in compute.`; };
    ['eE','eA','eS'].forEach(k=>bindRange(root,k,moe)); moe();
  },
  quiz:[
    {q:'Inside a Transformer block, how do different token vectors exchange information?', o:['Through the MLP','Only through self-attention','Through layer normalization','They never interact'], a:1, e:'LayerNorm and the MLP act on each vector independently; self-attention is the only interaction.'},
    {q:'A ViT splits a 224×224 image into 16×16 patches. How many tokens does the Transformer see?', o:['14','196','256','768'], a:1, e:'$224/16=14$ patches per side, $14^2=196$ tokens. (768 is the flattened size of one 16×16×3 patch.)'},
    {q:'What does a Mixture-of-Experts layer trade off?', o:['It reduces parameters and compute equally','It multiplies parameters by E while compute grows only with the A active experts','It removes the attention layer','It replaces softmax with ReLU'], a:1, e:'Each token is routed to A < E experts, so capacity grows much faster than per-token compute.'}
  ]
});
/* ================= Group: Time-series Forecasting ================= */
const AIR=[112,118,132,129,121,135,148,148,136,119,104,118,115,126,141,135,125,149,170,170,158,133,114,140,145,150,178,163,172,178,199,199,184,162,146,166,171,180,193,181,183,218,230,242,209,191,172,194,196,196,236,235,229,243,264,272,237,211,180,201,204,188,235,227,234,264,302,293,259,229,203,229,242,233,267,269,270,315,364,347,312,274,237,278,284,277,317,313,318,374,413,405,355,306,271,306,315,301,356,348,355,422,465,467,404,347,305,336,340,318,362,348,363,435,491,505,404,359,310,337,360,342,406,396,420,472,548,559,463,407,362,405,417,391,419,461,472,535,622,606,508,461,390,432];
const NTR=120, H=24; // train 1949-1958, test 1959-1960
const rmse=(a,b)=>Math.sqrt(mean(a.map((v,i)=>(v-b[i])**2)));
const REPORTED=[['SMA',88.47],['WMA',83.64],['EMA',90.81],['ARIMA',18.54],['Prophet',41.51],['Random Forest',36.72],['XGBoost',38.18],['LSTM',41.67],['Chronos-2',19.61]];
function airPlot(cv, fcs, opt={}){ const P=Plot(cv,{xmin:0,xmax:143,ymin:80,ymax:opt.ymax||680,height:opt.height||290}); P.axes({xlabel:'Month (Jan 1949 to Dec 1960)',ylabel:'Passengers (thousands)',nx:12,xfmt:v=>String(1949+Math.round(v/12)).slice(2)});
  P.ctx.fillStyle=alpha(cssVar('--c2'),.07); P.ctx.fillRect(P.x(NTR),P.pad.t,P.x(143)-P.x(NTR),P.h-P.pad.t-P.pad.b);
  P.line(AIR.map((_,i)=>i),AIR,cssVar('--muted'),1.6); fcs.forEach(f=>P.line(f.x,f.y,f.c,f.w||2.5,f.dash)); P.legend([['Actual',cssVar('--muted')]].concat(fcs.filter(f=>f.label).map(f=>[f.label,f.c,f.dash]))); P.text('test',NTR+3,(opt.ymax||680)-30,cssVar('--c2')); return P; }

LAB.add({
  id:'forecasting', group:'Time-series Forecasting', title:'What Is Time-series Forecasting?', slides:'264-267', keywords:'forecasting trend seasonality autocorrelation stationarity',
  html: R`
<p>Time-series forecasting is a field of statistics and machine learning focused on <b>predicting future values of a sequence from its past observations</b>, for example forecasting temperature or vibration trends over the next 24 hours with ARIMA, Prophet, or neural networks.</p>
<h2>Why forecasting differs from ordinary regression</h2>
<div class="grid3"><div class="mini"><h4>Temporal order matters</h4><p>You cannot shuffle data randomly; train on the past and test on the future.</p></div><div class="mini"><h4>Seasonality</h4><p>Repeating patterns (daily, monthly, yearly).</p></div><div class="mini"><h4>Autocorrelation</h4><p>The next value depends on previous values.</p></div><div class="mini"><h4>Trend</h4><p>Upward or downward drift over time.</p></div><div class="mini"><h4>Non-stationarity</h4><p>Statistical properties (mean, variance) change over time.</p></div><div class="mini"><h4>Consequence</h4><p>Models must capture these components or remove them (detrending, differencing) first.</p></div></div>
${panel('Build a time series from its components', `<div class="controls"><div class="ctl"><label>Trend slope <output id="ts_v"></output></label><input type="range" id="ts" min="-1" max="1" step="0.05" value="0.3"></div><div class="ctl"><label>Seasonal amplitude <output id="sa_v"></output></label><input type="range" id="sa" min="0" max="20" value="10"></div><div class="ctl"><label>Season length <output id="sl_v"></output></label><input type="range" id="sl" min="4" max="24" value="12"></div><div class="ctl"><label>Autocorrelation φ <output id="ph_v"></output></label><input type="range" id="ph" min="0" max="0.95" step="0.05" value="0.6"></div><div class="ctl"><label>Noise <output id="ns_v"></output></label><input type="range" id="ns" min="0" max="10" step="0.5" value="3"></div><label class="opt" style="margin:0"><input type="checkbox" id="nst"> Growing variance (non-stationary)</label><label class="opt" style="margin:0"><input type="checkbox" id="shuf"> Shuffle the order</label></div><canvas class="plot" id="tsCv"></canvas><canvas class="plot" id="acfCv" style="margin-top:10px"></canvas><p class="small" id="tsTxt"></p>`)}
<h2>Forecasting methods covered in this lab</h2>
<div class="grid4"><div class="mini"><h4>Statistical models</h4><p>Simple, weighted, and exponential moving averages (SMA, WMA, EMA); ARIMA; Prophet.</p></div><div class="mini"><h4>Classical ML</h4><p>Random Forest; XGBoost.</p></div><div class="mini"><h4>Deep learning</h4><p>LSTM.</p></div><div class="mini"><h4>Foundation models</h4><p>Chronos-2, TimesFM, Toto, TiRex, Moirai, TTM, TabPFN-TS, and TimeGPT.</p></div></div>`,
  init(root){
    const draw=()=>{ const tsl=+$('#ts',root).value, sa=+$('#sa',root).value, sl=+$('#sl',root).value, ph=+$('#ph',root).value, ns=+$('#ns',root).value, nst=$('#nst',root).checked, sh=$('#shuf',root).checked; const r=seeded(13); const N=150; let e=0; let y=[];
      for(let t=0;t<N;t++){ e=ph*e+randn(r)*ns*(nst?(0.3+t/60):1); y.push(50+tsl*t+sa*Math.sin(2*Math.PI*t/sl)+e); }
      if(sh){ const r2=seeded(3); y=y.map(v=>[r2(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }
      const mn=Math.min(...y), mx=Math.max(...y); const P=Plot($('#tsCv',root),{xmin:0,xmax:N-1,ymin:mn-5,ymax:mx+5,height:240}); P.axes({xlabel:'Time',ylabel:'Value'}); P.line(y.map((_,i)=>i),y,cssVar('--c1'),1.8);
      const m=mean(y), v=sum(y.map(a=>(a-m)**2)); const acf=[]; for(let k=0;k<=30;k++){ let s=0; for(let t=k;t<N;t++) s+=(y[t]-m)*(y[t-k]-m); acf.push(s/v); }
      const A=Plot($('#acfCv',root),{xmin:0,xmax:30,ymin:-1,ymax:1,height:170}); A.axes({xlabel:'Lag k',ylabel:'Autocorrelation',ny:4}); const b=1.96/Math.sqrt(N); A.hline(b,cssVar('--muted')); A.hline(-b,cssVar('--muted')); A.hline(0,cssVar('--axis'),[]);
      acf.forEach((a,k)=>{ A.ctx.strokeStyle=cssVar('--c2'); A.ctx.lineWidth=4; A.ctx.beginPath(); A.ctx.moveTo(A.x(k),A.y(0)); A.ctx.lineTo(A.x(k),A.y(a)); A.ctx.stroke(); });
      $('#tsTxt',root).textContent= sh?'Shuffled: the autocorrelation collapses to noise. All the temporal structure the model could exploit is destroyed, which is why time series must never be shuffled.':`Autocorrelation at lag 1 = ${acf[1].toFixed(2)}, at lag ${sl} = ${acf[sl].toFixed(2)}. A slowly decaying ACF signals trend; a bump at the season length signals seasonality.`; };
    ['ts','sa','sl','ph','ns'].forEach(k=>bindRange(root,k,draw)); ['nst','shuf'].forEach(k=>$('#'+k,root).onchange=draw); draw(); onResize(draw);
  },
  quiz:[
    {q:'Why can you not randomly shuffle a time series before splitting into train and test sets?', o:['Shuffling is slow','Order carries the information; shuffling leaks the future into training and destroys autocorrelation','Shuffling changes the mean','Time series have no labels'], a:1, e:'Temporal order matters: train on the past, test on the future.'},
    {q:'A repeating yearly pattern in monthly sales is an example of:', o:['Trend','Seasonality','White noise','Non-stationary variance'], a:1, e:'Seasonality is a pattern that repeats with a fixed period.'},
    {q:'A series whose mean and variance change over time is:', o:['Stationary','Non-stationary','Seasonal only','Autocorrelated only'], a:1, e:'Non-stationarity means the statistical properties are not constant over time.'}
  ]
});

LAB.add({
  id:'statmodels', group:'Time-series Forecasting', title:'Statistical Forecasting Models', slides:'269-281', keywords:'sma wma ema arima prophet moving average differencing rmse airline passengers',
  html: R`
<p>All demos use the classic monthly airline passengers series (1949-1960). The first 120 months train the model and the last 24 months (shaded) are the test horizon. RMSE is computed on the test months.</p>
<div class="grid3"><div class="mini"><h4>Simple Moving Average (SMA)</h4><p>$SMA_t=\frac1k\sum_{i=0}^{k-1}y_{t-i}$. The average of the last $k$ observations. Smaller $k$: more sensitive, less smoothing. Larger $k$: stronger smoothing, slower reaction. A classical statistical method, not an ML model.</p></div>
<div class="mini"><h4>Weighted Moving Average (WMA)</h4><p>$WMA_t=\frac{\sum_{i=0}^{k-1}\omega_i\,y_{t-i}}{\sum_{i=0}^{k-1}\omega_i}$. More recent observations receive larger weights $\omega_i$; unlike SMA, values are not treated equally.</p></div>
<div class="mini"><h4>Exponential Moving Average (EMA)</h4><p>$EMA_t=\alpha\,y_t+(1-\alpha)\,EMA_{t-1}$, $0<\alpha<1$. Weights decay exponentially with age, so EMA reacts faster to recent changes than SMA or WMA.</p></div></div>
${panel('Moving averages', R`<div class="controls"><div class="ctl"><label>Method</label><div class="seg" id="maSeg"><button class="on" data-v="sma">SMA</button><button data-v="wma">WMA</button><button data-v="ema">EMA</button></div></div><div class="ctl"><label>Window $k$ <output id="mk_v"></output></label><input type="range" id="mk" min="2" max="24" value="12"></div><div class="ctl"><label>Smoothing $\alpha$ (EMA) <output id="ma_v"></output></label><input type="range" id="ma" min="0.05" max="0.95" step="0.05" value="0.3"></div></div><canvas class="plot" id="maCv"></canvas><div class="readout" id="maOut" style="margin-top:8px"></div>`)}
<h2>ARIMA(p, d, q)</h2>
<p>ARIMA combines <b>AR</b> (autoregression on $p$ past values), <b>I</b> (integration: differencing $d$ times to make the series stationary), and <b>MA</b> (a moving average of $q$ past forecast errors). It forecasts from past values, past differences, and past errors.</p>
${panel('ARIMA-style forecaster', `<p class="small">This browser demo fits the AR part by least squares on the differenced series (q = 0). Optionally take a seasonal difference at lag 12 first, as seasonal ARIMA does.</p><div class="controls"><div class="ctl"><label>AR order p <output id="ap_v"></output></label><input type="range" id="ap" min="0" max="13" value="1"></div><div class="ctl"><label>Differencing d <output id="ad_v"></output></label><input type="range" id="ad" min="0" max="2" value="0"></div><label class="opt" style="margin:0"><input type="checkbox" id="aSeas" checked> Seasonal difference (lag 12)</label><label class="opt" style="margin:0"><input type="checkbox" id="aLog" checked> Log transform</label></div><canvas class="plot" id="arCv"></canvas><div class="readout" id="arOut" style="margin-top:8px"></div>`)}
<h2>Prophet (Meta)</h2>
<p>Prophet is an additive model designed for business series with strong seasonality, trend changes, holiday effects, missing values, and outliers: $y(t)=g(t)+s(t)+h(t)+\varepsilon_t$, where $g(t)$ is the trend (piecewise linear or logistic growth), $s(t)$ the seasonality (Fourier series for weekly or yearly cycles), $h(t)$ holiday or event effects, and $\varepsilon_t$ noise.</p>
${panel('Additive decomposition in the spirit of Prophet', `<div class="controls"><div class="ctl"><label>Fourier terms <output id="pf_v"></output></label><input type="range" id="pf" min="0" max="6" value="4"></div><div class="ctl"><label>Trend</label><div class="seg" id="ptSeg"><button class="on" data-v="lin">Linear</button><button data-v="pw">Piecewise (changepoint)</button></div></div><label class="opt" style="margin:0"><input type="checkbox" id="pMul"> Multiplicative seasonality</label></div><canvas class="plot" id="prCv"></canvas><div class="grid2"><canvas class="plot" id="prTr"></canvas><canvas class="plot" id="prSe"></canvas></div><div class="readout" id="prOut" style="margin-top:8px"></div>`)}
<h3>Comparison</h3>
${table(['Method','Pros','Cons'],[['SMA','Very easy to compute and interpret; good for noise reduction; works on stationary short-term data','Equal weighting ignores recency; no trend or seasonality; poor long-term forecasts'],['WMA','Emphasizes recent observations; more responsive than SMA','No trend or seasonality; weights are subjective; poor on complex patterns'],['EMA','Strong recency emphasis; smooths noise well; reacts faster','Choice of α is subjective; no trend or seasonality; underperforms on structured series'],['ARIMA','Strong on linear, stationary data; explicit trend via differencing; well-understood statistics','Requires stationarity; p, d, q hard to tune; weak on long-term or strongly seasonal data unless SARIMA is used'],['Prophet','Models trend and seasonality automatically; handles missing data and outliers; easy to tune and interpret','Can overfit small datasets; less accurate on purely linear data; misses very complex nonlinear dynamics']])}
<p>Notebook (reported RMSEs: SMA 88.47, WMA 83.64, EMA 90.81, ARIMA 18.54, Prophet 41.51): ${colab('TimeSeries_Forecasting_Stat_ML.ipynb')}</p>
<div class="card"><b>Other models to explore:</b> StatsForecast (AutoARIMA, AutoETS, AutoTheta, MSTL, Croston); LightGBM and CatBoost via mlforecast; NeuralForecast (N-HiTS, PatchTST, iTransformer, TFT, DLinear); DCRNN and GraphWaveNet for traffic data; AutoGluon-TimeSeries.</div>`,
  init(root){
    const tr=AIR.slice(0,NTR), te=AIR.slice(NTR); const tx=te.map((_,i)=>NTR+i);
    let ma='sma';
    const runMA=()=>{ const k=+$('#mk',root).value, a=+$('#ma',root).value; const sm=[]; let ema=tr[0];
      for(let t=0;t<NTR;t++){ if(ma==='ema'){ ema=t?a*tr[t]+(1-a)*ema:tr[0]; sm.push(ema); } else if(t<k-1) sm.push(null); else { const w=[]; for(let i=0;i<k;i++) w.push(ma==='wma'?k-i:1); sm.push(sum(w.map((wi,i)=>wi*tr[t-i]))/sum(w)); } }
      const last=sm[NTR-1]; const fc=te.map(()=>last); const e=rmse(fc,te);
      airPlot($('#maCv',root),[{x:tr.map((_,i)=>i),y:sm,c:cssVar('--c1'),label:ma.toUpperCase()+' smoothing'},{x:[NTR-1].concat(tx),y:[last].concat(fc),c:cssVar('--c4'),dash:[6,4],label:'Flat forecast'}]);
      $('#maOut',root).textContent=`${ma.toUpperCase()} ${ma==='ema'?'α = '+a:'k = '+k}: forecast = last smoothed value ${last.toFixed(1)} for all 24 months\nTest RMSE (this demo) = ${e.toFixed(2)}   Notebook reported: ${REPORTED[['sma','wma','ema'].indexOf(ma)][1]}\nMoving averages have no notion of trend or seasonality, so a flat line misses both.`; };
    segmented(root,'#maSeg',v=>{ma=v;runMA();}); bindRange(root,'mk',runMA); bindRange(root,'ma',runMA); runMA(); onResize(runMA);
    const runAR=()=>{ const p=+$('#ap',root).value, d=+$('#ad',root).value, se=$('#aSeas',root).checked, lg=$('#aLog',root).checked;
      const f=lg?tr.map(Math.log):tr.slice(); // build transformed series
      const stages=[f]; let z=f.slice(); if(se){ z=z.slice(12).map((v,i)=>v-z[i]); stages.push(z); } for(let i=0;i<d;i++){ z=z.slice(1).map((v,j)=>v-z[j]); stages.push(z); }
      let coef=[], mu=mean(z); if(p>0 && z.length>p+5){ const X=[],Y=[]; for(let t=p;t<z.length;t++){ X.push([1].concat(Array.from({length:p},(_,j)=>z[t-1-j]))); Y.push(z[t]); }
        const XtX=T_(X).map(r=>T_(X).map(c=>r.reduce((s,v,i)=>s+v*c[i],0))); for(let i=0;i<XtX.length;i++) XtX[i][i]+=1e-6; const XtY=T_(X).map(r=>r.reduce((s,v,i)=>s+v*Y[i],0)); coef=solveLin(XtX,XtY); }
      // forecast differenced series
      const zf=z.slice(); for(let h=0;h<H;h++){ let v=p>0&&coef.length?coef[0]+sum(Array.from({length:p},(_,j)=>coef[j+1]*zf[zf.length-1-j])):mu; zf.push(v); }
      let fut=zf.slice(z.length); // integrate back
      for(let s=stages.length-1;s>=1;s--){ const base=stages[s-1]; const lag=(se&&s===1)?12:1; const ext=base.slice(); fut.forEach(v=>ext.push(v+ext[ext.length-lag])); fut=ext.slice(base.length); }
      if(lg) fut=fut.map(Math.exp); const e=rmse(fut,te);
      airPlot($('#arCv',root),[{x:[NTR-1].concat(tx),y:[tr[NTR-1]].concat(fut),c:cssVar('--c3'),label:`ARIMA(${p},${d},0)${se?' with seasonal diff':''}`}]);
      $('#arOut',root).textContent=`Test RMSE (this demo) = ${e.toFixed(2)}   Notebook reported ARIMA RMSE: 18.54\n`+(p>0&&coef.length?`AR coefficients: ${coef.slice(1).map(c=>c.toFixed(3)).join(', ')}\n`:'')+(se?'The seasonal difference removes the yearly pattern, and its mean carries the year-over-year growth (drift); the AR part models what is left. Adding d = 1 on top removes that drift, which hurts here because growth paused in 1958 and resumed in 1959.':'Without seasonal differencing, a low-order AR model cannot reproduce the yearly peaks. Turn it on.'); };
    ['ap','ad'].forEach(k=>bindRange(root,k,runAR)); ['aSeas','aLog'].forEach(k=>$('#'+k,root).onchange=runAR); runAR(); onResize(runAR);
    let tmode='lin';
    const runPr=()=>{ const K=+$('#pf',root).value, mul=$('#pMul',root).checked; const t=tr.map((_,i)=>i), y=mul?tr.map(Math.log):tr;
      const feat=i=>{ const f=[1,i/100]; if(tmode==='pw') f.push(Math.max(0,i-72)/100); for(let k=1;k<=K;k++){ f.push(Math.sin(2*Math.PI*k*i/12)); f.push(Math.cos(2*Math.PI*k*i/12)); } return f; };
      const X=t.map(feat); const XtX=T_(X).map(r=>T_(X).map(c=>r.reduce((s,v,i)=>s+v*c[i],0))); for(let i=0;i<XtX.length;i++) XtX[i][i]+=1e-6; const b=solveLin(XtX,T_(X).map(r=>r.reduce((s,v,i)=>s+v*y[i],0)));
      const nt=tmode==='pw'?3:2; const trend=i=>feat(i).slice(0,nt).reduce((s,v,j)=>s+v*b[j],0), seas=i=>feat(i).slice(nt).reduce((s,v,j)=>s+v*b[j+nt],0);
      const all=AIR.map((_,i)=>i); const back=v=>mul?Math.exp(v):v; const fit=all.map(i=>back(trend(i)+seas(i))); const fc=tx.map(i=>fit[i]); const e=rmse(fc,te);
      airPlot($('#prCv',root),[{x:all.slice(0,NTR),y:fit.slice(0,NTR),c:cssVar('--c5'),w:1.8,label:'Fit'},{x:tx,y:fc,c:cssVar('--c4'),label:'Forecast'}],{height:250});
      const T=Plot($('#prTr',root),{xmin:0,xmax:143,ymin:mul?4.5:50,ymax:mul?6.5:600,height:170}); T.axes({xlabel:'Trend g(t)',nx:6,xfmt:()=>'' ,ny:3}); T.line(all,all.map(trend),cssVar('--c1'),2.5); T.vline(NTR,cssVar('--c2'));
      const S=Plot($('#prSe',root),{xmin:0,xmax:23,ymin:mul?-0.3:-80,ymax:mul?0.3:80,height:170}); S.axes({xlabel:'Seasonality s(t), two years',nx:6,ny:3,xfmt:v=>['J','A','J','O','J','A','J'][Math.round(v/4)]||''}); S.line(Array.from({length:24},(_,i)=>i),Array.from({length:24},(_,i)=>seas(i)),cssVar('--c3'),2.5);
      $('#prOut',root).textContent=`Test RMSE (this demo) = ${e.toFixed(2)}   Notebook reported Prophet RMSE: 41.51\n`+(mul?'Multiplicative seasonality (fit on log scale) lets the yearly swings grow with the level, which matches this series.':'Additive seasonality keeps the yearly swing constant, but in this series the swing grows over time. Try the multiplicative option.'); };
    bindRange(root,'pf',runPr); segmented(root,'#ptSeg',v=>{tmode=v;runPr();}); $('#pMul',root).onchange=runPr; runPr(); onResize(runPr);
  },
  quiz:[
    {q:'In $EMA_t=\\alpha y_t+(1-\\alpha)EMA_{t-1}$, increasing $\\alpha$ makes the EMA:', o:['Smoother and slower','More responsive to recent changes','Equal to the SMA','Ignore the latest value'], a:1, e:'A larger α puts more weight on the current observation.'},
    {q:'What does the "I" (integrated) part of ARIMA do?', o:['Averages past errors','Differences the series to make it stationary','Adds holiday effects','Regresses on past values'], a:1, e:'Differencing d times removes trends so the AR and MA parts model a stationary series.'},
    {q:'In Prophet\'s model $y(t)=g(t)+s(t)+h(t)+\\varepsilon_t$, the term $s(t)$ captures:', o:['Trend','Seasonality via Fourier series','Holiday effects','Noise'], a:1, e:'$g$ is trend, $s$ is seasonality, $h$ is holidays and events, $\\varepsilon$ is noise.'}
  ]
});

/* small regression-tree ensemble for the ML forecasting section */
function buildTree(X,y,idx,depth,mtry,rng,minLeaf=3){
  const m=mean(idx.map(i=>y[i])); if(depth===0||idx.length<2*minLeaf) return {v:m};
  const nf=X[0].length; const feats=[]; while(feats.length<mtry){ const f=Math.floor(rng()*nf); if(!feats.includes(f)) feats.push(f); }
  let best=null; feats.forEach(f=>{ const s=idx.slice().sort((a,b)=>X[a][f]-X[b][f]); let sl=0,sl2=0; const tot=sum(s.map(i=>y[i])), tot2=sum(s.map(i=>y[i]*y[i]));
    for(let k=0;k<s.length-1;k++){ sl+=y[s[k]]; sl2+=y[s[k]]**2; const nl=k+1, nr=s.length-nl; if(nl<minLeaf||nr<minLeaf||X[s[k]][f]===X[s[k+1]][f]) continue; const sse=(sl2-sl*sl/nl)+((tot2-sl2)-(tot-sl)**2/nr); if(!best||sse<best.sse) best={sse,f,t:(X[s[k]][f]+X[s[k+1]][f])/2}; } });
  if(!best) return {v:m}; const L=idx.filter(i=>X[i][best.f]<=best.t), R=idx.filter(i=>X[i][best.f]>best.t);
  return {f:best.f,t:best.t,l:buildTree(X,y,L,depth-1,mtry,rng,minLeaf),r:buildTree(X,y,R,depth-1,mtry,rng,minLeaf)}; }
const treePred=(n,x)=>n.v!==undefined?n.v:treePred(x[n.f]<=n.t?n.l:n.r,x);

LAB.add({
  id:'mlforecast', group:'Time-series Forecasting', title:'Machine Learning for Forecasting', slides:'281-290', keywords:'random forest xgboost lag features lstm lightgbm catboost recursive direct global nhits patchtst tft dlinear autogluon',
  html: R`
<p>Tree ensembles are not time-series aware. To use them, convert the series into a <b>supervised learning problem with lag features</b>: the last $L$ values become the inputs and the next value is the target (for example, the last 12 months predict the next month).</p>
${panel('Turn a series into a supervised table', `<div class="controls"><div class="ctl"><label>Number of lags L <output id="lg_v"></output></label><input type="range" id="lg" min="1" max="12" value="3"></div></div><div id="lagTbl" class="tblwrap"></div>`)}
<div class="grid2"><div class="mini"><h4>Random Forest</h4><p>An ensemble of many decision trees. Each tree learns from a different bootstrap subset of the data and a random subset of features; the final prediction is the <b>average</b> of all trees.</p></div><div class="mini"><h4>XGBoost (Extreme Gradient Boosting)</h4><p>Gradient-boosted decision trees built <b>sequentially</b>: each new tree learns to correct the errors (residuals) of all previous trees.</p></div></div>
${panel('Train tree ensembles in your browser', `<div class="controls"><div class="ctl"><label>Model</label><div class="seg" id="tmSeg"><button class="on" data-v="rf">Random Forest</button><button data-v="gb">Gradient boosting</button></div></div><div class="ctl"><label>Lags <output id="tl_v"></output></label><input type="range" id="tl" min="3" max="13" value="12"></div><div class="ctl"><label>Trees <output id="tn_v"></output></label><input type="range" id="tn" min="5" max="100" step="5" value="30"></div><div class="ctl"><label>Max depth <output id="td_v"></output></label><input type="range" id="td" min="1" max="8" value="5"></div><label class="opt" style="margin:0"><input type="checkbox" id="tDiff"> Model month-to-month differences</label></div><canvas class="plot" id="tCv"></canvas><div class="readout" id="tOut" style="margin-top:8px"></div>`)}
<h2>Forecasting more than one step ahead</h2>
<p>The test set covers 24 months, but a lag model only predicts the <b>next</b> value. There are two common strategies:</p>
<div class="grid2"><div class="mini"><h4>${ico('repeat')} Recursive (iterated)</h4><p>Train one model for $t+1$. Feed each forecast back in as the newest lag to get $t+2$, $t+3$, and so on. Simple and data-efficient, but errors can <b>accumulate</b> over the horizon. The demo above uses this strategy.</p></div><div class="mini"><h4>${ico('git-fork')} Direct</h4><p>Train a separate model (or output) for each horizon $h = 1, \dots, 24$, always from observed lags. No error feedback, but more models to fit and less coherence between horizons. Many neural and foundation models output the whole horizon at once.</p></div></div>
<div class="grid2" style="margin-top:14px"><div class="mini"><h4>${ico('user')} Local models</h4><p>One model per series (classic ARIMA or Prophet). Works well for a few long series.</p></div><div class="mini"><h4>${ico('users')} Global models</h4><p>One model trained across <b>many related series</b> (all machines, stores, or sensors), with series identifiers and calendar features as extra inputs. Tree ensembles and neural networks shine here. Foundation models push this idea to the extreme.</p></div></div>
<div class="mini"><h4>LSTM</h4><p>An RNN designed to learn long-term dependencies. Gates control information flow and ease the vanishing gradient problem, so LSTMs learn trends and seasonal behavior from sequences of past observations (see the LSTM section). Notebook RMSE: 41.67.</p></div>
${panel('Reported test RMSE across all methods (notebook results)', `<div class="seg" id="rkSeg"><button class="on" data-v="slide">Slide order</button><button data-v="sort">Sort by RMSE</button></div><canvas class="plot" id="rkCv" style="margin-top:10px"></canvas>`)}
<h2>Beyond Random Forest and XGBoost</h2>
<p>The lecture lists further machine learning and deep learning forecasters worth exploring:</p>
<div class="grid2"><div class="mini"><h4>${ico('zap')} LightGBM and CatBoost via mlforecast</h4><p>Fast gradient-boosting libraries. Nixtla's <i>mlforecast</i> builds lag, rolling-window, and calendar features automatically and trains one global model over thousands of series.</p></div><div class="mini"><h4>${ico('layers')} N-HiTS</h4><p>A deep MLP model that samples the input at several rates and interpolates hierarchically, so different blocks focus on long-term trend versus short-term fluctuation. Efficient for long horizons.</p></div><div class="mini"><h4>${ico('scan-line')} PatchTST</h4><p>A transformer that splits each series into <b>patches</b> (short windows) used as tokens and treats each channel independently. Patching reappears in most foundation models.</p></div><div class="mini"><h4>${ico('rotate-cw')} iTransformer</h4><p>Inverts the usual layout: each <b>variable</b> (its whole history) becomes one token, so attention learns relationships between variables rather than between time steps.</p></div><div class="mini"><h4>${ico('eye')} Temporal Fusion Transformer (TFT)</h4><p>Combines LSTM encoders, attention, and variable-selection networks. Handles static, past, and known-future covariates and gives interpretable feature importance.</p></div><div class="mini"><h4>${ico('minus')} DLinear</h4><p>Decomposes the series into trend and remainder and fits one linear layer to each. A surprisingly strong baseline that every deep model should beat.</p></div><div class="mini"><h4>${ico('share-2')} DCRNN and GraphWaveNet</h4><p>Graph neural networks for sensor networks such as road traffic: they model how a value at one sensor spreads to its neighbors over time.</p></div><div class="mini"><h4>${ico('wand-sparkles')} AutoGluon-TimeSeries</h4><p>AutoML that trains statistical, tree-based, deep, and pretrained (Chronos) models, then builds a weighted ensemble automatically.</p></div></div>
<div class="callout key">Pretrained time-series foundation models (Chronos, TimesFM, and others) are covered in the next section.</div>
`,
  init(root){
    const lag=()=>{ const L=+$('#lg',root).value; const rows=[]; for(let t=L;t<L+8;t++) rows.push(Array.from({length:L},(_,j)=>AIR[t-L+j]).concat([`<b>${AIR[t]}</b>`]));
      $('#lagTbl',root).innerHTML=table(Array.from({length:L},(_,j)=>`y(t-${L-j})`).concat(['Target y(t)']),rows)+`<p class="small muted">First 8 of ${AIR.length-L} rows built from the airline series.</p>`; };
    bindRange(root,'lg',lag); lag();
    let model='rf';
    const fit=()=>{ const L=+$('#tl',root).value, nT=+$('#tn',root).value, D=+$('#td',root).value, df=$('#tDiff',root).checked; const tr=AIR.slice(0,NTR), te=AIR.slice(NTR);
      const s=df?tr.slice(1).map((v,i)=>v-tr[i]):tr; const X=[],Y=[]; for(let t=L;t<s.length;t++){ X.push(s.slice(t-L,t)); Y.push(s[t]); }
      const r=seeded(17); const idx=X.map((_,i)=>i); let predict;
      if(model==='rf'){ const trees=[]; for(let k=0;k<nT;k++){ const bs=idx.map(()=>Math.floor(r()*idx.length)); trees.push(buildTree(X,Y,bs,D,Math.max(1,Math.round(L/3)),r)); } predict=x=>mean(trees.map(t=>treePred(t,x))); }
      else { const lr=0.1, base=mean(Y); let res=Y.slice(); const trees=[]; for(let k=0;k<nT*3;k++){ const t=buildTree(X,res,idx,Math.min(D,4),L,r,2); trees.push(t); res=res.map((v,i)=>v-lr*treePred(t,X[i])); } predict=x=>base+lr*sum(trees.map(t=>treePred(t,x))); }
      const hist=s.slice(); const out=[]; let lastLevel=tr[NTR-1]; for(let h=0;h<H;h++){ const v=predict(hist.slice(-L)); hist.push(v); if(df){ lastLevel+=v; out.push(lastLevel); } else out.push(v); }
      const e=rmse(out,te); const tx=te.map((_,i)=>NTR+i);
      airPlot($('#tCv',root),[{x:[NTR-1].concat(tx),y:[tr[NTR-1]].concat(out),c:cssVar('--c3'),label:(model==='rf'?'Random Forest':'Gradient boosting')+' forecast'}]); const P=null;
      $('#tOut',root).textContent=`Test RMSE (this demo) = ${e.toFixed(2)}   Notebook reported: ${model==='rf'?'Random Forest 36.72':'XGBoost 38.18'}\nMax forecast = ${Math.max(...out).toFixed(0)}, max training value = ${Math.max(...tr)}\n`+(df?'Modeling differences lets the trees add the trend back, so forecasts can exceed the training range.':'Trees predict averages of training targets, so they cannot extrapolate above the highest training value (505). The 1959-1960 peaks are higher, so the forecast flattens. Try modeling differences.'); };
    segmented(root,'#tmSeg',v=>{model=v;fit();}); ['tl','tn','td'].forEach(k=>bindRange(root,k,fit)); $('#tDiff',root).onchange=fit; fit(); onResize(fit);
    let rk='slide';
    const bars=()=>{ const d=rk==='sort'?REPORTED.slice().sort((a,b)=>a[1]-b[1]):REPORTED; const P=Plot($('#rkCv',root),{xmin:0,xmax:100,ymin:0,ymax:d.length,height:300,pad:{l:110,r:40,t:10,b:36}}); P.axes({xlabel:'Test RMSE (lower is better)',ny:1,yfmt:()=>''});
      d.forEach((m,i)=>{ const y0=P.y(d.length-i-0.15), y1=P.y(d.length-i-0.85); const cat=['SMA','WMA','EMA','ARIMA','Prophet'].includes(m[0])?'--c1':['Random Forest','XGBoost'].includes(m[0])?'--c2':m[0]==='LSTM'?'--c5':'--c3';
        P.ctx.fillStyle=cssVar(cat); P.ctx.fillRect(P.x(0),y1,P.x(m[1])-P.x(0),y0-y1); P.ctx.fillStyle=cssVar('--text'); P.ctx.font='12px Inter'; P.ctx.textAlign='right'; P.ctx.fillText(m[0],P.pad.l-8,(y0+y1)/2+4); P.ctx.textAlign='left'; P.ctx.fillText(m[1].toFixed(2),P.x(m[1])+5,(y0+y1)/2+4); });
      P.legend([['Statistical',cssVar('--c1')],['Classical ML',cssVar('--c2')],['Deep learning',cssVar('--c5')],['Foundation model',cssVar('--c3')]],P.w-170,P.pad.t+14); };
    segmented(root,'#rkSeg',v=>{rk=v;bars();}); bars(); onResize(bars);

  html: R`
<p>A <b>time-series foundation model</b> (TSFM) is a large network pretrained on billions of observations from many domains (energy, retail, traffic, weather, finance, sensors, plus synthetic series). Like a large language model, it learns general patterns once and then forecasts a <b>new series it has never seen</b>, with no training. This is called <b>zero-shot</b> forecasting.</p>
${table(['', 'Local statistical model', 'Global ML model', 'Foundation model'], [

  ['Training needed', 'Fit per series', 'Train once on your data', 'None (zero-shot); optional fine-tuning'],

  ['Examples', 'ARIMA, ETS, Prophet', 'Random Forest, XGBoost, LSTM', 'Chronos-2, TimesFM, Toto, TiRex, Moirai']

<h2>The models in the lecture</h2>
<div class="grid3"><div class="mini"><h4>${ico('box')} Chronos (Amazon)</h4><p>A transformer-based probabilistic forecaster that <b>tokenizes</b> time-series values and generates flexible distributional forecasts across domains. Chronos-2 RMSE on the airline data: <b>19.61</b>.</p></div><div class="mini"><h4>${ico('cloud')} TimeGPT (Nixtla)</h4><p>A general-purpose foundation model trained on massive heterogeneous datasets, giving zero-shot and few-shot forecasts without task-specific tuning.</p></div><div class="mini"><h4>${ico('clock')} TimesFM (Google)</h4><p>A large pretrained transformer producing high-quality forecasts across many patterns with a simple architecture that reads the series in patches.</p></div></div>
<h2>Step 1: turn numbers into tokens</h2>
<p>Transformers work on sequences of tokens. There are three main ways to turn a numeric series into tokens.</p>
<div class="grid3"><div class="mini"><h4>${ico('hash')} Value tokens</h4><p>Scale, then <b>quantize</b> each value into one of a fixed number of bins (original Chronos). One token per time step.</p></div><div class="mini"><h4>${ico('scan-line')} Patches</h4><p>Group consecutive values into a <b>patch</b> and embed it as one token (Chronos-Bolt, Chronos-2, TimesFM, Moirai, Toto, TiRex).</p></div><div class="mini"><h4>${ico('table')} Table rows</h4><p>Describe each time step with features (time index, month, season) and use a <b>tabular</b> model (TabPFN-TS).</p></div></div>
${panel('How Chronos turns numbers into tokens', `<div class="controls"><div class="ctl"><label>Vocabulary size (bins) <output id="cb_v"></output></label><input type="range" id="cb" min="8" max="128" step="8" value="32"></div><div class="ctl"><label>Context window (months) <output id="cw_v"></output></label><input type="range" id="cw" min="12" max="120" step="12" value="48"></div></div><canvas class="plot" id="chCv"></canvas><div id="tokStrip" style="display:flex;flex-wrap:wrap;gap:2px;margin-top:8px"></div><p class="small muted" style="margin-top:6px">Steps: scale the context by its mean absolute value, quantize into uniform bins, and treat each bin id as a token. A language-model-style transformer then predicts the next token distribution, which is mapped back to values to give probabilistic forecasts.</p>`)}
${panel('Patching: fewer tokens, cheaper attention', `<div class="controls"><div class="ctl"><label>Patch length <output id="pl_v"></output></label><input type="range" id="pl" min="0" max="5" value="3"></div><div class="ctl"><label>Context window (months) <output id="pc_v"></output></label><input type="range" id="pc" min="24" max="120" step="12" value="96"></div></div><canvas class="plot" id="pCv"></canvas><div class="readout" id="pOut" style="margin-top:8px"></div>`)}
<p>Self-attention compares every token with every other token, so its cost grows with the <b>square</b> of the number of tokens $n$. With a context of $C$ values and patch length $P$, there are $n = \lceil C/P \rceil$ tokens, and the attention cost falls by roughly $P^2$. Each patch also carries local shape (a rise, a dip), which a single value cannot.</p>
<h2>Step 2: forecast a distribution, not a single line</h2>
<p>Most foundation models output <b>quantiles</b>: for example the 10th, 50th, and 90th percentiles at every future step. The median is the point forecast, and the outer quantiles form a prediction interval. Quantile outputs are trained with the <b>pinball (quantile) loss</b>:</p>
$$L_q(y, \hat{y}_q) = \begin{cases} q\,(y - \hat{y}_q) & \text{if } y \ge \hat{y}_q \\ (1-q)\,(\hat{y}_q - y) & \text{otherwise} \end{cases}$$
<p>For $q = 0.9$, under-forecasting costs 9 times more than over-forecasting, which pushes $\hat{y}_{0.9}$ up until about 90% of outcomes fall below it.</p>
${panel('What a probabilistic forecast looks like', `<div class="controls"><div class="ctl"><label>Prediction interval</label><div class="seg" id="piSeg"><button data-v="50">50%</button><button class="on" data-v="80">80%</button><button data-v="95">95%</button></div></div></div><canvas class="plot" id="qCv"></canvas><div class="readout" id="qOut" style="margin-top:8px"></div><p class="small muted" style="margin-top:6px">Illustration only: the fan comes from a simple seasonal baseline with growth, not from a foundation model. Run the course notebook in Colab to see Chronos-2's own quantiles.</p>`)}
<h2>Step 3: choose a model</h2>
<p>The lecture lists the current open models. Use the filters to match a model to your problem, then click a model for details.</p>
${panel('Foundation model explorer', `<div class="controls" id="fmFilt">${TSFM_FILTERS.map(([k,l])=>`<label class="opt" style="margin:0"><input type="checkbox" data-k="${k}"> ${l}</label>`).join('')}</div><div id="fmBtns" style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0"></div><div id="fmCard"></div><div id="fmTbl" style="margin-top:12px"></div>`, 'Explore')}
<div class="callout warn">Licenses differ even within one family: TimesFM 2.5 is Apache-2.0, while TimesFM-3 weights are non-commercial. Always read the model card before using a model in a product.</div>
<h2>When to use a foundation model</h2>
<div class="grid2"><div class="mini"><h4>${ico('circle-check')} Good fit</h4><p>Little history (new products, new machines), thousands of series, a quick strong baseline, or uncertainty estimates you need without building a model.</p></div><div class="mini"><h4>${ico('circle-alert')} Be careful</h4><p>Very domain-specific dynamics, strict latency or memory limits, or licensing limits. Always compare against simple baselines (seasonal naive, ARIMA) on a held-out period, and check whether benchmark results are vendor-reported.</p></div></div>
<div class="callout src">Model details summarize the official model cards, papers, and release posts for each model (Amazon Chronos, Google Research TimesFM, Datadog Toto, NX-AI TiRex, Salesforce Moirai, IBM Granite Time Series, Prior Labs TabPFN-TS, Nixtla TimeGPT). Benchmark claims are as reported by each developer.</div>`,

  const ln=A=>A.map(r=>{ const m=mean(r), v=mean(r.map(x=>(x-m)**2)); return r.map(x=>(x-m)/Math.sqrt(v+1e-5)); });

  const SRC=['the','cat','is','tired','<eos>'];

  const WQ1=W([[5,0,.5],[4,0,.5],[6,0,.5],[2,1,.5]]), WK1=W([[2,0,.5],[3,0,.5],[5,1,.5]]), WV1=W([[2,0,.5],[3,1,.5],[4,2,.5],[5,3,.5]]);

  const WO=Z(8,8); [[0,2],[1,3],[2,4],[3,5]].forEach(([a,b])=>WO[a][b]=.6); [[4,2],[5,4],[6,5],[7,6]].forEach(([a,b])=>WO[a][b]=.3);
  const rr=(()=>{ let s=7; return ()=>{ s=(s*16807)%2147483647; return s/2147483647-.5; }; })();
  const W1=Array.from({length:8},()=>Array.from({length:16},()=>rr()*.4)), W2=Array.from({length:16},()=>Array.from({length:8},()=>rr()*.4));

  const WQs=W([[0,0,g],[1,1,g]]), WKs=W([[0,0,1],[1,1,1]]), WVs=W([[2,0,.5],[3,1,.5],[4,2,.5],[5,3,.5]]); const WOs=Z(4,8); [[0,2],[1,3],[2,4],[3,5]].forEach(([a,b])=>WOs[a][b]=.3);

import numpy as np
import matplotlib.pyplot as plt

rng = np.random.default_rng(5)
T = 2000
angle = np.linspace(0, 1.7, T)                           # the concept slowly rotates
y = rng.integers(0, 2, T)
sign = np.where(y == 1, 1, -1)[:, None]
X = 1.6 * sign * np.c_[np.cos(angle), np.sin(angle)] + rng.normal(0, .8, (T, 2))

def centroids(X, y): return np.array([X[y == k].mean(axis=0) for k in (0, 1)])
def predict(C, x): return np.argmin(((C - x) ** 2).sum(axis=1))

static = centroids(X[:200], y[:200])
acc_static, acc_adaptive = [], []
for t in range(200, T):
    adaptive = centroids(X[t - 200:t], y[t - 200:t])     # retrain on the last 200 labeled samples
    acc_static.append(predict(static, X[t]) == y[t])
    acc_adaptive.append(predict(adaptive, X[t]) == y[t])

roll = lambda a: np.convolve(a, np.ones(100) / 100, mode="valid")
plt.plot(roll(acc_static), label="static (set and forget)"); plt.plot(roll(acc_adaptive), label="adaptive window")
plt.xlabel("time"); plt.ylabel("rolling accuracy"); plt.legend(); plt.show()
print("Final accuracy: static", np.mean(acc_static[-200:]), " adaptive", np.mean(acc_adaptive[-200:]))`,
