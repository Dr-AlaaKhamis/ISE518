LAB.add({
  id:'deeplearning', group:'Deep Learning', title:'Deep Learning', slides:'172-185', keywords:'ai ml dl genai llm hierarchical representation transfer learning layers neurons',
  html: R`
${panel('From AI to LLMs', `<div class="grid2"><div id="nest"></div><div id="nestTxt" class="card" style="margin:0">Click a layer of the diagram.</div></div>`, 'Explore')}
<p>Deep learning (related to cybernetics, connectionism, deep neural networks, deep structural learning, and deep belief networks) is a sub-field of machine learning characterized by (Deng and Yu, 2014):</p>
<ul><li>A <b>cascade of many layers</b> of nonlinear processing units for feature extraction and transformation; each layer takes the previous layer's output as input.</li><li>Learning in <b>supervised</b> (classification) and/or <b>unsupervised</b> (pattern analysis) manners.</li><li>Learning <b>multiple levels of representation</b> that form a hierarchy of concepts: pixels, edges (1st layer), object parts (2nd layer), objects (3rd layer).</li></ul>
<p class="callout">"The conscious brain of a human cannot identify 4,000 features, but deep learning can." (J. Ambeck-Madsen, Vision Zero International, 2018). Instead of a hand-crafted kernel function followed by an LDA or SVM classifier, the network learns the kernels and ends with a simple classifier.</p>
<h2>Why deep learning?</h2>
${panel('1. Performance of larger networks grows with data', `<div class="controls"><div class="ctl"><label>Amount of data <output id="dat_v"></output></label><input type="range" id="dat" min="0" max="100" value="30"></div></div><canvas class="plot" id="ngCv"></canvas><p id="ngMsg" class="small"></p><p class="small muted">After Andrew Ng, <i>Machine Learning Yearning</i>, 2018. Large networks require HPC to process big data; the availability of HPC and software tools made deep learning practical.</p>`)}
<div class="grid2"><div class="mini"><h4>2. Automatic feature learning</h4><p><b>Traditional:</b> pixels → hand-crafted features (SIFT, HOG, LBP, MSER, Color-SIFT, wavelets, PCA; not learned) → generic trainable classifier (SVM/NN) → class.</p><p><b>Deep:</b> pixels → trainable features (layer 1) → trainable features (layer 2) → layer 3 → class.</p></div>
<div class="mini"><h4>3. Hierarchical representation</h4><p>A natural progression from low-level to high-level structure. It is easier to monitor what is being learned and to guide the machine to better subspaces, and a good lower-level representation can be reused for many distinct tasks.</p></div>
<div class="mini"><h4>4. Transfer learning</h4><p>Take a model pre-trained on a large dataset by somebody else (for example ImageNet) and fine-tune it on your own small dataset: source model and labels → transferred knowledge → target model and labels.</p></div>
<div class="mini"><h4>5. Success stories</h4><p>Speech recognition (Hinton et al., IEEE Signal Processing Magazine, 2012), image classification (Ciresan, Meier, and Schmidhuber, 2012), and the rapid progress of object detection.</p></div></div>
<h2>Number of layers versus number of neurons</h2>
<p>For the same number of parameters you can build a network that is <b>shallow and fat</b> (one wide hidden layer) or <b>deep and thin</b> (many narrow layers). If your data is linearly separable you do not need any hidden layer (linear discriminant analysis would do).</p>
${table(['Hidden layers','Result'],[['0','Only capable of representing linearly separable functions or decisions.'],['1','Can approximate any function that contains a continuous mapping from one finite space to another. Sufficient for the large majority of functions.'],['2','Can represent an arbitrary decision boundary to arbitrary accuracy with rational activation functions and approximate any smooth mapping to any accuracy.'],['> 2','Can learn complex representations (a kind of automatic feature engineering) for later layers.']])}
<p class="small muted">Source: Heaton Research, "The Number of Hidden Layers."</p>
${panel('How many hidden neurons?', R`<div class="controls"><div class="ctl"><label>Input neurons $n_i$</label><input type="number" id="ni" value="10" min="1"></div><div class="ctl"><label>Output neurons $n_o$</label><input type="number" id="no" value="1" min="1"></div><div class="ctl"><label>Training samples $m$</label><input type="number" id="ms" value="1000" min="1"></div><div class="ctl"><label>Scaling factor $\alpha$ <output id="al_v"></output></label><input type="range" id="al" min="2" max="10" value="5"></div></div><div class="grid3" id="nhOut"></div>`)}`,
  init(root){
    const L=[['Artificial Intelligence','Any technique that enables computers to mimic and/or augment biological intelligence.'],['Machine Learning','The ability to learn from experience and observations without being explicitly programmed.'],['Neural Networks','A highly simplified computational model of the biological brain.'],['Deep Learning','Learning representations of data with multiple levels of abstraction using deep neural networks. Examples: CNN, LSTM, autoencoders, transformers.'],['Generative AI','Models that generate new content such as images, text, or audio. Examples: GANs and transformers.'],['Large Language Models','Models focused on processing and generating human-like text. Examples: BERT (Bidirectional Encoder Representations from Transformers) and GPT (Generative Pre-trained Transformer).']];
    $('#nest',root).innerHTML=`<svg viewBox="0 0 320 260" width="100%">${L.map((l,i)=>`<g class="clickable" data-i="${i}" style="cursor:pointer"><rect x="${8+i*18}" y="${8+i*20}" width="${304-i*36}" height="${244-i*40}" rx="16" fill="var(--c1)" fill-opacity="${0.08+i*0.1}" stroke="var(--primary)"/><text x="${20+i*18}" y="${26+i*20}" font-size="12" font-weight="600" fill="var(--text)">${l[0]}</text></g>`).join('')}</svg>`;
    $$('#nest g',root).forEach(g=>g.addEventListener('click',e=>{ e.stopPropagation(); const l=L[+g.dataset.i]; $('#nestTxt',root).innerHTML=`<h4>${l[0]}</h4><p>${l[1]}</p>`; }));
    const ng=()=>{ const d=+$('#dat',root).value; const P=Plot($('#ngCv',root),{xmin:0,xmax:100,ymin:0,ymax:100,height:250}); P.axes({xlabel:'Amount of data',ylabel:'Performance',xfmt:()=>'',yfmt:()=>''});
      const f=[[x=>40*(1-Math.exp(-x/12)),'Traditional learning algorithm','--c4'],[x=>55*(1-Math.exp(-x/22)),'Small neural network','--c2'],[x=>72*(1-Math.exp(-x/35)),'Medium neural network','--c5'],[x=>95*(1-Math.exp(-x/55)),'Large neural network (deep learning)','--c3']];
      f.forEach(q=>P.fn(q[0],cssVar(q[2]),2.5)); P.vline(d,cssVar('--text'),[]); f.forEach(q=>P.dot(d,q[0](d),cssVar(q[2]),5)); P.legend(f.map(q=>[q[1],cssVar(q[2])]));
      const best=f.reduce((b,q)=>q[0](d)>b[0](d)?q:b); $('#ngMsg',root).innerHTML=`With this much data, the best performer is <b>${best[1]}</b>. `+(d<15?'In the small-data regime, ordering is unclear and hand-engineered features matter most.':'Scale (data and model size) drives performance.'); };
    bindRange(root,'dat',ng); ng(); onResize(ng);
    const nh=()=>{ const ni=+$('#ni',root).value||1, no=+$('#no',root).value||1, m=+$('#ms',root).value||1, al=+$('#al',root).value;
      $('#nhOut',root).innerHTML=R`<div class="mini"><h4>Rule 1</h4><div class="big">${Math.round(m/(al*(ni+no)))}</div><p class="small">$n_h=\dfrac{m}{\alpha\,(n_i+n_o)}$, with $\alpha$ usually 2-10.</p></div><div class="mini"><h4>Rule 2</h4><div class="big">${Math.round(2*Math.sqrt((no+2)*m))}</div><p class="small">Hidden nodes enough to learn $m$ samples with negligible error: $n_h=2\sqrt{(n_o+2)\,m}$.</p></div><div class="mini"><h4>Rule 3</h4><div class="big">${Math.min(ni,no)}-${Math.max(ni,no)}</div><p class="small">Between the size of the input layer and the size of the output layer.</p></div>`; typeset($('#nhOut',root)); };
    ['ni','no','ms'].forEach(k=>$('#'+k,root).oninput=nh); bindRange(root,'al',nh); nh();
  },
  quiz:[
    {q:'Which ordering is correct, from broadest to narrowest?', o:['ML ⊃ AI ⊃ DL ⊃ NN','AI ⊃ ML ⊃ NN ⊃ DL','DL ⊃ NN ⊃ ML ⊃ AI','AI ⊃ DL ⊃ ML ⊃ NN'], a:1, e:'Deep learning is a subset of neural networks, which are part of machine learning, which is part of AI.'},
    {q:'With 10 inputs, 1 output, 1,000 training samples, and α = 5, the rule $n_h=m/(\\alpha(n_i+n_o))$ gives about:', o:['5 neurons','18 neurons','55 neurons','200 neurons'], a:1, e:'$1000/(5\\times11)\\approx18$.'},
    {q:'According to the hidden-layer table, a network with zero hidden layers can represent:', o:['Any continuous mapping','Only linearly separable functions','Arbitrary decision boundaries','Hierarchical features'], a:1, e:'Without hidden layers the model is linear in its inputs.'}
  ]
});

LAB.add({
  id:'cnn', group:'Deep Learning', title:'Convolutional Neural Networks (CNN)', slides:'187-207', keywords:'convolution kernel feature map stride padding pooling relu vgg16',
  html: R`
${table(['Model','Primary data','Typical use'],[['Convolutional Neural Network (CNN)','Image, video','Image classification, object detection, computer vision'],['Recurrent Neural Network (RNN)','Sequence, time series','NLP, speech recognition, language generation'],['LSTM (Long Short-Term Memory)','Sequence, time series','Time-series forecasting, long-term dependencies'],['Autoencoder','Various','Anomaly detection, dimensionality reduction, compression'],['Generative Adversarial Network (GAN)','Various','Image generation, data synthesis'],['Transformer','Sequence (text)','Machine translation, language modeling (e.g., ChatGPT)']])}
<h2>Convolution</h2>
<p>Convolution (similar to cross-correlation) takes two functions and measures their overlap. In continuous and discrete form:</p>
$$s(t)=(x*\omega)(t)=\int x(a)\,\omega(t-a)\,da,\qquad s(t)=\sum_{a=-\infty}^{\infty}x(a)\,\omega(t-a)$$
<p>Example (Thrun, Burgard, and Fox, <i>Probabilistic Robotics</i>, 2005): a global localization sensor gives noisy estimates of a car's position. Averaging several measurements, weighted by a probability density $\omega(a)$ over their age $a$, is a convolution.</p>
${panel('1D convolution on a sensor signal', `<div class="controls"><div class="ctl"><label>Kernel</label><div class="seg" id="k1Seg"><button class="on" data-v="box">Moving average</button><button data-v="exp">Exponential (age-weighted)</button><button data-v="gau">Gaussian</button><button data-v="dif">Derivative [-1, 0, 1]</button></div></div><div class="ctl"><label>Kernel width <output id="kw_v"></output></label><input type="range" id="kw" min="3" max="25" step="2" value="9"></div></div><canvas class="plot" id="c1Cv"></canvas><p class="small muted">In predictive maintenance, kernels slide over sensor signals to detect local patterns such as vibration spikes or temperature changes. The derivative kernel highlights the abrupt jump at t = 140.</p>`)}
<p>Over two axes, with a 2D image $I$ and a 2D kernel $K$: $\;S(i,j)=(I*K)(i,j)=\sum_m\sum_n I(m,n)\,K(i-m,\,j-n)$.</p>
${panel('2D convolution, ReLU, and pooling playground', `<div class="controls"><div class="ctl"><label>Input image</label><select id="imgSel"><option value="vert">Vertical bar</option><option value="cross">Cross</option><option value="diag">Diagonal</option><option value="box">Square</option></select></div><div class="ctl"><label>Kernel</label><select id="kerSel"><option value="v">Vertical edge</option><option value="h">Horizontal edge</option><option value="blur">Blur (box)</option><option value="sharp">Sharpen</option><option value="id">Identity</option></select></div><div class="ctl"><label>Stride</label><div class="seg" id="strSeg"><button class="on" data-v="1">1</button><button data-v="2">2</button></div></div><div class="ctl"><label>Zero padding</label><div class="seg" id="padSeg"><button class="on" data-v="0">0</button><button data-v="1">1</button></div></div><label class="opt" style="margin:0"><input type="checkbox" id="reluOn" checked> Apply ReLU</label></div>
<p class="small">Click input pixels to toggle them. Click a feature-map cell to see its calculation.</p>
<div class="grid3"><div><h4>Input (8×8)</h4><div id="inG"></div></div><div><h4>Kernel (3×3)</h4><div id="kG"></div><h4 style="margin-top:10px">Feature map <span id="fmSz" class="tag"></span></h4><div id="fmG"></div></div><div><h4>2×2 max pooling</h4><div id="plG"></div><div class="readout" id="cvCalc" style="margin-top:10px">Click a feature-map cell.</div></div></div>`)}
<div class="grid2"><div class="mini"><h4>Feature map size</h4><p>Controlled by <b>depth</b> (number of filters), <b>stride</b> (pixels the filter moves each step), and <b>padding</b>: $$O=\frac{W-K+2P}{S}+1$$ For a 5×5 image and a 3×3 filter: without padding the output is 3×3; with 1-pixel zero padding it stays 5×5. Padding preserves spatial information and avoids losing edge data.</p></div>
<div class="mini"><h4>Nonlinearity and pooling</h4><p><b>ReLU</b>, output = max(0, input), follows each convolution so the model can learn complex patterns. <b>Pooling</b> (usually max pooling) downsamples the feature map to save computation while preserving the most important information, and makes the network nearly invariant (more precisely, equivariant) to small translations and distortions.</p></div></div>
<p>A ConvNet is a list of layers (CONV, RELU, POOL, FC) that transforms the image volume into an output volume, such as class scores. After feature extraction, feature maps are <b>flattened</b> and passed to fully connected layers for classification (for example, whether maintenance is required). A convolutional layer applies <b>many filters</b>, each learning a different feature pattern.</p>
${panel('VGG16 layer by layer', `<p class="small">Input 224×224×3. All convolutions are 3×3 with stride 1 and padding 1; pooling is 2×2 max with stride 2. Click a row.</p><div id="vgg" class="tblwrap" style="max-height:360px;overflow:auto"></div><div class="readout" id="vggSum" style="margin-top:8px"></div>`, 'Explore')}
<p class="callout src">History (slide notes, after J. Schmidhuber, 2025): Fukushima's neocognitron (1979) introduced convolution and downsampling layers; Fukushima's 1986 video recognized handwritten digits; Wei Zhang et al. (1988) trained the first "modern" 2D CNN by backpropagation; LeCun's work followed in 1989.</p>`,
  init(root){
    let kt='box';
    const c1=()=>{ const w=+$('#kw',root).value; const r=seeded(4); const N=240; const x=[]; for(let t=0;t<N;t++) x.push((t<140?20:32)+3*Math.sin(t/9)+randn(r)*2.2);
      let k=[]; const h=(w-1)/2; for(let i=-h;i<=h;i++){ if(kt==='box') k.push(1); if(kt==='gau') k.push(Math.exp(-(i*i)/(2*(w/5)**2))); if(kt==='exp') k.push(i<=0?Math.exp(i/(w/4)):0); }
      if(kt==='dif') k=[-1,0,1]; const s=sum(k.map(Math.abs))||1; if(kt!=='dif') k=k.map(v=>v/s); const kh=(k.length-1)/2;
      const y=x.map((_,t)=>{ let a=0; for(let j=0;j<k.length;j++){ const idx=t+(j-kh); if(idx>=0&&idx<N) a+=x[idx]*k[k.length-1-j]; else return null; } return a; });
      const P=Plot($('#c1Cv',root),{xmin:0,xmax:N,ymin:kt==='dif'?-15:10,ymax:kt==='dif'?40:40,height:250}); P.axes({xlabel:'Time t',ylabel:'Signal'});
      const ts=x.map((_,i)=>i); P.line(ts,x,alpha(cssVar('--muted'),.7),1.2); P.line(ts,y,cssVar('--c1'),2.5); P.legend([['Noisy input x(t)',cssVar('--muted')],['Output s(t) = (x * ω)(t)',cssVar('--c1')]]); };
    segmented(root,'#k1Seg',v=>{kt=v;c1();}); bindRange(root,'kw',c1); c1(); onResize(c1);
    const imgs={vert:p=>p[1]===3||p[1]===4, cross:p=>p[0]===3||p[1]===3, diag:p=>p[0]===p[1]||p[0]===p[1]+1, box:p=>p[0]>=2&&p[0]<=5&&p[1]>=2&&p[1]<=5};
    const kers={v:[[-1,0,1],[-1,0,1],[-1,0,1]],h:[[-1,-1,-1],[0,0,0],[1,1,1]],blur:[[1,1,1],[1,1,1],[1,1,1]].map(r=>r.map(v=>+(v/9).toFixed(3))),sharp:[[0,-1,0],[-1,5,-1],[0,-1,0]],id:[[0,0,0],[0,1,0],[0,0,0]]};
    let I=[], S=1, Pd=0, sel=null;
    const loadImg=()=>{ const f=imgs[$('#imgSel',root).value]; I=[]; for(let i=0;i<8;i++){ I.push([]); for(let j=0;j<8;j++) I[i].push(f([i,j])?1:0); } };
    const grid=(M,opt={})=>{ const mx=Math.max(1e-9,...M.flat().map(Math.abs)); return `<table class="heat" style="border-collapse:collapse">${M.map((r,i)=>`<tr>${r.map((v,j)=>{ const hl=opt.hl&&opt.hl(i,j); const a=Math.abs(v)/mx; const bg=v<0?alpha(cssVar('--c4'),a*.85):heatColor(a); return `<td data-i="${i}" data-j="${j}" style="width:${opt.sz||30}px;height:${opt.sz||30}px;background:${bg};color:${a>.55&&v>=0?'#fff':cssVar('--text')};${hl?'outline:2px solid var(--amber);outline-offset:-2px;':''}cursor:${opt.click?'pointer':'default'}">${opt.num===false?'':(+v.toFixed(2))}</td>`; }).join('')}</tr>`).join('')}</table>`; };
    const conv=()=>{ const K=kers[$('#kerSel',root).value]; const W=8+2*Pd; const X=[]; for(let i=0;i<W;i++){ X.push([]); for(let j=0;j<W;j++){ const a=i-Pd,b=j-Pd; X[i].push(a>=0&&a<8&&b>=0&&b<8?I[a][b]:0); } }
      const O=Math.floor((W-3)/S)+1; const F=[]; for(let i=0;i<O;i++){ F.push([]); for(let j=0;j<O;j++){ let s=0; for(let u=0;u<3;u++) for(let v=0;v<3;v++) s+=X[i*S+u][j*S+v]*K[u][v]; F[i].push(s); } }
      return {X,F,O,K}; };
    const draw=()=>{ const {X,F,O,K}=conv(); const relu=$('#reluOn',root).checked; const A=F.map(r=>r.map(v=>relu?Math.max(0,v):v));
      const rf=sel?(i,j)=>{ const a=i+Pd, b=j+Pd; return a>=sel[0]*S&&a<sel[0]*S+3&&b>=sel[1]*S&&b<sel[1]*S+3; }:null;
      $('#inG',root).innerHTML=grid(I,{click:true,hl:rf,num:false,sz:26}); $('#kG',root).innerHTML=grid(K,{sz:34});
      $('#fmG',root).innerHTML=grid(A,{click:true,hl:sel?(i,j)=>i===sel[0]&&j===sel[1]:null,sz:O>6?26:32}); $('#fmSz',root).textContent=`${O}×${O}  = (8 - 3 + 2·${Pd})/${S} + 1`;
      const PO=Math.floor(O/2), Pl=[]; for(let i=0;i<PO;i++){ Pl.push([]); for(let j=0;j<PO;j++) Pl[i].push(Math.max(A[2*i][2*j],A[2*i][2*j+1],A[2*i+1][2*j],A[2*i+1][2*j+1])); } $('#plG',root).innerHTML=PO?grid(Pl,{sz:34}):'<p class="small muted">Too small to pool.</p>';
      $$('#inG td',root).forEach(td=>td.onclick=()=>{ const i=+td.dataset.i,j=+td.dataset.j; I[i][j]=1-I[i][j]; draw(); });
      $$('#fmG td',root).forEach(td=>td.onclick=()=>{ sel=[+td.dataset.i,+td.dataset.j]; draw(); });
      if(sel&&sel[0]<O&&sel[1]<O){ const terms=[]; for(let u=0;u<3;u++) for(let v=0;v<3;v++){ const x=X[sel[0]*S+u][sel[1]*S+v]; if(x&&K[u][v]) terms.push(`${x}×${K[u][v]}`); } $('#cvCalc',root).textContent=`Cell (${sel[0]}, ${sel[1]}):\n${terms.length?terms.join(' + '):'all products are 0'}\n= ${F[sel[0]][sel[1]].toFixed(2)}`+(relu?`\nReLU → ${Math.max(0,F[sel[0]][sel[1]]).toFixed(2)}`:''); } else { sel=null; } };
    $('#imgSel',root).onchange=()=>{loadImg();draw();}; $('#kerSel',root).onchange=draw; $('#reluOn',root).onchange=draw;
    segmented(root,'#strSeg',v=>{S=+v;sel=null;draw();}); segmented(root,'#padSeg',v=>{Pd=+v;sel=null;draw();});
    loadImg(); draw();
    // VGG16
    const cfg=[64,64,'M',128,128,'M',256,256,256,'M',512,512,512,'M',512,512,512,'M']; let h=224,c=3,rows=[],tot=0,n=1;
    cfg.forEach(v=>{ if(v==='M'){ h/=2; rows.push(['MaxPool 2×2',`${h}×${h}×${c}`,0]); } else { const p=3*3*c*v+v; tot+=p; c=v; rows.push([`Conv3-${v} (layer ${n++})`,`${h}×${h}×${c}`,p]); } });
    rows.push(['Flatten',`${h*h*c}`,0]); [[h*h*c,4096],[4096,4096],[4096,1000]].forEach(([a,b],i)=>{ const p=a*b+b; tot+=p; rows.push([`FC-${b} (layer ${n++})${i===2?' + softmax':''}`,`${b}`,p]); });
    let cum=0; $('#vgg',root).innerHTML=`<table class="tbl"><thead><tr><th>Layer</th><th>Output shape</th><th>Parameters</th><th>Cumulative</th></tr></thead><tbody>${rows.map(r=>{cum+=r[2]; return `<tr class="clickable"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2].toLocaleString()}</td><td>${cum.toLocaleString()}</td></tr>`;}).join('')}</tbody></table>`;
    const conv13=rows.filter(r=>r[0].startsWith('Conv')).reduce((a,r)=>a+r[2],0);
    $('#vggSum',root).textContent=`16 weight layers (13 conv + 3 FC). Total parameters: ${tot.toLocaleString()}\nConvolutional layers: ${conv13.toLocaleString()} (${(100*conv13/tot).toFixed(1)}%)   Fully connected: ${(tot-conv13).toLocaleString()} (${(100*(tot-conv13)/tot).toFixed(1)}%)\nMost parameters live in the first FC layer; most computation happens in the conv layers.`;
    $$('#vgg tbody tr',root).forEach(tr=>tr.onclick=()=>{ $$('#vgg tr',root).forEach(x=>x.classList.remove('hl')); tr.classList.add('hl'); });
  },
  quiz:[
    {q:'A 5×5 input is convolved with a 3×3 filter, stride 1, no padding. The feature map is:', o:['5×5','3×3','2×2','7×7'], a:1, e:'$O=(5-3+0)/1+1=3$.'},
    {q:'What is the main purpose of max pooling?', o:['Add nonlinearity','Downsample the feature map while keeping the strongest responses, adding robustness to small shifts','Increase the number of filters','Normalize the input'], a:1, e:'Pooling reduces spatial size and computation and makes features less sensitive to small translations.'},
    {q:'The "depth" of a convolutional layer\'s output corresponds to:', o:['The stride','The number of filters','The padding size','The image height'], a:1, e:'Each filter produces one feature map, so depth equals the number of filters.'}
  ]
});

LAB.add({
  id:'cnnimpl', group:'Deep Learning', title:'CNN Implementation', slides:'209-223', keywords:'keras pytorch tensorflow caffe gpu cpu dla hardware casting fault detection',
  html: R`
<h2>Python libraries</h2>
<div class="grid4"><div class="mini"><h4>Caffe</h4><p class="small">Excellent when it started and popular for years, but falling behind. Networks defined in prototxt text files. Intuitive layer blocks, cumbersome for very deep models. Still used in some industry settings.</p></div><div class="mini"><h4>PyTorch</h4><p class="small">Created by Facebook (2017). Very popular with ML researchers. Python, with a dynamic computational graph that helps with RNNs. Not hard to use and allows fast development.</p></div><div class="mini"><h4>TensorFlow</h4><p class="small">Created by Google Brain (2015). Python API that specifies the CNN as a computational graph. Good for industrial practitioners. Historically the hardest to use but also the fastest; newer versions include a Keras interface.</p></div><div class="mini"><h4>Keras</h4><p class="small">High-level API on top of TensorFlow (extended to CNTK). User friendly and a good place to start if you do not need special networks or fine control.</p></div></div>
<h2>Computational platforms</h2>
<div class="grid3"><div class="mini"><h4>CPUs</h4><p class="small">Historically single core; trend: many cores. Good for complex, divergent code (unlike CNNs).</p></div><div class="mini"><h4>GPUs</h4><p class="small">Historically graphics only; trend: CNN computing. Good for simpler, parallel code such as the matrix multiplications in CNNs.</p></div><div class="mini"><h4>DLAs (deep learning accelerators)</h4><p class="small">ASICs designed for one type of task; many startups. Good for CNNs at lower power thanks to special memory architectures.</p></div></div>
${panel('Which hardware should you select? It depends on the use case.', `<div class="seg" id="hwSeg"><button class="on" data-v="0">Learning, inference only</button><button data-v="1">R&amp;D with training</button><button data-v="2">Production deployment</button></div><div class="callout" id="hwTxt" style="margin-top:12px"></div>`)}
<h2>Example: machine failure from synthetic sensor maps</h2>
<p>Artificial 8×8 grayscale sensor maps: <b>healthy</b> machines have lower intensity and smooth readings; <b>faulty</b> machines have higher intensity and noisy readings. A small CNN learns to tell them apart.</p>
${panel('Generate sensor maps', `<div class="btnrow"><button class="btn sm" id="smNew">New samples</button></div><div class="grid4" id="smaps"></div><p class="small muted">Each tile is one 8×8 input image. The CNN sees only pixels and learns the intensity and texture cues itself.</p>`)}
${panel('A small CNN for 8×8 maps', `<p class="small">A typical architecture for this kind of input (illustrative; see the notebook for the exact model). Change the number of filters to see how the parameter count responds.</p><div class="controls"><div class="ctl"><label>Filters in conv layer 1 <output id="f1_v"></output></label><input type="range" id="f1" min="4" max="64" step="4" value="16"></div><div class="ctl"><label>Filters in conv layer 2 <output id="f2_v"></output></label><input type="range" id="f2" min="4" max="128" step="4" value="32"></div><div class="ctl"><label>Dense units <output id="du_v"></output></label><input type="range" id="du" min="8" max="128" step="8" value="64"></div></div><div id="smallCnn"></div>`)}
<h2>More case studies</h2>
<div class="grid2"><div class="mini"><h4>CNN for fault detection in casting products</h4><p class="small">Images of cast parts are classified as defective or OK, replacing manual visual inspection.</p>${colab('CNN_Fault_Detection.ipynb')}</div><div class="mini"><h4>CNN for predictive maintenance</h4><p class="small">Sensor time series reshaped for convolution to predict machine condition.</p>${colab('CNN_Predictive_Maintenance.ipynb')}</div></div>
<p>Notebook for the synthetic example: ${colab('CNN.ipynb')}</p>`,
  init(root){
    const hw=[['Initial learning, where cost matters more than speed, and no training (inference only).','CPUs and personal laptops.'],['R&amp;D or advanced projects involving training or large-scale testing.','Discrete GPUs in desktops or servers, or datacenter/cloud access.'],['Production or commercial deployment.','Driven by the needs of the application domain (cloud, mobile, IoT, vehicle): power, cost, flexibility. Follow a rigorous analysis to choose among embedded GPUs, DLAs, and similar options.']];
    segmented(root,'#hwSeg',v=>{ $('#hwTxt',root).innerHTML=`<b>Use case:</b> ${hw[v][0]}<br><b>Hardware:</b> ${hw[v][1]}`; }); $('#hwTxt',root).innerHTML=`<b>Use case:</b> ${hw[0][0]}<br><b>Hardware:</b> ${hw[0][1]}`;
    let sd=1;
    const maps=()=>{ const r=seeded(sd); let html=''; for(let n=0;n<8;n++){ const f=n%2===1; let cells=''; for(let i=0;i<8;i++) for(let j=0;j<8;j++){ const base=f?0.62:0.25; const v=clamp(base+(f?randn(r)*0.2:0.05*Math.sin(i/2+j/3)+randn(r)*0.03),0,1); cells+=`<i style="display:block;aspect-ratio:1;background:rgb(${Math.round(v*255)},${Math.round(v*255)},${Math.round(v*255)})"></i>`; }
      html+=`<div class="mini" style="padding:8px"><div style="display:grid;grid-template-columns:repeat(8,1fr);border-radius:6px;overflow:hidden">${cells}</div><p class="small" style="text-align:center;margin:6px 0 0"><span class="pill ${f?'bad':'good'}">${f?'Faulty':'Healthy'}</span></p></div>`; }
      $('#smaps',root).innerHTML=html; };
    $('#smNew',root).onclick=()=>{sd++;maps();}; maps();
    const sc=()=>{ const f1=+$('#f1',root).value, f2=+$('#f2',root).value, du=+$('#du',root).value;
      const L=[['Input','8×8×1',0],['Conv2D 3×3, ReLU, padding same',`8×8×${f1}`,9*f1+f1],['MaxPooling2D 2×2',`4×4×${f1}`,0],['Conv2D 3×3, ReLU, padding same',`4×4×${f2}`,9*f1*f2+f2],['MaxPooling2D 2×2',`2×2×${f2}`,0],['Flatten',`${4*f2}`,0],['Dense, ReLU',`${du}`,4*f2*du+du],['Dense, sigmoid (Healthy/Faulty)','1',du+1]];
      $('#smallCnn',root).innerHTML=table(['Layer','Output shape','Parameters'],L.map(l=>[l[0],l[1],l[2].toLocaleString()]))+`<p><b>Total trainable parameters: ${sum(L.map(l=>l[2])).toLocaleString()}</b></p>`; };
    ['f1','f2','du'].forEach(k=>bindRange(root,k,sc)); sc();
  },
  quiz:[
    {q:'Why are GPUs well suited to CNN training?', o:['They excel at complex, divergent code','CNNs are dominated by simple, highly parallel matrix multiplications','They have more cache than CPUs','They are cheaper than laptops'], a:1, e:'GPUs run thousands of simple operations in parallel, exactly what convolution and matrix products need.'},
    {q:'Which library was created by Facebook (2017) and uses a dynamic computational graph?', o:['Caffe','TensorFlow','PyTorch','Keras'], a:2, e:'PyTorch builds the graph on the fly, which helps with RNNs and debugging.'},
    {q:'For a production deployment in a vehicle, hardware should be chosen by:', o:['Always using a desktop GPU','A rigorous analysis of power, cost, and flexibility for the domain (embedded GPUs, DLAs, etc.)','Whatever is used for research','Using only CPUs'], a:1, e:'Production choices are driven by the application domain and its constraints.'}
  ]
});

LAB.add({
  id:'sequential', group:'Sequential Models', title:'Sequential Learning', slides:'226-232', keywords:'sequence one-to-many many-to-one seq2seq encoder decoder',
  html: R`
<p><b>Sequential data</b> is data where the order of observations matters and each point is linked to the one before it: sensor time series, failure event histories, and maintenance logs. <b>Sequential learning</b> learns from such ordered data, where each observation depends partly or fully on previous ones. The key challenge is capturing temporal or contextual dependencies across time steps.</p>
${panel('Input/output configurations (casting inspection examples)', `<div class="seg" id="ioSeg"><button class="on" data-v="0">One-to-one</button><button data-v="1">One-to-many</button><button data-v="2">Many-to-one</button><button data-v="3">Many-to-many (type 1)</button><button data-v="4">Many-to-many (type 2)</button></div><div class="grid2" style="margin-top:12px"><div id="ioSvg"></div><div id="ioTxt" class="card" style="margin:0"></div></div>`)}
<h2>Seq2Seq models</h2>
<p>A Seq2Seq model takes a sequence of items (words, letters, time-series values) and outputs another sequence. The <b>encoder</b> processes each input item and compiles what it captures into a <b>context</b> vector, which it sends to the <b>decoder</b>, which produces the output item by item. In machine translation the context is an array of numbers whose size equals the number of hidden units in the encoder RNN. Encoder and decoder are typically both recurrent networks.</p>
${panel('Watch an encoder-decoder translate', `<div class="btnrow"><button class="btn sm" id="s2sNext">Next time step &#9654;</button><button class="btn ghost sm" id="s2sReset">Reset</button><span class="tag" id="s2sTag"></span></div><div id="s2sSvg"></div><p class="small" id="s2sTxt"></p>`)}
${table(['Model type','Description','Typical use'],[['RNN (Recurrent Neural Network)','Feedback connections remember previous inputs','Text, speech, time series'],['LSTM (Long Short-Term Memory)','Handles long-term dependencies using gates','Predictive maintenance, forecasting'],['GRU (Gated Recurrent Unit)','Simplified version of LSTM','Speech, sensor data'],['Transformer','Uses self-attention instead of recurrence','NLP, video, multimodal learning']])}`,
  init(root){
    const T=[[1,1,'One-to-one','Image classification: a single casting image goes in and a single label comes out, such as "defective casting" or "non-defective casting."'],
      [1,4,'One-to-many','Image captioning: one casting image in, a sequence of words out describing the defect pattern, such as "surface crack → possible porosity → cooling-induced deformation."'],
      [4,1,'Many-to-one','Severity prediction: a sequence of images captured at different cooling or machining stages in, one severity score out ("low," "medium," or "high").'],
      [4,4,'Many-to-many (type 1)','Frame-by-frame defect detection: each image in the sequence gets its own label as it arrives, such as ["no defect," "minor defect," "defect growing," "severe defect"].'],
      [4,-4,'Many-to-many (type 2)','Synchronized sequence model: the model reads the entire casting image sequence first and then outputs one segmentation mask per image, highlighting defects across time.']];
    const draw=v=>{ const [ni,no,name,txt]=T[v]; const delayed=no<0; const n=Math.abs(no); const cols=delayed?ni+n:Math.max(ni,n); const W=cols*60+20;
      let s=`<svg viewBox="0 0 ${W} 200" width="100%" style="max-width:${Math.max(240,W)}px">`;
      for(let c=0;c<cols;c++){ const x=30+c*60; const hasIn=delayed?c<ni:c<ni; const hasOut=delayed?c>=ni:(no===1?c===cols-1:c<n);
        s+=`<rect x="${x-18}" y="80" width="36" height="36" rx="6" fill="var(--c1)" opacity=".85"/>`; if(c<cols-1) s+=`<line x1="${x+18}" y1="98" x2="${x+42}" y2="98" stroke="var(--muted)" stroke-width="2"/>`;
        if(hasIn) s+=`<rect x="${x-14}" y="150" width="28" height="28" rx="6" fill="var(--c4)" opacity=".85"/><line x1="${x}" y1="150" x2="${x}" y2="116" stroke="var(--muted)" stroke-width="2"/>`;
        if(hasOut) s+=`<rect x="${x-14}" y="18" width="28" height="28" rx="6" fill="var(--c3)" opacity=".85"/><line x1="${x}" y1="80" x2="${x}" y2="46" stroke="var(--muted)" stroke-width="2"/>`; }
      s+=`</svg><p class="small muted">Red: inputs. Blue: recurrent hidden state. Green: outputs.</p>`; $('#ioSvg',root).innerHTML=s; $('#ioTxt',root).innerHTML=`<h4>${name}</h4><p>${txt}</p>`; };
    segmented(root,'#ioSeg',v=>draw(+v)); draw(0);
    const src=['we','see','the','sky'], tgt=['vemos','el','cielo','[STOP]']; let t=0;
    const s2s=()=>{ const W=560; let s=`<svg viewBox="0 0 ${W} 170" width="100%">`;
      src.forEach((w,i)=>{ const x=40+i*62, on=t>i; s+=`<rect x="${x-24}" y="60" width="48" height="34" rx="7" fill="${on?'var(--c1)':'var(--surface2)'}" stroke="var(--border)"/><text x="${x}" y="81" text-anchor="middle" font-size="11" fill="${on?'#fff':'var(--muted)'}">h${i+1}</text><text x="${x}" y="130" text-anchor="middle" font-size="12" fill="var(--text)">${w}</text>`; if(i<3) s+=`<line x1="${x+24}" y1="77" x2="${x+38}" y2="77" stroke="var(--muted)"/>`; });
      const cOn=t>=4; s+=`<rect x="272" y="60" width="44" height="34" rx="7" fill="${cOn?'var(--amber)':'var(--surface2)'}" stroke="var(--border)"/><text x="294" y="81" text-anchor="middle" font-size="11" fill="${cOn?'#fff':'var(--muted)'}">c</text><text x="294" y="130" text-anchor="middle" font-size="10" fill="var(--muted)">context</text>`;
      tgt.forEach((w,i)=>{ const x=360+i*55, on=t>4+i; s+=`<rect x="${x-22}" y="60" width="44" height="34" rx="7" fill="${on?'var(--c3)':'var(--surface2)'}" stroke="var(--border)"/><text x="${x}" y="81" text-anchor="middle" font-size="11" fill="${on?'#fff':'var(--muted)'}">s${i+1}</text>${on?`<text x="${x}" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="var(--c3)">${w}</text>`:''}`; });
      s+='</svg>'; $('#s2sSvg',root).innerHTML=s; $('#s2sTag',root).textContent=`step ${t} / 8`;
      $('#s2sTxt',root).textContent= t===0?'Press "Next time step" to start encoding.': t<4?`Encoder reads "${src[t-1]}" and updates its hidden state: h_t = f_W(x_t, h_(t-1)).`: t===4?'The final encoder state becomes the context vector c, the only bridge to the decoder.': `Decoder emits "${tgt[t-5]}" using its previous output, its state, and c. `+(t===8?'Done. Problem: the whole input is squeezed through one fixed-size c. What if the input has 1,000 words? Attention fixes this.':''); };
    $('#s2sNext',root).onclick=()=>{ if(t<8){t++;s2s();} }; $('#s2sReset',root).onclick=()=>{t=0;s2s();}; s2s();
  },
  quiz:[
    {q:'Predicting a single severity score from a sequence of casting images taken over time is which configuration?', o:['One-to-one','One-to-many','Many-to-one','Many-to-many'], a:2, e:'Many inputs (the image sequence) map to one output (the score).'},
    {q:'In a Seq2Seq model, what is the context vector?', o:['The first output word','A fixed-size array summarizing the input sequence, passed from encoder to decoder','The vocabulary','The loss function'], a:1, e:'Its size equals the number of hidden units in the encoder RNN.'},
    {q:'What is the key challenge of sequential learning?', o:['Shuffling the data randomly','Capturing temporal or contextual dependencies across time steps','Removing the order of observations','Using only images'], a:1, e:'Order matters, so the model must carry information from earlier steps.'}
  ]
});

LAB.add({
  id:'rnn', group:'Sequential Models', title:'Recurrent Neural Networks (RNN)', slides:'234-248', keywords:'hidden state recurrence character language model hello rul cmapss',
  html: R`
<p>A recurrent neural network processes sequential data by keeping an internal memory: a <b>hidden state</b> $h_t$ that summarizes the history up to time $t$. At each step it uses the current input $x_t$ and the memory of the past:</p>
$$h_t=\tanh\!\left(W_{xh}x_t+W_{hh}h_{t-1}+b_h\right),\qquad y_t=W_{hy}h_t+b_y$$
<p>The name comes from <i>recurrent</i>: the network loops back, feeding its state from one time step into the next, so the same weights are reused at every step.</p>
${panel('Character-level language model: "hello"', `<p class="small">Vocabulary [h, e, l, o]. Training sequence "hello": inputs h, e, l, l with targets e, l, l, o. Values follow the CS231n example used in the slides (Fei-Fei Li, Jiajun Wu, Ruohan Gao, Stanford).</p><div class="btnrow"><button class="btn ghost sm" id="hPrev">&#9664;</button><button class="btn sm" id="hNext">Next step &#9654;</button><span class="tag" id="hTag"></span></div><div id="helloSvg" style="overflow-x:auto"></div><div class="readout" id="helloTxt"></div>`)}
${panel('How long does an RNN remember?', `<div class="controls"><div class="ctl"><label>Recurrent weight w_hh <output id="whh_v"></output></label><input type="range" id="whh" min="0.1" max="1.5" step="0.05" value="0.8"></div></div><div class="grid2"><canvas class="plot" id="memCv"></canvas><canvas class="plot" id="gradCv"></canvas></div><p class="small" id="memTxt"></p>`)}
<h3>RNN versus CNN</h3>
${table(['Aspect','CNN','RNN'],[['Core architecture','Feed-forward with convolutional layers that extract spatial features','Recurrent, with feedback connections that keep a hidden state (memory) over time'],['Information dependency','Processes inputs independently (no notion of sequence)','Processes inputs in order; each step depends on previous ones'],['Computation flow','Parallel','Sequential'],['Memory of past inputs','None: purely spatial','Yes: hidden state (and cell state in LSTM/GRU)'],['Best suited for','Spatial or local correlations','Temporal or sequential correlations'],['Use cases','Manufacturing defect detection, medical image segmentation, autonomous driving vision','Predictive maintenance (sensor data), stock prices, machine translation, text generation'],['Common architectures','LeNet, AlexNet, VGG, ResNet, EfficientNet','Vanilla RNN, LSTM, GRU, BiRNN'],['Key limitation','Cannot capture long-term temporal dependencies','Hard to train on long sequences (vanishing gradients)'],['Modern alternatives','Vision Transformers (ViT), ConvNeXt','LSTM, GRU, Transformers']])}
<h2>Regression for reliability: remaining useful life</h2>
<p>Regression predicts a continuous value from input features. In reliability and maintenance it appears under many names:</p>
${table(['Task','What is predicted','Example output'],[['Remaining Useful Life (RUL)','Hours, days, or cycles until failure','1,250 hours'],['Time to Failure (TTF)','Time or cycles from now until failure','87.3 days'],['Failure / hazard rate','Instantaneous failure rate','0.0023 failures/hour'],['Dynamic MTTF','Expected remaining lifetime given sensor data','1,800 cycles'],['Health index / state of health','Score from 100 (healthy) to 0 (failed)','63.4%'],['Cumulative damage / wear','Crack length, bearing wear','2.45 mm'],['Next maintenance time','Optimal time to next maintenance','312 hours'],['Probability of survival to t','Survival (Weibull) regression','0.78 for the next 500 cycles'],['Vibration severity / anomaly score','Continuous severity index','7.8 on a 0-10 scale'],['Oil degradation parameters','Acid number, viscosity, particles, moisture','0.42 mg KOH/g']])}
<details class="card"><summary><b>Real-world industry examples</b> (click to expand)</summary>${table(['Industry','Asset','Regression target','Sensors'],[['Aerospace','Turbofan engines (NASA CMAPSS)','RUL in flight cycles','Temperatures, pressures, vibration, speed'],['Wind energy','Gearbox and bearings','RUL in hours or revolutions','SCADA, vibration, oil debris, temperature'],['Rail','Train wheelsets','Remaining tread thickness (mm)','Wheel profiles, acoustic sensors'],['Manufacturing','CNC spindle or cutting tool','Tool wear (VB, mm) or RUL in minutes','Force, vibration, acoustic emission, power'],['Oil and gas','Subsea pumps and valves','RUL in operating hours','Pressure, flow, temperature, erosion'],['Mining','Haul truck engines or tires','Tire RUL in km or hours','TPMS, strain gauges, mileage, load'],['Power generation','Gas turbine blades','Creep life consumed (%)','Blade temperature, strain, hours'],['Automotive fleets','Heavy truck brakes','Brake pad thickness (mm)','Brake pressure, deceleration, temperature']])}</details>
${panel('NASA CMAPSS turbofan: from sensors to an RUL label', `<p class="small">CMAPSS records 21 sensors per cycle (fan inlet temperature, LPC/HPC/LPT outlet temperatures, pressures, fan and core speeds, bypass ratio, bleed enthalpy, coolant flows, and more). Training labels usually use a <b>piecewise-linear RUL</b>: constant early in life (degradation not yet visible), then decreasing linearly to 0 at failure.</p><div class="controls"><div class="ctl"><label>Current cycle <output id="cy_v"></output></label><input type="range" id="cy" min="1" max="250" value="120"></div><div class="ctl"><label>RUL cap <output id="cap_v"></output></label><input type="range" id="cap" min="80" max="200" step="5" value="125"></div></div><div class="grid2"><canvas class="plot" id="sensCv"></canvas><canvas class="plot" id="rulCv"></canvas></div><p class="small" id="rulTxt"></p>`)}
<p>Notebook: ${colab('RNN_RUL.ipynb')}</p>`,
  init(root){
    const V=['h','e','l','o'], inp=['h','e','l','l'], tgt=['e','l','l','o'];
    const H=[[0.3,-0.1,0.9],[1.0,0.3,0.1],[0.1,-0.5,-0.3],[-0.3,0.9,0.7]], Y=[[1.0,2.2,-3.0,4.1],[0.5,0.3,-1.0,1.2],[0.1,0.5,1.9,-1.1],[0.2,-1.5,-0.1,2.2]];
    let k=0;
    const draw=()=>{ const W=90*4+80; let s=`<svg viewBox="0 0 ${W} 330" width="100%" style="min-width:420px">`;
      const col=(x,y,vals,hl,lab,color)=>{ let o=`<text x="${x}" y="${y-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${lab}</text>`; vals.forEach((v,i)=>{ o+=`<rect x="${x-20}" y="${y+i*18}" width="40" height="17" fill="${hl===i?color:'var(--surface2)'}" stroke="var(--border)"/><text x="${x}" y="${y+i*18+12}" text-anchor="middle" font-size="10" fill="${hl===i?'#fff':'var(--text)'}">${typeof v==='number'?v:v}</text>`; }); return o; };
      for(let t=0;t<=k&&t<4;t++){ const x=80+t*90; const oh=V.map(c=>c===inp[t]?1:0); const amax=Y[t].indexOf(Math.max(...Y[t]));
        s+=col(x,250,oh,oh.indexOf(1),`"${inp[t]}"`,'var(--c4)')+col(x,140,H[t],-1,'hidden','var(--c1)')+col(x,20,Y[t],V.indexOf(tgt[t]),`target "${tgt[t]}"`,'var(--c3)');
        s+=`<line x1="${x}" y1="248" x2="${x}" y2="196" stroke="var(--muted)"/><line x1="${x}" y1="140" x2="${x}" y2="96" stroke="var(--muted)"/>`; if(t<k&&t<3) s+=`<line x1="${x+20}" y1="166" x2="${x+70}" y2="166" stroke="var(--c2)" stroke-width="2.5"/><text x="${x+45}" y="160" text-anchor="middle" font-size="9" fill="var(--c2)">W_hh</text>`; }
      s+=`<text x="10" y="270" font-size="10" fill="var(--muted)">input</text><text x="10" y="40" font-size="10" fill="var(--muted)">output</text>`;
      s+=V.map((c,i)=>`<text x="${W-16}" y="${32+i*18}" font-size="10" fill="var(--muted)">${c}</text><text x="${W-16}" y="${262+i*18}" font-size="10" fill="var(--muted)">${c}</text>`).join('')+'</svg>'; $('#helloSvg',root).innerHTML=s;
      const t=Math.min(k,3); const p=softmax(Y[t]); const best=V[Y[t].indexOf(Math.max(...Y[t]))];
      $('#helloTxt',root).textContent=`Step ${t+1}: input "${inp[t]}" (one-hot ${V.map(c=>c===inp[t]?1:0).join(',')}) → hidden [${H[t].join(', ')}]\nOutput scores (h,e,l,o) = [${Y[t].join(', ')}]\nSoftmax = [${p.map(v=>v.toFixed(2)).join(', ')}]\nTarget "${tgt[t]}" (green). Highest score: "${best}".`+(best!==tgt[t]?' The untrained model is wrong here; training raises the green score.':' Correct.')+`\n\nAt test time we sample one character from the softmax and feed it back as the next input (step 1 sampled "e" with probability ${p[1].toFixed(2)}).`;
      $('#hTag',root).textContent=`Step ${t+1} of 4`; $('#hPrev',root).disabled=k===0; $('#hNext',root).disabled=k>=3; };
    $('#hPrev',root).onclick=()=>{k--;draw();}; $('#hNext',root).onclick=()=>{k++;draw();}; draw();
    const mem=()=>{ const w=+$('#whh',root).value; const hs=[]; let h=0; for(let t=0;t<30;t++){ h=Math.tanh((t===0?1.5:0)+w*h); hs.push(h); }
      const P=Plot($('#memCv',root),{xmin:0,xmax:29,ymin:-1,ymax:1,height:220}); P.axes({xlabel:'Time step',ylabel:'Hidden state h_t'}); P.hline(0,cssVar('--axis'),[]); P.line(hs.map((_,i)=>i),hs,cssVar('--c1'),2.5);
      const g=hs.map((_,t)=>Math.log10(Math.max(1e-12,w**t))); const G=Plot($('#gradCv',root),{xmin:0,xmax:29,ymin:-8,ymax:4,height:220}); G.axes({xlabel:'Steps back in time',ylabel:'log10 |gradient factor|'}); G.hline(0,cssVar('--axis'),[]); G.line(g.map((_,i)=>i),g,cssVar('--c4'),2.5);
      $('#memTxt',root).innerHTML=`A pulse enters at t = 0, then inputs are zero. The left plot shows how long the memory survives. The right plot shows the factor $w_{hh}^t$ that multiplies gradients flowing back $t$ steps (ignoring the tanh slope, which only shrinks it further). `+(w<0.95?'<b>Vanishing gradients:</b> distant steps contribute almost nothing.':w>1.05?'<b>Exploding gradients:</b> the factor grows without bound (in practice, use gradient clipping).':'Near 1, signals survive longer: the idea LSTMs exploit with their cell state.'); typeset($('#memTxt',root)); };
    bindRange(root,'whh',mem); mem(); onResize(mem);
    const rul=()=>{ const cy=+$('#cy',root).value, cap=+$('#cap',root).value, life=250; const r=seeded(9);
      const deg=t=>t<90?0:((t-90)/(life-90))**2; const xs=[],s1=[],s2=[]; for(let t=1;t<=life;t++){ xs.push(t); s1.push(642+6*deg(t)+randn(r)*.5); s2.push(1590+30*deg(t)+randn(r)*2.5); }
      const P=Plot($('#sensCv',root),{xmin:0,xmax:life,ymin:640,ymax:650,height:230}); P.axes({xlabel:'Cycle',ylabel:'LPC outlet temp (°R)'}); P.line(xs,s1,cssVar('--c1'),1.5); P.vline(cy,cssVar('--c2'));
      const Q=Plot($('#rulCv',root),{xmin:0,xmax:life,ymin:0,ymax:260,height:230}); Q.axes({xlabel:'Cycle',ylabel:'RUL (cycles)'}); Q.line(xs,xs.map(t=>life-t),cssVar('--muted'),1.5,[5,4]); Q.line(xs,xs.map(t=>Math.min(cap,life-t)),cssVar('--c3'),2.5); Q.vline(cy,cssVar('--c2'));
      Q.legend([['Linear RUL',cssVar('--muted'),[5,4]],['Piecewise-linear label',cssVar('--c3')]],Q.w-190);
      $('#rulTxt',root).textContent=`At cycle ${cy}: true RUL = ${life-cy}, training label = ${Math.min(cap,life-cy)}. The RNN reads a window of past sensor values (for example the last 30 cycles) and regresses this label.`; };
    bindRange(root,'cy',rul); bindRange(root,'cap',rul); rul(); onResize(rul);
  },
  quiz:[
    {q:'In $h_t=\\tanh(W_{xh}x_t+W_{hh}h_{t-1}+b_h)$, which term gives the RNN its memory?', o:['$W_{xh}x_t$','$W_{hh}h_{t-1}$','$b_h$','$\\tanh$'], a:1, e:'The previous hidden state feeds back through $W_{hh}$, carrying information forward in time.'},
    {q:'Why do vanilla RNNs struggle with long sequences?', o:['They cannot process text','Gradients are multiplied by many recurrent factors and vanish (or explode) over long spans','They have no weights','They are too parallel'], a:1, e:'Repeated multiplication by factors below 1 shrinks gradients exponentially with distance.'},
    {q:'Predicting the number of flight cycles left for a turbofan engine is:', o:['A classification task','A regression task (RUL prediction)','Clustering','Image segmentation'], a:1, e:'RUL is a continuous target, as in the NASA CMAPSS example.'}
  ]
});

LAB.add({
  id:'lstm', group:'Sequential Models', title:'Long Short-Term Memory (LSTM)', slides:'250-258', keywords:'lstm gates forget input output cell state long-term dependency memory',
  html: R`
<p>LSTMs borrow their vocabulary from a model of human memory. According to the <b>Atkinson–Shiffrin model</b> (also known as the multi-store model or modal model), human memory has three components: <b>sensory memory</b>, <b>working memory</b> (sometimes called short-term memory), and <b>long-term memory</b>.</p>
<div class="grid3"><div class="mini"><h4>${ico('radio','h4ico')}Sensory memory</h4><p>A very brief memory that automatically results from our perceptions and generally disappears after the original stimulus has ceased. Each of the five senses has its own store: visual information is stored in <b>iconic memory</b>, and auditory information in <b>echoic memory</b>.</p></div>
<div class="mini"><h4>${ico('brain-circuit','h4ico')}Short-term / working memory</h4><p>How much is stored depends on the <b>attention</b> paid to the elements of sensory memory. Working memory, a more recent extension of short-term memory, stores and uses the temporary information needed for a specific task. <b>Rehearsal</b> and repetition increase how long it lasts. Example: a drive-thru associate holds each customer's order in working memory, and once the order is fulfilled, it is not kept.</p></div>
<div class="mini"><h4>${ico('archive','h4ico')}Long-term memory</h4><p>Holds lifelong memories and a vast amount of information, such as your birthday, your address, and the work skills you have learned. Important information from working memory can be <b>encoded</b> and stored here. Encoding assigns a meaning: "omelet" might be encoded as "egg, beaten, fried." If "omelet" does not come to mind, you can still <b>retrieve</b> it through one of its indexes, such as "egg," much like a lookup table.</p></div></div>
<p>Explore the model below: click any block or arrow, then follow a piece of information through it.</p>
${panel('A model of human memory', `<div class="mb" id="mb">
  <div class="mb-in"><button class="mb-blk mb-stim" data-k="stimulus">${ico('zap')}<b>Stimulus</b></button><button class="mb-conn mb-h" data-k="stim" aria-label="Stimulus reaches the sensory organs">${ico('arrow-right')}</button>
    <button class="mb-blk mb-org" data-k="organs"><b>${ico('scan-eye')} Sensory organs</b><span class="mb-senses"><span>${ico('eye')}Sight</span><span>${ico('ear')}Hearing</span><span>${ico('wind')}Smell</span><span>${ico('utensils')}Taste</span><span>${ico('hand')}Touch</span></span></button></div>
  <button class="mb-conn mb-v" data-k="perception" style="grid-area:perc">${ico('arrow-up')} Perception</button>
  <button class="mb-blk mb-sm" data-k="sensory" style="grid-area:sm"><b>${ico('radio')} Sensory Memory</b><ul><li>The entry point for memory</li><li>Each sense has a different memory store</li><li>Very limited period of time</li></ul></button>

  <button class="mb-conn mb-lost" data-k="lostSTM" style="grid-area:l2">Lost if not encoded or rehearsed ${ico('arrow-right')}</button>

  <button class="mb-blk mb-ltm" data-k="ltm" style="grid-area:ltm"><b>${ico('archive')} Long-term Memory</b><ul><li>Larger amounts of information</li><li>Remain for a long time / relatively permanent</li></ul></button>
  <button class="mb-conn mb-lost" data-k="lostLTM" style="grid-area:l3">Some information may be lost over time ${ico('arrow-right')}</button>
  <button class="mb-blk mb-fg" data-k="forget" style="grid-area:fg">${ico('brain')}<b>Forgetting</b></button>
</div>
<p class="small muted" style="margin:8px 0 10px">Description, examples, and figure adapted from A. Khamis, <i>Optimization Algorithms: AI Techniques for Design, Planning, and Control Problems</i>, Manning Publications, 2024 (ISBN 978-1633438835).</p>
<div class="grid2"><div style="min-width:0"><div class="og-label">${ico('mouse-pointer-click')} Selected part</div><div id="mmInfo" class="callout" style="margin:0">Click any block or arrow in the diagram.</div></div>
<div style="min-width:0"><div class="og-label">${ico('route')} Follow a piece of information</div>
<div class="seg" id="mmSeg" style="margin-bottom:8px"><button class="on" data-v="order">${ico('coffee')} A drive-thru order</button><button data-v="omelet">${ico('egg')} The word "omelet"</button><button data-v="noise">${ico('volume-2')} A horn you ignore</button></div>
<p class="small" id="mmScen" style="margin:0 0 6px"></p>
<div class="btnrow" style="margin-top:4px"><button class="btn sm" id="mmGo">${ico('play')} Follow it</button></div><ol class="mm-steps small" id="mmSteps"></ol><div id="mmOut" class="callout" style="margin-top:8px;display:none"></div></div></div>`, 'Explore')}
<h2>The long-term dependency problem</h2>
<div class="grid2"><div class="mini"><p><b>"The clouds are in the sky."</b></p><p class="small">The gap between the relevant information ("clouds") and where it is needed ("sky") is small. RNNs can learn to use such recent context.</p></div><div class="mini"><p><b>"The clouds that drifted across the valley on a warm summer afternoon are in the sky."</b></p><p class="small">Now "clouds" and "sky" are far apart. Similarly, "I grew up in France ... I speak fluent <i>French</i>": recent words suggest a language, but you need context from much further back to know which. As the gap grows, RNNs fail.</p></div></div>
<h2>Inside the LSTM cell</h2>
<p>The repeating module in a standard RNN contains a single tanh layer. The repeating module of an LSTM contains <b>four interacting layers</b>. The horizontal <b>cell state</b> $C_t$ is the long-term memory highway; the <b>gates</b> (sigmoid layers with outputs between 0 and 1) regulate short-term information flowing in and out.</p>
${panel('Explore the LSTM cell', `<div class="seg" id="lcSeg" style="margin-bottom:10px"><button class="on" data-v="0">${ico('layout-grid')} Whole cell</button><button data-v="1">1. Forget gate</button><button data-v="2">2. Input gate</button><button data-v="3">3. Update cell state</button><button data-v="4">4. Output gate</button></div>
<div class="lc-wrap">${lstmCellSVG('lcSvg')}</div>
<div class="grid2" style="margin-top:10px"><div style="min-width:0"><div class="og-label">${ico('footprints')} Step</div><div id="lcStep" class="callout" style="margin:0"></div></div><div style="min-width:0"><div class="og-label">${ico('mouse-pointer-click')} Selected component</div><div id="lcInfo" class="callout" style="margin:0">Click any gate, operation, or line in the diagram.</div></div></div>`, 'Explore')}
<div class="grid2"><div class="mini"><h4>Forget gate</h4><p>$f_t=\sigma(W_f\cdot[h_{t-1},x_t]+b_f)$ decides what to throw away from the cell state: information no longer contextually relevant.</p></div><div class="mini"><h4>Input gate and candidate</h4><p>$i_t=\sigma(W_i\cdot[h_{t-1},x_t]+b_i)$ and $\tilde C_t=\tanh(W_C\cdot[h_{t-1},x_t]+b_C)$ decide what new information to store. tanh pushes values to $(-1,1)$.</p></div><div class="mini"><h4>Cell update</h4><p>$C_t=f_t\odot C_{t-1}+i_t\odot\tilde C_t$: forget part of the old memory, add part of the new candidate.</p></div><div class="mini"><h4>Output gate</h4><p>$o_t=\sigma(W_o\cdot[h_{t-1},x_t]+b_o)$ and $h_t=o_t\odot\tanh(C_t)$: output a filtered version of the cell state.</p></div></div>
${panel('One LSTM cell step', `<div class="controls"><div class="ctl"><label>Previous cell C<sub>t-1</sub> <output id="cp_v"></output></label><input type="range" id="cp" min="-2" max="2" step="0.05" value="1"></div><div class="ctl"><label>Forget gate f <output id="fg_v"></output></label><input type="range" id="fg" min="0" max="1" step="0.01" value="0.9"></div><div class="ctl"><label>Input gate i <output id="ig_v"></output></label><input type="range" id="ig" min="0" max="1" step="0.01" value="0.3"></div><div class="ctl"><label>Candidate C̃ <output id="cc_v"></output></label><input type="range" id="cc" min="-1" max="1" step="0.05" value="-0.6"></div><div class="ctl"><label>Output gate o <output id="og_v"></output></label><input type="range" id="og" min="0" max="1" step="0.01" value="0.7"></div></div><div class="grid2"><div id="cellSvg"></div><div class="readout" id="cellOut"></div></div>`)}
<h2>A worked numerical example</h2>
<p>The slides walk through one LSTM unit with real numbers. The trained weights below are fixed; only the inputs change. Every weight multiplies one input, then the bias is added, and the gate's activation is applied.</p>
${table(['Layer','× short-term memory h<sub>t-1</sub>','× input x<sub>t</sub>','+ bias','Activation'],[
  ['Forget gate: % long-term to remember','2.70','1.63','1.62','σ'],['Input gate: % potential memory to remember','2.00','1.65','0.62','σ'],

${panel('Run the numbers step by step', `<div class="controls"><div class="ctl"><label>Example</label><div class="seg" id="lnSeg"><button class="on" data-v="1">Example 1 (input = 1)</button><button data-v="2">Example 2 (input = -10)</button><button data-v="c">Custom</button></div></div></div>
<div class="controls"><div class="ctl"><label>Long-term memory C<sub>t-1</sub> <output id="lnC_v"></output></label><input type="range" id="lnC" min="-3" max="3" step="0.1" value="2"></div><div class="ctl"><label>Short-term memory h<sub>t-1</sub> <output id="lnH_v"></output></label><input type="range" id="lnH" min="-1" max="1" step="0.05" value="1"></div><div class="ctl"><label>Input x<sub>t</sub> <output id="lnX_v"></output></label><input type="range" id="lnX" min="-10" max="10" step="0.5" value="1"></div></div>
<div class="btnrow"><button class="btn sm" id="lnNext">${ico('step-forward')} Next step</button><button class="btn ghost sm" id="lnAll">${ico('fast-forward')} Show all steps</button><button class="btn ghost sm" id="lnReset">${ico('rotate-ccw')} Start over</button><span class="small muted" id="lnPos"></span></div>
<div class="lc-wrap" style="margin-top:8px">${lstmCellSVG('lnSvg')}</div>
<ol class="ln-steps" id="lnSteps"></ol><div class="callout" id="lnNote" style="display:none"></div>`, 'Step by step')}
${panel('Remembering across a long gap: RNN versus LSTM', `<div class="controls"><div class="ctl"><label>Gap length (time steps) <output id="gap_v"></output></label><input type="range" id="gap" min="5" max="200" step="5" value="60"></div><div class="ctl"><label>LSTM forget gate (kept open) <output id="fk_v"></output></label><input type="range" id="fk" min="0.9" max="1" step="0.001" value="0.99"></div><div class="ctl"><label>RNN recurrent factor <output id="rf_v"></output></label><input type="range" id="rf" min="0.5" max="0.99" step="0.01" value="0.9"></div></div><canvas class="plot" id="gapCv"></canvas><p class="small" id="gapTxt"></p>`)}
<p>Notebook: ${colab('LSTM_RUL.ipynb')} (LSTM-based RUL prediction)</p>
<p class="callout src">Figures in the slides follow C. Olah, "Understanding LSTM Networks," 2015.</p>`,
  init(root){
    { // LSTM cell explorer
      const svg=$('#lcSvg',root);
      const INFO={
        cline:['Cell state $C_t$ (long-term memory)','The horizontal highway along the top. Information flows along it with only small, linear changes (one multiply and one add per step), so it can survive many time steps.'],

        mulF:['Forget multiply $f_t * C_{t-1}$','Scales the old memory by the forget gate: the part to keep.'],
        mulI:['Input multiply $i_t * \\tilde C_t$','Scales the candidate by the input gate: the part of the new information to store.'],
        add:['Cell update $C_t = f_t * C_{t-1} + i_t * \\tilde C_t$','Adds the new information to what was kept of the old memory.'],
        output:['Output gate $o_t=\\sigma(W_o\\cdot[h_{t-1},x_t]+b_o)$','A sigmoid layer that decides which parts of the cell state to output.'],
        tanhC:['$\\tanh(C_t)$','Pushes the new cell state between -1 and 1 before it is filtered.'],
        mulO:['Output multiply $h_t = o_t * \\tanh(C_t)$','Filters the cell state: only the parts chosen by the output gate are output.'],
        hout:['New hidden state $h_t$ (new short-term memory)','The output of this step. It goes to the next layer (or the prediction) and is passed to the next time step.'],
        fpath:['Forget gate path','Carries $f_t$ up to the forget multiply.'],ipath:['Input path','Carries $i_t$ and $\\tilde C_t$ to their multiply, then up to the cell update.'],opath:['Output path','Carries $o_t$ and $\\tanh(C_t)$ to the output multiply.']
      };

        0:{on:null, t:'<b>The whole cell.</b> The top line is the long-term memory (cell state). The bottom line carries the short-term memory (hidden state) and the new input. Four layers sit in between: three sigmoid <b>gates</b> and one tanh <b>candidate</b> layer. Pick a step to see how they work together.'},
        1:{on:['cline','hline','xin','forget','fpath','mulF'], t:'<b>Step 1: forget gate.</b> Decide what to throw away from the cell state. $f_t=\\sigma(W_f\\cdot[h_{t-1},x_t]+b_f)$ is multiplied by $C_{t-1}$.'},
        2:{on:['hline','xin','input','cand','ipath','mulI'], t:'<b>Step 2: input gate.</b> Decide what new information to store. $i_t$ chooses how much, and the candidate $\\tilde C_t$ proposes the values. tanh keeps them between -1 and 1.'},
        3:{on:['cline','mulF','mulI','add','ipath','fpath'], t:'<b>Step 3: update the cell state.</b> $C_t=f_t*C_{t-1}+i_t*\\tilde C_t$. The previous steps decided what to do; now we do it.'},
        4:{on:['cline','hline','xin','output','opath','tanhC','mulO','hout'], t:'<b>Step 4: output gate.</b> Output a filtered version of the cell state: $o_t=\\sigma(W_o\\cdot[h_{t-1},x_t]+b_o)$ and $h_t=o_t*\\tanh(C_t)$.'}
      };
