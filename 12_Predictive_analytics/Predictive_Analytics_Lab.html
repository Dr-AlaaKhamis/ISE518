perceptron: R`# Perceptron learning rule on OR (converges) and XOR (never converges)
import numpy as np

def train_perceptron(X, d, w, theta, eta=0.1, epochs=20):
    for epoch in range(1, epochs + 1):
        errors = 0
        for x, target in zip(X, d):
            y = int(x @ w >= theta)          # fire if the weighted sum reaches the threshold
            e = target - y
            w = w + eta * e * x              # w_i <- w_i + eta * e * x_i
            theta = theta - eta * e          # theta <- theta - eta * e
            errors += abs(e)
        print(f"epoch {epoch}: errors={errors}, w={np.round(w, 2)}, theta={theta:.2f}")
        if errors == 0:
            print("Converged!"); return w, theta
    print("Did not converge: the classes are not linearly separable.")
    return w, theta

X = np.array([[0, 0], [0, 1], [1, 0], [1, 1]])
print("OR gate"); train_perceptron(X, np.array([0, 1, 1, 1]), np.array([0.3, -0.1]), 0.2)
print("\nXOR gate"); train_perceptron(X, np.array([0, 1, 1, 0]), np.array([0.3, -0.1]), 0.2, epochs=8)`,

sig = lambda z: 1 / (1 + np.exp(-z))
x = np.array([0.35, 0.9]); t = 0.5; eta = 0.5

import numpy as np

img = np.zeros((8, 8)); img[:, 3:5] = 1                 # a vertical bar
k = np.array([[-1, 0, 1], [-1, 0, 1], [-1, 0, 1]])       # vertical-edge kernel

def conv2d(I, K, stride=1, pad=0):
    I = np.pad(I, pad); kh, kw = K.shape
    out = (I.shape[0] - kh) // stride + 1                # O = (W - K + 2P) / S + 1

import numpy as np

sig = lambda z: 1 / (1 + np.exp(-z))
def lstm_step(x, h, c, W, b):
    z = W @ np.r_[h, x] + b
    H = len(h)
    f, i, o, g = sig(z[:H]), sig(z[H:2*H]), sig(z[2*H:3*H]), np.tanh(z[3*H:])
    c = f * c + i * g            # forget part of the old memory, write part of the candidate
    h = o * np.tanh(c)           # output a filtered version of the cell state
    return h, c, f

H, X = 2, 1
rng = np.random.default_rng(0)
W = rng.normal(0, .3, (4 * H, H + X))
W[H:2*H, -1] = 3.0; W[3*H:, -1] = 1.0          # the input gate opens (and the candidate is written) only when x is large
b = np.r_[np.full(H, 4.0), np.full(H, -4.0), np.zeros(2 * H)]   # forget gate ~1 (keep), input gate ~0 (don't overwrite)
h, c = np.zeros(H), np.zeros(H)
for t, x in enumerate([3.0] + [0.0] * 50):     # one input pulse, then 50 empty steps
    h, c, f = lstm_step(np.array([x]), h, c, W, b)
    if t == 0: c0 = c[0]
    if t in (0, 1, 10, 25, 50):
        print(f"t={t:2d}  cell state={c.round(3)}  forget gate={f.round(3)}")
print("After 50 steps the LSTM still holds", round(float(c[0] / c0), 2), "of its stored value;")
print("a vanilla RNN with recurrent factor 0.9 would keep", round(0.9 ** 50, 5), "of the signal.")`,

    window.open('https://colab.research.google.com/#create=true', '_blank', 'noopener');
    status('Code copied. Paste it into the first cell of the new Colab notebook (Ctrl+V), then press Shift+Enter.');
  };
}

const escH = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function mdToHTML(md){
  md = md.replace(/<img[^>]*>/gi, ''); const out = []; let list = null, para = [];
  const inline = t => escH(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2" style="max-width:100%">').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flushP = () => { if(para.length){ out.push(`<p>${inline(para.join(' '))}</p>`); para = []; } };
  const flushL = () => { if(list){ out.push(`<${list.t}>${list.items.map(i=>`<li>${inline(i)}</li>`).join('')}</${list.t}>`); list = null; } };
  const lines = md.split('\n');
  for(let i=0;i<lines.length;i++){ const l = lines[i];
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i+1])){ flushP(); flushL(); const row = s => s.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head = row(l); i++; const body = []; while(i+1<lines.length && /^\s*\|.*\|\s*$/.test(lines[i+1])){ i++; body.push(row(lines[i])); }
      out.push(`<div class="tblwrap"><table class="tbl"><thead><tr>${head.map(h=>`<th>${inline(h)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`); continue; }
    let m;
    if((m = l.match(/^(#{1,6})\s+(.*)/))){ flushP(); flushL(); const lv = Math.min(6, m[1].length + 1); out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); continue; }
    if((m = l.match(/^\s*[-*+]\s+(.*)/))){ flushP(); if(!list || list.t!=='ul'){ flushL(); list = {t:'ul',items:[]}; } list.items.push(m[1]); continue; }
    if((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ flushP(); if(!list || list.t!=='ol'){ flushL(); list = {t:'ol',items:[]}; } list.items.push(m[1]); continue; }
    if(/^\s*$/.test(l)){ flushP(); flushL(); continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){ flushP(); flushL(); out.push('<hr>'); continue; }
    if(/^\s*>/.test(l)){ flushP(); flushL(); out.push(`<div class="callout">${inline(l.replace(/^\s*>\s?/,''))}</div>`); continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL(); return out.join('');
}
const stripAnsi = s => s.replace(/\x1b\[[0-9;]*[A-Za-z]/g,'');
function outputHTML(outs){
  return (outs||[]).map(o => {
    if(o.output_type === 'stream'){ const t = stripAnsi([].concat(o.text).join('')); return t.trim() ? `<pre class="nbo">${escH(t)}</pre>` : ''; }
    if(o.output_type === 'error') return `<pre class="nbo err">${escH(stripAnsi((o.traceback||[]).join('\n') || o.evalue))}</pre>`;
    const d = o.data || {};
    if(d['image/png']) return `<img class="nbimg" alt="Notebook figure" src="data:image/png;base64,${[].concat(d['image/png']).join('').trim()}">`;
    if(d['image/svg+xml']) return `<img class="nbimg" alt="Notebook figure" src="data:image/svg+xml;utf8,${encodeURIComponent([].concat(d['image/svg+xml']).join(''))}">`;
    if(d['text/html']){ const h = [].concat(d['text/html']).join(''); if(/<table/i.test(h) && !/<script/i.test(h)) return `<div class="nbhtml">${h}</div>`; }
    if(d['text/plain']) return `<pre class="nbo">${escH([].concat(d['text/plain']).join(''))}</pre>`;
    return '';
  }).join('');
}
const PY_NB_HELPER = `
import ast, sys
def _lab_run_cell(src, ns):
    tree = ast.parse(src)
    last = None
    if tree.body and isinstance(tree.body[-1], ast.Expr):
        last = ast.Expression(tree.body.pop().value)

            try:
                h = v._repr_html_()

_lab_disp = []
def display(*objs, **kw):

class HTML:

import types as _types
if 'IPython' not in sys.modules:
    _ip = _types.ModuleType('IPython'); _ipd = _types.ModuleType('IPython.display')
    _ipd.display = display; _ipd.HTML = HTML; _ip.display = _ipd; _ip.get_ipython = lambda: None

def _lab_patch_mpl():

def _lab_patch_seaborn():
    import seaborn as sns, pandas as pd

        df = pd.read_csv(f"https://raw.githubusercontent.com/mwaskom/seaborn-data/master/{name}.csv", **kw)

`;
async function nbPrepare(py, code, status){
  status('Loading packages...'); await py.loadPackagesFromImports(code);
  if(/\bseaborn\b/.test(code)){ try { py.pyimport('seaborn'); } catch(e){ status('Installing seaborn...'); await py.loadPackage('micropip'); await py.pyimport('micropip').install('seaborn'); } }
  if(!py.globals.get('_lab_run_cell')) await py.runPythonAsync(PY_NB_HELPER + "\nimport os, warnings\nos.environ['MPLBACKEND']='AGG'\nwarnings.filterwarnings('ignore')");
  if(/matplotlib|seaborn/.test(code)){ await py.runPythonAsync("import matplotlib\nmatplotlib.use('Agg')"); py.runPython('_lab_patch_mpl()'); }
  if(/pandas|seaborn/.test(code)) py.runPython('_lab_patch_io()');
  if(/seaborn/.test(code)) py.runPython('_lab_patch_seaborn()');
}

function notebooksPanelHTML(s){
  const list = NB_BY_SECTION[s.id]; if(!list) return '';
  return `<section class="nbpanel" id="nbpanel"><div class="cch">${ico('book-open-check')}<b>Course notebook${list.length>1?'s':''}</b><span class="muted small">worked examples from the lab_notebooks folder</span></div>
    <div class="nbtabs">${list.map((f,i)=>`<button class="nbtab ${i===0?'on':''}" data-f="${f}">${ico(NB_INFO[f].run?'play-circle':'cloud')} ${NB_INFO[f].t}</button>`).join('')}</div><div class="nbbody"></div></section>`;
}
function wireNotebooks(root, s){
  const panel = $('#nbpanel', root); if(!panel) return;
  const body = $('.nbbody', panel);
  const show = async f => {
    $$('.nbtab', panel).forEach(b => b.classList.toggle('on', b.dataset.f === f));
    const info = NB_INFO[f];
    body.innerHTML = `<div class="nbhead"><div>${info.run?`<span class="pill good">${ico('monitor-play')} Runs in your browser</span>`:`<span class="pill info">${ico('cloud')} Needs ${info.needs}: run it in Colab</span>`} <span class="muted small mono">${NB_DIR}/${NB_FILES[f] || f}</span></div>
      <div class="btnrow" style="margin:0">${info.run?`<button class="btn sm" data-a="runall">${ico('play')} Run all</button><button class="btn ghost sm" data-a="clear">${ico('eraser')} Show saved outputs</button>`:''}${nbLinks(NB_FILES[f] || f)}</div></div>
      <div class="nbstat small muted"></div><div class="nbcells"><p class="muted">${ico('loader')} Loading notebook...</p></div>`;
    refreshIcons(body);
    let nb; try { nb = await fetchNotebook(f); } catch(e){ $('.nbcells', body).innerHTML = `<div class="callout warn">This notebook could not be loaded. It should be in the <code>${NB_DIR}</code> folder next to the lab file, and the lab must be opened from a web server or GitHub Pages (browsers block reading local files when the page is opened by double-clicking).</div>`; refreshIcons(body); return; }
    if(!panel.isConnected) return;
    const cells = nb.cells || []; let ns = null;
    const codeOf = c => [].concat(c.source).join('');
    $('.nbcells', body).innerHTML = cells.map((c,i) => c.cell_type === 'markdown' ? `<div class="nbmd">${mdToHTML(codeOf(c))}</div>`
      : c.cell_type === 'code' ? `<div class="nbcode" data-i="${i}"><div class="nbcbar"><span class="mono small">In [${c.execution_count ?? ' '}]</span>${info.run?`<button class="btn ghost sm" data-run="${i}">${ico('play')} Run</button>`:''}</div><pre class="nbsrc">${pyHL(codeOf(c))}</pre><div class="nbout" data-saved="1">${outputHTML(c.outputs)}</div></div>` : '').join('');
    typeset($('.nbcells', body)); refreshIcons(body);
    const st = m => { $('.nbstat', body).textContent = m; };
    const runCell = async i => {
      const c = cells[i]; const box = $(`.nbcode[data-i="${i}"]`, body); const out = $('.nbout', box);
      const src = codeOf(c).split('\n').map(l => /^\s*[!%]/.test(l) ? '# ' + l : l).join('\n');
      box.classList.add('running'); out.removeAttribute('data-saved'); out.innerHTML = '<p class="muted small">Running...</p>';
      const py = await loadPy(st); await nbPrepare(py, src, st);
      if(!ns){ ns = py.globals.get('dict')(); ns.set('display', py.globals.get('display')); ns.set('HTML', py.globals.get('HTML')); }
      let text = '', html = '', failed = false;
      py.setStdout({ batched: t => { text += t + '\n'; } }); py.setStderr({ batched: t => { if(!/warn/i.test(t)) text += t + '\n'; } });
      st(`Running cell ${i+1}...`); await new Promise(r => setTimeout(r, 30));
      try { const r = py.globals.get('_lab_run_cell')(src, ns); if(r){ const v = r.toJs(); html = v[0]==='html' ? (/<script/i.test(v[1]) ? '' : `<div class="nbhtml">${v[1]}</div>`) : `<pre class="nbo">${escH(v[1])}</pre>`; r.destroy && r.destroy(); } }
      catch(e){ failed = true; text += String(e.message || e).split('\n').filter(l => l.trim()).slice(-6).join('\n'); }
      const figs = py.runPython(FIG_PY).toJs();
      const disp = py.runPython('_d = list(_lab_disp); _lab_disp.clear(); _d').toJs();
      const parts = text.split(/\x01D(\d+)\x01\n?/); let cellHTML = '';
      parts.forEach((p,k) => { if(k % 2 === 0){ if(p.trim()) cellHTML += `<pre class="nbo ${failed && k===parts.length-1?'err':''}">${escH(p)}</pre>`; } else { const d = disp[+p]; if(d) cellHTML += d[0]==='html' ? (/<script/i.test(d[1]) ? '' : `<div class="nbhtml">${d[1]}</div>`) : `<pre class="nbo">${escH(d[1])}</pre>`; } });
      out.innerHTML = cellHTML + html + figs.map(b => `<img class="nbimg" alt="Plot output" src="data:image/png;base64,${b}">`).join('') || '<p class="muted small">(no output)</p>';
      box.classList.remove('running'); return !failed;
    };
    $$('[data-run]', body).forEach(b => b.onclick = async () => { b.disabled = true; try { await runCell(+b.dataset.run); st('Done.'); } catch(e){ st(String(e.message||e)); } b.disabled = false; });
    const ra = $('[data-a="runall"]', body);
    if(ra) ra.onclick = async () => { ra.disabled = true; const codeIdx = cells.map((c,i)=>c.cell_type==='code'?i:-1).filter(i=>i>=0);
      try { for(const i of codeIdx){ const ok = await runCell(i); if(!ok){ st(`Stopped: cell ${i+1} raised an error.`); ra.disabled = false; return; } } st('All cells ran successfully.'); } catch(e){ st(String(e.message||e)); } ra.disabled = false; };
    const cl = $('[data-a="clear"]', body); if(cl) cl.onclick = () => { ns = null; show(f); };
  };
  $$('.nbtab', panel).forEach(b => b.onclick = () => show(b.dataset.f));
  show(NB_BY_SECTION[s.id][0]);
}
