<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predictive Analytics Lab</title>
<meta name="description" content="Interactive lab on predictive analytics: the 7-step ML procedure, classical classifiers, neural networks, CNNs, RNNs, LSTMs, attention, transformers, and time-series forecasting.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f8f6; --surface:#ffffff; --surface2:#edf4ef; --border:#d6e3da;
  --text:#13241a; --muted:#5a6d62; --primary:#00843D; --primary-ink:#ffffff;
  --navy:#003D21; --navy2:#0b5132; --accent:#9ED9B5; --amber:#d98e04;
  --good:#00843D; --bad:#c43d32; --c1:#00843D; --c2:#d98e04; --c3:#2b6cb0; --c4:#c43d32; --c5:#7b4fb3; --c6:#0b9aa8;
  --grid:#e2ebe5; --axis:#7d8f84; --code:#eff5f1; --shadow:0 1px 2px rgba(10,40,20,.06),0 4px 14px rgba(10,40,20,.06);
  --side-w:300px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1712; --surface:#13221a; --surface2:#1a2e23; --border:#27402f;
    --text:#e5efe8; --muted:#9db3a5; --primary:#4cc38a; --primary-ink:#04140b;
    --navy:#07130d; --navy2:#0f2a1c; --accent:#9ED9B5; --amber:#f0b440;
    --good:#4cc38a; --bad:#f07068; --c1:#4cc38a; --c2:#f0b440; --c3:#63a8f0; --c4:#f07068; --c5:#b48cf0; --c6:#3fd0d8;
    --grid:#1f3428; --axis:#7f978a; --code:#0e1a14; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1712; --surface:#13221a; --surface2:#1a2e23; --border:#27402f;
  --text:#e5efe8; --muted:#9db3a5; --primary:#4cc38a; --primary-ink:#04140b;
  --navy:#07130d; --navy2:#0f2a1c; --accent:#9ED9B5; --amber:#f0b440;
  --good:#4cc38a; --bad:#f07068; --c1:#4cc38a; --c2:#f0b440; --c3:#63a8f0; --c4:#f07068; --c5:#b48cf0; --c6:#3fd0d8;
  --grid:#1f3428; --axis:#7f978a; --code:#0e1a14; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15.5px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--primary)}
code,.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:.88em}
code{background:var(--code);padding:1px 5px;border-radius:4px}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h2{font-size:1.35rem;margin-top:1.6em}
h3{font-size:1.08rem;margin-top:1.2em}
p{margin:.5em 0 .9em}
ul,ol{padding-left:1.3em;margin:.4em 0 1em}
li{margin:.2em 0}

/* layout */
.topbar{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--navy);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .brand{font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand small{font-weight:500;color:var(--accent);margin-left:8px}
.topbar .spacer{flex:1}
.topbar .prog{display:flex;align-items:center;gap:8px;font-size:.82rem;color:#d6eadc}
.topbar .prog .bar{width:120px;height:7px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
.topbar .prog .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;height:34px;min-width:34px;padding:0 9px;cursor:pointer;font:inherit;font-size:.85rem}
.iconbtn:hover{background:rgba(255,255,255,.1)}
#menuBtn{display:none}
.shell{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:var(--side-w);flex:0 0 var(--side-w);background:var(--navy2);color:#dbe7f1;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;padding:12px 10px 40px}
.sidebar .search{width:100%;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:.88rem;margin-bottom:10px}
.sidebar .search::placeholder{color:#9fb5c8}
.navgroup{margin-bottom:6px}
.navgroup>button{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:0;color:var(--accent);font:600 .74rem/1 Inter,sans-serif;text-transform:uppercase;letter-spacing:.9px;padding:10px 8px 6px;cursor:pointer}
.navgroup>button .chev{transition:transform .2s}
.navgroup.closed>button .chev{transform:rotate(-90deg)}
.navgroup.closed ul{display:none}
.navgroup ul{list-style:none;margin:0;padding:0}
.navgroup li{margin:1px 0}
.navgroup a{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border-radius:8px;color:#dbe7f1;text-decoration:none;font-size:.9rem;line-height:1.3}
.navgroup a:hover{background:rgba(255,255,255,.07)}
.navgroup a.active{background:var(--primary);color:#fff}
:root[data-theme="dark"] .navgroup a.active{color:#06121c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .navgroup a.active{color:#06121c}}
.navgroup a .num{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:600;background:rgba(255,255,255,.1)}
.navgroup a .ttl{flex:1}
.navgroup a .score{font-size:.72rem;font-weight:600;padding:1px 6px;border-radius:9px;background:rgba(255,255,255,.12)}
.navgroup a .score.full{background:#2fa866;color:#fff}
.main{flex:1;min-width:0;padding:24px 40px 80px 44px}
.content{max-width:1120px;margin:0}
.overlay{display:none}
.ico{width:1.05em;height:1.05em;vertical-align:-.17em;stroke-width:2.1;flex:0 0 auto}
i.ico{display:inline-block}
.navgroup>button span{display:inline-flex;align-items:center;gap:6px}
.navgroup a .num .ico{width:14px;height:14px;vertical-align:0}
.sechead .kicker{display:flex;align-items:center;gap:6px}
.sechead h1{display:flex;align-items:center;gap:12px}
.hico{flex:0 0 44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.hico .ico{width:24px;height:24px}
.panel>.ph .badge{display:inline-flex;align-items:center;gap:4px}
.panel>.ph .badge .ico{width:12px;height:12px}
.callout .cico{float:left;margin:2px 8px 0 0;color:var(--primary)}
.callout.warn .cico{color:var(--amber)}
.callout.src .cico{color:var(--muted)}
.tile .tico{float:right;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.btn .ico{width:15px;height:15px;vertical-align:-.2em}
.codecell{margin-top:30px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.codecell .cch{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;background:#0a120e;color:#e6edf3;border-bottom:1px solid #26392d}
.codecell .cch .muted{color:#9db3a5}
.codecell{border-color:#26392d}
.codecell .cch .ico{color:#4cc38a}
.codecell .cedit{position:relative;background:#1e1e1e;border-bottom:1px solid #26392d}
.codecell .chl,.codecell textarea.code{margin:0;padding:14px 16px;font:13px/1.6 "JetBrains Mono",Consolas,monospace;tab-size:4;white-space:pre;letter-spacing:0;word-spacing:0}
.codecell .chl{position:absolute;inset:0;overflow:hidden;color:#d4d4d4;pointer-events:none;background:transparent}
.codecell textarea.code{position:relative;display:block;width:100%;border:0;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#aeafad;resize:vertical;overflow:auto}
.pk{color:#c586c0}.pd{color:#569cd6}.ps{color:#ce9178}.pc{color:#6a9955}.pn{color:#b5cea8}.pf{color:#dcdcaa}.pt{color:#4ec9b0}.pv{color:#9cdcfe}
.codecell textarea.code::selection{background:rgba(58,130,200,.38);color:transparent;-webkit-text-fill-color:transparent}
.codecell textarea.code:focus{outline:2px solid #4cc38a;outline-offset:-2px}
.codecell .ccb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:#15231b;border-bottom:1px solid #26392d}
.codecell .ccb .btn.ghost{color:#d6eadc;border-color:#35503f;background:transparent}
.codecell .ccb .btn.ghost:hover{background:#1f3327}
.codecell .ccb .cstat{color:#9db3a5}
.codecell .cout{padding-top:6px}
.codecell .cout{padding:0 16px 14px}
.codecell .cout img{max-width:100%;display:block;margin:8px 0;border-radius:8px;background:#fff}
.nbpanel{margin-top:30px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.nbpanel>.cch{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;background:var(--navy);color:#fff}
.nbpanel>.cch .muted{color:#cfe5d6}
.nbtabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2)}
.nbtab{font:inherit;font-size:.84rem;padding:6px 11px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-align:left}
.nbtab.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:600}
.nbbody{padding:14px 16px}
.nbhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px}
.nbhead .pill{display:inline-flex;align-items:center;gap:5px}
.nbstat{min-height:1.2em}
.nbcells{max-height:900px;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:4px 14px;margin-top:6px;background:var(--bg)}
.nbmd h2{font-size:1.2rem;margin:14px 0 6px}.nbmd h3{font-size:1.05rem;margin:12px 0 6px}.nbmd h4,.nbmd h5,.nbmd h6{font-size:.95rem;margin:10px 0 4px}
.nbmd p,.nbmd li{font-size:.93rem}
.nbcode{margin:12px 0;border:1px solid #26392d;border-radius:10px;overflow:hidden;background:var(--surface)}
.nbcode.running{outline:2px solid var(--primary)}
.nbcbar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:#15231b;color:#9db3a5}
.nbcbar .btn.ghost{color:#d6eadc;border-color:#35503f;padding:2px 9px}
.nbsrc{margin:0;padding:10px 12px;background:#1e1e1e;color:#d4d4d4;font:12.5px/1.5 "JetBrains Mono",Consolas,monospace;overflow:auto;max-height:420px}
.nbout{padding:6px 10px}
.nbout:empty{display:none}
.nbout[data-saved]:not(:empty)::before{content:"Saved output";display:block;font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.nbo{margin:4px 0;font:12px/1.45 "JetBrains Mono",Consolas,monospace;white-space:pre-wrap;max-height:260px;overflow:auto;background:var(--code);padding:8px 10px;border-radius:8px;border:1px solid var(--border)}
.nbo.err{color:var(--bad);border-color:var(--bad)}
.nbimg{max-width:100%;background:#fff;border-radius:6px;margin:6px 0;display:block}
.nbhtml{overflow:auto;max-height:320px;font-size:.78rem;margin:4px 0}
.nbhtml table{border-collapse:collapse}.nbhtml th,.nbhtml td{border:1px solid var(--border);padding:3px 7px;text-align:right}
.exrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:10px 0 14px}
.exfig{margin:0;text-align:center;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px 10px;max-width:100%}
.exfig img{display:block;margin:0 auto;max-width:100%;object-fit:contain;cursor:zoom-in;border-radius:6px;background:#fff}
.exfig figcaption{font-size:.76rem;color:var(--muted);margin-top:5px;max-width:240px;margin-left:auto;margin-right:auto;line-height:1.35}
.exarr{color:var(--muted);font-size:1.4rem;align-self:center}
img.eximg{vertical-align:middle;margin:2px 4px;border-radius:6px}
.verdict{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--border)}
.verdict.good{background:color-mix(in srgb,var(--good) 10%,transparent);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.verdict.bad{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.slidegal{margin-top:30px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.slidegal>.cch{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}
.slidegal>.cch .ico{color:var(--primary)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:14px 16px}
.sfig{margin:0;cursor:zoom-in;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface);transition:transform .12s,box-shadow .12s}
.sfig:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--primary)}
.sfig img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#fff}
.sfig figcaption{font-size:.8rem;padding:6px 9px;line-height:1.35}
#lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:16px}
#lightbox.on{display:flex}
#lightbox .lbin{max-width:min(1280px,96vw);width:100%}
#lightbox img{display:block;width:100%;max-height:80vh;object-fit:contain;background:#fff;border-radius:8px}
#lightbox .lbbar{display:flex;align-items:center;gap:10px;color:#fff;margin-top:10px}
#lightbox .lbbar span{flex:1;text-align:center}
#lightbox .lbbar .muted{color:#bbb}
.readout.err{border-color:var(--bad);color:var(--bad)}
.main{overflow-x:hidden}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.katex{position:relative}

/* section header */
.sechead{margin-bottom:18px}
.sechead .kicker{font-size:.78rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--primary)}
.sechead h1{font-size:1.85rem;margin:.2em 0 .3em}
.sechead .meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:.85rem}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-size:.78rem;color:var(--muted)}

/* cards and panels */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin:14px 0;box-shadow:var(--shadow)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin:18px 0;box-shadow:var(--shadow);overflow:hidden}
.panel>.ph{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}
.panel>.ph b{font-size:.95rem}
.panel>.ph .badge{font-size:.7rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--primary-ink);background:var(--primary);padding:2px 8px;border-radius:10px}
.panel>.pb{padding:16px}
.callout{border-left:0;background:var(--surface2);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:.95rem}
.callout.key::before{content:"Key idea";display:block;font-weight:700;font-size:.75rem;letter-spacing:.6px;text-transform:uppercase;color:var(--primary);margin-bottom:3px}
.callout.warn::before{content:"Watch out";display:block;font-weight:700;font-size:.75rem;letter-spacing:.6px;text-transform:uppercase;color:var(--amber);margin-bottom:3px}
.callout.src{font-size:.82rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mini{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.mini h4{margin:0 0 .35em;font-size:.95rem}
.mini p{margin:.2em 0;font-size:.9rem}
.big{font-size:1.6rem;font-weight:700;color:var(--primary)}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0}
.tbl th,.tbl td{border:1px solid var(--border);padding:6px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--surface2);font-weight:600}
.tbl td.c,.tbl th.c{text-align:center}
.tblwrap{overflow-x:auto}
tr.hl td{background:color-mix(in srgb,var(--primary) 14%,transparent)}
td.good{color:var(--good);font-weight:600}
td.bad{color:var(--bad);font-weight:600}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;margin:6px 0 12px}
.ctl{display:flex;flex-direction:column;gap:3px;font-size:.84rem;color:var(--muted);min-width:150px}
.ctl output{font-weight:600;color:var(--text)}
.ctl label{display:flex;justify-content:space-between;gap:8px}
input[type=range]{width:100%;accent-color:var(--primary)}
select,input[type=number],input[type=text]{font:inherit;font-size:.9rem;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
input[type=number]{width:90px}
.btn{font:inherit;font-size:.88rem;font-weight:600;padding:7px 14px;border-radius:9px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-ink);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:.84rem;padding:6px 12px;border:0;background:var(--surface);color:var(--text);cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--primary);color:var(--primary-ink);font-weight:600}
canvas.plot{width:100%;display:block;border-radius:10px;background:var(--surface);border:1px solid var(--border);touch-action:none}
.readout{font-family:"JetBrains Mono",Consolas,monospace;font-size:.84rem;background:var(--code);border:1px solid var(--border);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-x:auto;line-height:1.55}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-weight:600;font-size:.85rem}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.clickable{cursor:pointer;transition:transform .12s,box-shadow .12s}
.clickable:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.selected{outline:2px solid var(--primary);outline-offset:1px}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.stepchip{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:.88rem;font-weight:500}
.stepchip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.detail{margin-top:12px;min-height:60px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow .box{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:.86rem;text-align:center}
.flow .box.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.flow .arr{color:var(--muted)}
.heat td{width:44px;height:34px;text-align:center;font-size:.78rem;border:1px solid var(--border);font-family:"JetBrains Mono",monospace}
.colab{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;text-decoration:none;border:1px solid var(--border);padding:5px 10px;border-radius:9px;background:var(--surface2);margin:4px 6px 4px 0}
.colab::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--amber)}
svg text{font-family:Inter,sans-serif}

/* quiz */
.quiz{margin-top:30px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.quiz .qh{padding:14px 18px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px}
.quiz .qh b{flex:1}
.quiz .qh .qs{font-size:.85rem;color:var(--accent)}
.q{padding:16px 18px;border-bottom:1px solid var(--border)}
.q:last-of-type{border-bottom:0}
.q .qt{font-weight:600;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 11px;border:1px solid var(--border);border-radius:10px;margin:6px 0;cursor:pointer;background:var(--surface)}
.opt:hover{background:var(--surface2)}
.opt input{margin-top:4px;accent-color:var(--primary)}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.q .why{display:none;margin-top:8px;font-size:.9rem;padding:9px 12px;border-radius:10px;background:var(--surface2)}
.q.done .why{display:block}
.quiz .qf{padding:14px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface2);border-top:1px solid var(--border)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.pager a{flex:1;display:block;text-decoration:none;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px 14px;color:var(--text)}
.pager a small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.6px}
.pager a.next{text-align:right}
.pager a:hover{border-color:var(--primary)}

/* home */
.hero{background:linear-gradient(135deg,var(--navy),var(--primary));color:#fff;border-radius:18px;padding:30px 30px;margin-bottom:20px}
.hero h1{font-size:2.1rem;margin:0 0 .3em}
.hero p{color:#dff2e6;max-width:720px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:block;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--primary)}
.tile small{color:var(--muted);display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px}
.tile b{display:block;margin:2px 0 4px}
.tile .tb{height:5px;border-radius:4px;background:var(--surface2);overflow:hidden}
.tile .tb i{display:block;height:100%;background:var(--good)}

@media (max-width: 1000px){
  .grid3,.grid4{grid-template-columns:1fr 1fr}
}
@media (max-width: 860px){
  #menuBtn{display:inline-block}
  .sidebar{position:fixed;left:0;top:56px;z-index:40;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 30px rgba(0,0,0,.35)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .overlay{display:block;position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.35);z-index:35}
  .main{padding:18px 16px 70px}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .topbar .prog .bar{width:60px}
  .topbar .brand small{display:none}
  .sechead h1{font-size:1.5rem}
  .hero{padding:22px 18px}
  .hero h1{font-size:1.6rem}
}
@media (max-width: 480px){.exrow{gap:8px}.exfig{padding:6px;flex:1 1 40%}.exfig img{height:auto!important;max-height:110px}.exfig figcaption{font-size:.7rem}.exarr{display:none}.topbar .prog span{display:none}}
/* Ordering game with movable cards */
.og-label{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:4px 0 6px}
.og-pile{display:flex;flex-wrap:wrap;gap:8px;min-height:72px;padding:10px;border:2px dashed var(--border);border-radius:14px;background:var(--surface2);transition:border-color .15s,background .15s}
.og-pile:empty::before{content:"All cards placed. Check your order, or drag a card back here.";color:var(--muted);font-size:.85rem;margin:auto}
.og-pile .og-card{width:150px}
.og-track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-top:4px}
.og-slot{position:relative;min-height:118px;border:2px dashed var(--border);border-radius:14px;padding:24px 6px 6px;display:flex;background:var(--surface);transition:border-color .15s,background .15s}
.og-slot:not(:last-child)::after{content:"";position:absolute;right:-11px;top:50%;width:8px;height:8px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:translateY(-50%) rotate(45deg)}
.og-num{position:absolute;top:5px;left:8px;width:18px;height:18px;border-radius:50%;background:var(--primary);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center}
.og-slot .og-card{width:100%}
.og-slot.target,.og-pile.target{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 9%,var(--surface))}
.og-slot.ok{border-style:solid;border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.og-slot.bad{border-style:solid;border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.og-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 8px;border-radius:11px;background:var(--surface);border:1px solid var(--border);box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;font-size:.84rem;font-weight:600;line-height:1.25;text-align:center;transition:transform .12s,box-shadow .12s}
.og-card:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.12)}
.og-card:focus-visible,.og-card.sel{outline:3px solid var(--primary);outline-offset:2px}
.og-card .ico{width:22px;height:22px;color:var(--primary)}
.og-card small{font-weight:500;font-size:.72rem;color:var(--good)}
.og-card.dragging{opacity:.3}
.og-ghost{position:fixed;z-index:1000;pointer-events:none;transform:rotate(3deg) scale(1.04);box-shadow:0 14px 30px rgba(0,0,0,.28);cursor:grabbing}
.og-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.og-meter{flex:1 1 160px;height:8px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);overflow:hidden}
.og-meter i{display:block;height:100%;background:var(--primary);transition:width .25s}
@media (max-width: 1000px){.og-track{grid-template-columns:repeat(4,minmax(0,1fr))}.og-slot::after{display:none}}
@media (max-width: 560px){.og-track{grid-template-columns:repeat(2,minmax(0,1fr))}.og-pile .og-card{width:calc(50% - 4px)}}
.h2ico{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;margin-right:10px;vertical-align:-7px;background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.h2ico .ico{width:18px;height:18px}
h4 .h4ico{width:17px;height:17px;color:var(--primary);vertical-align:-3px;margin-right:6px}
.stepchip .ico{width:16px;height:16px;vertical-align:-3px;margin-right:5px}
.stepchip.on .ico{color:inherit}
.iw-box{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface)}
.iw-grid{display:flex;flex-wrap:wrap;gap:6px;min-height:50px;align-items:center}
.iw-tile{position:relative;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--border)}
.iw-tile .ico{width:22px;height:22px;color:var(--primary)}
.iw-tile.dog .ico{color:var(--c3)}
.iw-tile.night{background:#07150d;border-color:#1f3a2a}.iw-tile.night .ico{color:#6ee7a0}
.iw-tile.human{width:64px;height:64px}.iw-tile.human .ico{width:36px;height:36px;color:var(--bad)}
.iw-tile.tr{box-shadow:0 0 0 2px var(--primary)}.iw-tile.te{box-shadow:0 0 0 2px var(--c3)}
.iw-tile em{position:absolute;bottom:1px;right:3px;font-size:.58rem;font-style:normal;color:var(--muted)}
.iw-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 48px;align-items:center;gap:8px;margin:6px 0;font-size:.86rem}
.iw-meter{height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);overflow:hidden}
.iw-meter i{display:block;height:100%;border-radius:6px;transition:width .3s}
@media (max-width: 560px){.iw-row{grid-template-columns:1fr 44px}.iw-row .iw-meter{grid-column:1 / -1;grid-row:2}}
.iw-frame{position:relative;flex:0 0 auto;width:57px;height:40px;border-radius:8px;border:1px solid var(--border);overflow:hidden}
.iw-frame.tr{box-shadow:0 0 0 2px var(--primary)}.iw-frame.te{box-shadow:0 0 0 2px var(--c3);cursor:pointer}
.iw-frame.hl{box-shadow:0 0 0 3px #f59e0b;transform:translateY(-2px)}
.iw-cat{position:absolute;width:24px;height:24px;display:grid;place-items:center;transform-origin:center bottom}
.iw-cat .ico{width:24px;height:24px;color:#173d25}
.iw-frame em{position:absolute;top:1px;left:3px;font-size:.56rem;font-style:normal;font-weight:700;color:#24382c}
.iw-strip{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 8px}
.iw-player{max-width:300px;margin:4px 0 10px}
.iw-screen{position:relative;width:260px;height:185px;border-radius:12px;border:2px solid #24382c;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.iw-screen .iw-cat{transform:none}.iw-screen .iw-cat .ico{width:100%;height:100%}
.iw-screen em{position:absolute;top:6px;left:8px;font-size:.72rem;font-style:normal;font-weight:700;color:#24382c;background:rgba(255,255,255,.7);padding:1px 6px;border-radius:6px}
.iw-pctl{display:flex;align-items:center;gap:8px;margin-top:8px;width:260px}
.iw-frame.now::after{content:"";position:absolute;inset:2px;border:2px dashed #24382c;border-radius:6px}
.dt-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface2);padding:8px;text-align:center}
.dt-svg{display:inline-block;max-width:none}
.dt-svg text{fill:var(--text);font:12px Inter,system-ui,sans-serif}
.dt-svg .nd rect{fill:var(--surface);stroke:var(--border);stroke-width:1.5}
.dt-svg .nd.split rect{fill:color-mix(in srgb,var(--primary) 10%,var(--surface));stroke:var(--primary)}
.dt-svg .nd.pos rect{fill:color-mix(in srgb,var(--good) 18%,var(--surface));stroke:var(--good)}
.dt-svg .nd.neg rect{fill:color-mix(in srgb,var(--bad) 16%,var(--surface));stroke:var(--bad)}
#pmSvg .nd.pos rect{fill:color-mix(in srgb,var(--bad) 16%,var(--surface));stroke:var(--bad)}
#pmSvg .nd.neg rect{fill:color-mix(in srgb,var(--good) 18%,var(--surface));stroke:var(--good)}
.dt-svg .nd.open{cursor:pointer}.dt-svg .nd.open rect{stroke:var(--c3);stroke-dasharray:6 4;stroke-width:2}
.dt-svg .nd.open:hover rect{fill:color-mix(in srgb,var(--c3) 10%,var(--surface))}
.dt-svg .nd.sel rect{stroke:#f59e0b;stroke-width:3;stroke-dasharray:none}
.dt-svg .nd.path rect{stroke:#f59e0b;stroke-width:3}
.dt-svg .hint{fill:var(--c3);font-style:italic;font-size:11px}
.dt-svg .ed{stroke:var(--muted);stroke-width:1.5}.dt-svg .ed.path{stroke:#f59e0b;stroke-width:3}
.dt-svg .el{font-size:11px;font-weight:600;fill:var(--muted);paint-order:stroke;stroke:var(--surface2);stroke-width:5px;stroke-linejoin:round}
.dt-ig{display:grid;grid-template-columns:96px 1fr 46px auto;gap:8px;align-items:center;margin:5px 0;font-size:.88rem}
.mb{display:grid;grid-template-columns:minmax(0,1fr) 170px 150px;grid-template-areas:"ltm l3 fg" "enc . fg" "stm l2 fg" "att . fg" "sm l1 fg" "perc . ." "in in in";gap:8px 10px;align-items:center}

.mb-v .ico{background:#6fa8dc;color:#fff;border-radius:6px;padding:2px;width:22px;height:22px}

</header>
<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Lab sections">
    <input class="search" id="navSearch" type="search" placeholder="Filter topics...">

  </nav>

  <main class="main"><div class="content" id="content"></div></main>

<script>
/* ================= Core engine ================= */
const R = String.raw;
const LAB = { sections: [], groups: [], cleanups: [], add(s){ this.sections.push(s); if(!this.groups.includes(s.group)) this.groups.push(s.group); } };
const ICONS = { intro:'compass', sevensteps:'list-ordered', problem:'target', datacollection:'flask-conical', dataprep:'sparkles', exploration:'search', modeldev:'wrench', evaluation:'gauge', deployment:'rocket',
  naivebayes:'percent', knn:'users', decisiontree:'git-fork', perceptron:'circle-dot', mlp:'network', nntraining:'refresh-ccw', deeplearning:'layers', cnn:'grid-3x3', cnnimpl:'cpu',
  sequential:'arrow-right-left', rnn:'repeat', lstm:'brain', attention:'eye', transformer:'languages', llm:'bot', forecasting:'trending-up', statmodels:'line-chart', mlforecast:'trees', fmforecast:'sparkles' };
const GROUP_ICONS = { 'Foundations':'book-open', 'The 7-Step Procedure':'workflow', 'Classical Classifiers':'shapes', 'Neural Networks':'network', 'Deep Learning':'boxes', 'Sequential Models':'activity', 'Attention and Transformers':'scan-search', 'Time-series Forecasting':'clock' };
const BADGE_ICONS = { 'Interactive':'sliders-horizontal', 'Explore':'mouse-pointer-click', 'Game':'gamepad-2', 'Exercise':'pencil', 'Step by step':'footprints' };
const ico = (name, cls='') => `<i data-lucide="${name}" class="ico ${cls}"></i>`;
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (v, d=3) => (Math.abs(v) >= 1e5 || (Math.abs(v) < 1e-3 && v !== 0)) ? v.toExponential(Math.max(1,d-1)) : (+v).toFixed(d);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const sigmoid = z => 1/(1+Math.exp(-z));
const softmax = arr => { const m = Math.max(...arr); const e = arr.map(v => Math.exp(v-m)); const s = e.reduce((a,b)=>a+b,0); return e.map(v => v/s); };
const sum = a => a.reduce((x,y)=>x+y,0);
const mean = a => sum(a)/a.length;
const randn = (rng=Math.random) => { let u=0,v=0; while(!u) u=rng(); while(!v) v=rng(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
function seeded(seed){ let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const store = {
  key: 'pa-lab-v1',
  get(){ try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem(this.key, JSON.stringify(v)); } catch(e){} }
};

/* bind a range input to an <output> and a callback */
function bindRange(root, id, cb, fmtFn){
  const el = $('#'+id, root); const out = $('#'+id+'_v', root);
  const upd = () => { if(out) out.textContent = fmtFn ? fmtFn(+el.value) : el.value; cb && cb(+el.value); };
  el.addEventListener('input', upd); if(out) out.textContent = fmtFn ? fmtFn(+el.value) : el.value;
  return el;
}
function segmented(root, sel, cb){
  const seg = $(sel, root); const btns = $$('button', seg);
  btns.forEach(b => b.addEventListener('click', () => { btns.forEach(x => x.classList.remove('on')); b.classList.add('on'); cb(b.dataset.v, b); }));
}
function onResize(fn){ LAB.cleanups.push(fn); }

/* ---------- tiny plotting helper ---------- */
function Plot(canvas, o){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 600, h = o.height || canvas.clientHeight || 300;
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  const pad = Object.assign({l:52, r:16, t:14, b:40}, o.pad||{});
  const P = { ctx, w, h, pad, xmin:o.xmin, xmax:o.xmax, ymin:o.ymin, ymax:o.ymax };
  P.x = v => pad.l + (v - P.xmin) / (P.xmax - P.xmin) * (w - pad.l - pad.r);
  P.y = v => h - pad.b - (v - P.ymin) / (P.ymax - P.ymin) * (h - pad.t - pad.b);
  P.ix = px => P.xmin + (px - pad.l) / (w - pad.l - pad.r) * (P.xmax - P.xmin);
  P.iy = py => P.ymin + (h - pad.b - py) / (h - pad.t - pad.b) * (P.ymax - P.ymin);
  P.axes = (opt={}) => {
    const g = cssVar('--grid'), a = cssVar('--axis'), t = cssVar('--muted');
    ctx.save(); ctx.font = '11px Inter, sans-serif'; ctx.fillStyle = t; ctx.strokeStyle = g; ctx.lineWidth = 1;
    const nx = opt.nx || 6, ny = opt.ny || 5;
    for(let i=0;i<=nx;i++){ const v = P.xmin + i*(P.xmax-P.xmin)/nx; const X = P.x(v);
      ctx.beginPath(); ctx.moveTo(X, pad.t); ctx.lineTo(X, h-pad.b); ctx.stroke();
      ctx.textAlign='center'; ctx.fillText(opt.xfmt ? opt.xfmt(v) : niceNum(v), X, h-pad.b+15); }
    for(let i=0;i<=ny;i++){ const v = P.ymin + i*(P.ymax-P.ymin)/ny; const Y = P.y(v);
      ctx.beginPath(); ctx.moveTo(pad.l, Y); ctx.lineTo(w-pad.r, Y); ctx.stroke();
      ctx.textAlign='right'; ctx.fillText(opt.yfmt ? opt.yfmt(v) : niceNum(v), pad.l-6, Y+4); }
    ctx.strokeStyle = a; ctx.beginPath(); ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, h-pad.b); ctx.lineTo(w-pad.r, h-pad.b); ctx.stroke();
    ctx.fillStyle = t; ctx.font = '12px Inter, sans-serif';
    if(opt.xlabel){ ctx.textAlign='center'; ctx.fillText(opt.xlabel, pad.l + (w-pad.l-pad.r)/2, h-6); }
    if(opt.ylabel){ ctx.save(); ctx.translate(13, pad.t + (h-pad.t-pad.b)/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center'; ctx.fillText(opt.ylabel, 0, 0); ctx.restore(); }
    ctx.restore();
  };
  P.line = (xs, ys, color, width=2, dash=null) => {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width; if(dash) ctx.setLineDash(dash);
    ctx.beginPath(); let started=false;
    for(let i=0;i<xs.length;i++){ if(ys[i]==null || !isFinite(ys[i])){ started=false; continue; } const X=P.x(xs[i]), Y=P.y(ys[i]); if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y); }
    ctx.stroke(); ctx.restore();
  };
  P.fn = (f, color, width=2, dash=null, n=300) => { const xs=[], ys=[]; for(let i=0;i<=n;i++){ const x=P.xmin+i*(P.xmax-P.xmin)/n; xs.push(x); ys.push(f(x)); } P.line(xs, ys, color, width, dash); };
  P.dot = (x, y, color, r=4, stroke=null, shape='circle') => {
    ctx.save(); ctx.fillStyle = color; const X=P.x(x), Y=P.y(y); ctx.beginPath();
    if(shape==='square') ctx.rect(X-r, Y-r, 2*r, 2*r); else if(shape==='tri'){ ctx.moveTo(X, Y-r*1.2); ctx.lineTo(X+r*1.1, Y+r*.8); ctx.lineTo(X-r*1.1, Y+r*.8); ctx.closePath(); } else ctx.arc(X, Y, r, 0, 2*Math.PI);
    ctx.fill(); if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); } ctx.restore();
  };
  P.text = (s, x, y, color, align='left', font='12px Inter, sans-serif') => { ctx.save(); ctx.fillStyle = color || cssVar('--text'); ctx.font = font; ctx.textAlign = align; ctx.fillText(s, P.x(x), P.y(y)); ctx.restore(); };
  P.vline = (x, color, dash=[5,4]) => { ctx.save(); ctx.strokeStyle=color; ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(P.x(x), pad.t); ctx.lineTo(P.x(x), h-pad.b); ctx.stroke(); ctx.restore(); };
  P.hline = (y, color, dash=[5,4]) => { ctx.save(); ctx.strokeStyle=color; ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(pad.l, P.y(y)); ctx.lineTo(w-pad.r, P.y(y)); ctx.stroke(); ctx.restore(); };
  P.fillBetween = (xs, ys1, ys2, color) => { ctx.save(); ctx.fillStyle = color; ctx.beginPath(); xs.forEach((x,i)=> i? ctx.lineTo(P.x(x),P.y(ys1[i])) : ctx.moveTo(P.x(x),P.y(ys1[i]))); for(let i=xs.length-1;i>=0;i--) ctx.lineTo(P.x(xs[i]),P.y(ys2[i])); ctx.closePath(); ctx.fill(); ctx.restore(); };
  P.legend = (items, x0, y0) => { ctx.save(); ctx.font='12px Inter, sans-serif'; let X = x0 ?? pad.l+10, Y = y0 ?? pad.t+12;
    items.forEach(([label,color,dash]) => { ctx.strokeStyle=color; ctx.lineWidth=2.5; if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(X,Y-4); ctx.lineTo(X+18,Y-4); ctx.stroke(); ctx.fillStyle=cssVar('--text'); ctx.fillText(label, X+24, Y); Y += 17; }); ctx.restore(); };
  return P;
}
function niceNum(v){ const a=Math.abs(v); if(a===0) return '0'; if(a>=1000) return (v/1000).toFixed(a>=10000?0:1)+'k'; if(a>=10) return v.toFixed(0); if(a>=1) return v.toFixed(1).replace(/\.0$/,''); return v.toFixed(2); }
function alpha(color, a){ // hex or rgb to rgba
  color = color.trim(); if(color.startsWith('#')){ let c=color.slice(1); if(c.length===3) c=c.split('').map(x=>x+x).join(''); const n=parseInt(c,16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
  return color.replace('rgb(','rgba(').replace(')',`,${a})`);
}
/* color scale for heatmaps: value in [0,1] */
function heatColor(v){ v = clamp(v,0,1); const dark = document.documentElement.dataset.theme==='dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  const base = dark ? [19,34,26] : [255,255,255]; const tgt = dark ? [76,195,138] : [0,132,61];
  const c = base.map((b,i)=> Math.round(b + (tgt[i]-b)*v)); return `rgb(${c.join(',')})`; }
function heatText(v){ return v > .55 ? '#fff' : cssVar('--text'); }

/* ---------- quiz ---------- */
function quizHTML(s){
  const st = store.get()[s.id];
  return `<section class="quiz" id="quiz"><div class="qh"><i data-lucide="graduation-cap" class="ico"></i><b>Check your understanding</b><span class="qs" id="qscore">${st ? 'Best: '+st.best+' / '+s.quiz.length : s.quiz.length+' questions'}</span></div>` +
    s.quiz.map((q,i)=> { const ord=q.o.map((_,j)=>j); for(let k=ord.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); [ord[k],ord[r]]=[ord[r],ord[k]]; }
      return `<div class="q" data-i="${i}"><div class="qt">${i+1}. ${q.q}</div>` +
      ord.map(j=> `<label class="opt"><input type="radio" name="q${i}" value="${j}"><span>${q.o[j]}</span></label>`).join('') +
      `<div class="why"></div></div>`; }).join('') +
    `<div class="qf"><button class="btn" id="qcheck">Check answers</button><button class="btn ghost" id="qreset">Try again</button><span id="qmsg" class="muted small"></span></div></section>`;
}
function wireQuiz(root, s){
  const check = () => {
    let score = 0, answered = 0;
    $$('.q', root).forEach(qd => {
      const i = +qd.dataset.i, q = s.quiz[i]; const sel = $('input:checked', qd);
      $$('.opt', qd).forEach(o => o.classList.remove('correct','wrong'));
      if(!sel) return; answered++;
      const j = +sel.value; const optFor = v => $(`input[value="${v}"]`, qd).closest('.opt');
      optFor(q.a).classList.add('correct'); if(j !== q.a) optFor(j).classList.add('wrong'); else score++;
      qd.classList.add('done');
      $('.why', qd).innerHTML = (j===q.a ? '<b style="color:var(--good)">Correct.</b> ' : '<b style="color:var(--bad)">Not quite.</b> ') + q.e;
      typeset(qd);
    });
    if(answered < s.quiz.length){ $('#qmsg', root).textContent = `Answer all ${s.quiz.length} questions to record a score (${answered} answered).`; return; }
    const all = store.get(); const prev = all[s.id]; all[s.id] = { best: Math.max(score, prev ? prev.best : 0), last: score }; store.set(all);
    $('#qmsg', root).innerHTML = `You scored <b>${score} / ${s.quiz.length}</b>.` + (score===s.quiz.length ? ' Excellent work!' : ' Review the explanations and try again.');
    $('#qscore', root).textContent = 'Best: ' + all[s.id].best + ' / ' + s.quiz.length;
    refreshProgress();
  };
  $('#qcheck', root).addEventListener('click', check);
  $('#qreset', root).addEventListener('click', () => { $$('.q', root).forEach(qd => { qd.classList.remove('done'); $$('input', qd).forEach(x=>x.checked=false); $$('.opt', qd).forEach(o=>o.classList.remove('correct','wrong')); }); $('#qmsg', root).textContent=''; });
}

/* ---------- math typesetting ---------- */
function typeset(el){
  if(window.renderMathInElement){ try { renderMathInElement(el, { delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false }); } catch(e){} }
}

/* ---------- navigation ---------- */
function buildNav(){
  const tree = $('#navTree'); const all = store.get();
  let n = 0;
  tree.innerHTML = `<div class="navgroup"><ul><li><a href="#home" data-id="home"><span class="num"><i data-lucide="house" class="ico"></i></span><span class="ttl">Welcome and overview</span></a></li></ul></div>` +
    LAB.groups.map(g => `<div class="navgroup"><button type="button"><span><i data-lucide="${GROUP_ICONS[g]||'folder'}" class="ico"></i> ${g}</span><span class="chev">&#9662;</span></button><ul>` +
      LAB.sections.filter(s=>s.group===g).map(s => { n++; const st = all[s.id];
        return `<li><a href="#${s.id}" data-id="${s.id}" data-title="${(s.title+' '+(s.keywords||'')).toLowerCase()}"><span class="num" title="Section ${n}"><i data-lucide="${ICONS[s.id]||'circle'}" class="ico"></i></span><span class="ttl">${s.title}</span>${st?`<span class="score ${st.best===s.quiz.length?'full':''}">${st.best}/${s.quiz.length}</span>`:''}</a></li>`; }).join('') +
      `</ul></div>`).join('');
  $$('.navgroup>button', tree).forEach(b => b.addEventListener('click', () => b.parentElement.classList.toggle('closed')));
  $$('a', tree).forEach(a => a.addEventListener('click', () => document.body.classList.remove('nav-open')));
  markActive(); refreshIcons($('#navTree'));
}
function markActive(){ const id = (location.hash||'#home').slice(1); $$('#navTree a').forEach(a => a.classList.toggle('active', a.dataset.id===id)); const act = $('#navTree a.active'); if(act) act.scrollIntoView({block:'nearest'}); }
function refreshProgress(){
  const all = store.get(); const tot = LAB.sections.reduce((a,s)=>a+s.quiz.length,0);
  const got = LAB.sections.reduce((a,s)=> a + (all[s.id] ? all[s.id].best : 0), 0);
  $('#progTxt').textContent = `${got} / ${tot}`; $('#progBar').style.width = (100*got/tot)+'%';
  buildNav();
}

function renderHome(){
  const all = store.get(); let n=0;
  return `<div class="hero"><h1>Predictive Analytics: An Interactive Lab</h1>
  <p>Explore how data becomes reliable predictions, from framing the problem and preparing the data to building, evaluating, and deploying models. Each section pairs hands-on panels with a short knowledge check.</p>
  <div class="btnrow"><a class="btn" style="background:#fff;color:#003D21;border-color:#fff;text-decoration:none" href="#${LAB.sections[0].id}"><i data-lucide="play" class="ico"></i> Start the lab</a><button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.6)" id="resetAll">Reset my progress</button></div></div>
  <div class="card"><b><i data-lucide="info" class="ico"></i> How to use this lab.</b> Pick a topic from the side menu (use the &#9776; button on phones). Panels marked <span class="pill info">Interactive</span> respond to sliders, clicks, and buttons. Each section ends with a Python code cell you can run right here (Python loads in the browser on first use) or open in Google Colab. Your quiz scores are kept in this browser only. All notebooks live in the <code>lab_notebooks</code> folder next to this page; when the lab is hosted on GitHub, notebook links open them in Google Colab.</div>` +
  LAB.groups.map(g => `<h2><i data-lucide="${GROUP_ICONS[g]||'folder'}" class="ico"></i> ${g}</h2><div class="tiles">` + LAB.sections.filter(s=>s.group===g).map(s => { n++; const st=all[s.id]; const pct = st ? 100*st.best/s.quiz.length : 0;
    return `<a class="tile" href="#${s.id}"><span class="tico"><i data-lucide="${ICONS[s.id]||'circle'}" class="ico"></i></span><small>Section ${n}</small><b>${s.title}</b><div class="tb"><i style="width:${pct}%"></i></div></a>`; }).join('') + `</div>`).join('') +
  `<p class="muted small" style="margin-top:28px">Sources: lecture slides "Predictive Analytics" (2026, Dr. Alaa Khamis); Stanford CS231n Lecture 8 "Attention and Transformers" (2026); J. Alammar, "The Illustrated Transformer" (2018, CC BY-NC-SA 4.0). Numeric demos marked "illustrative" use made-up values chosen for teaching.</p>`;
}

function render(){
  LAB.cleanups = [];
  const id = (location.hash||'#home').slice(1);
  const content = $('#content');
  const idx = LAB.sections.findIndex(s=>s.id===id);
  if(idx < 0){
    content.innerHTML = renderHome();
    const r = $('#resetAll'); r && r.addEventListener('click', () => { if(confirm('Clear all saved quiz scores in this browser?')){ store.set({}); refreshProgress(); render(); } });
    markActive(); refreshIcons($('#content')); window.scrollTo(0,0); return;
  }
  const s = LAB.sections[idx], prev = LAB.sections[idx-1], next = LAB.sections[idx+1];
  content.innerHTML = `<div class="sechead"><div class="kicker"><i data-lucide="${GROUP_ICONS[s.group]||'folder'}" class="ico"></i> ${s.group}</div><h1><span class="hico"><i data-lucide="${ICONS[s.id]||'circle'}" class="ico"></i></span>${s.title}</h1><div class="meta">${s.source?`<span class="tag">${s.source}</span>`:''}<span class="tag">${s.quiz.length} MCQs</span></div></div>` +
    `<div id="secbody">${s.html}</div>` + notebooksPanelHTML(s) + codeCellHTML(s) + quizHTML(s) +
    `<div class="pager">${prev?`<a href="#${prev.id}"><small>Previous</small>${prev.title}</a>`:`<a href="#home"><small>Back to</small>Overview</a>`}${next?`<a class="next" href="#${next.id}"><small>Next</small>${next.title}</a>`:`<a class="next" href="#home"><small>Finish</small>Overview</a>`}</div>`;
  window.scrollTo(0,0);
  try { s.init && s.init($('#secbody')); } catch(e){ console.error('init error in', s.id, e); }
  wireQuiz(content, s);
  wireCode(content, s);
  wireNotebooks(content, s);
  decorateHeadings($('#secbody'));
  typeset(content);
  refreshIcons(content);
  markActive();
}
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => LAB.cleanups.forEach(f => { try{ f(); }catch(e){} }), 120); });

function boot(){
  try { const t = localStorage.getItem('pa-lab-theme'); if(t) document.documentElement.dataset.theme = t; } catch(e){}
  $('#themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nt = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nt;
    try { localStorage.setItem('pa-lab-theme', nt); } catch(e){}
    LAB.cleanups.forEach(f => { try{ f(); }catch(e){} });
  });
  $('#menuBtn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  $('#overlay').addEventListener('click', () => document.body.classList.remove('nav-open'));
  $('#navSearch').addEventListener('input', e => { const q = e.target.value.toLowerCase();
    $$('#navTree li').forEach(li => { const a = $('a', li); li.style.display = !q || (a.dataset.title||'').includes(q) || a.dataset.id==='home' ? '' : 'none'; });
    $$('#navTree .navgroup').forEach(g => q && g.classList.remove('closed')); });
  refreshProgress();
  window.addEventListener('hashchange', render);
  render();
  // re-typeset once KaTeX finishes loading
  window.addEventListener('load', () => typeset($('#content')));
}

/* helpers used by many sections */
function panel(title, body, badge='Interactive'){ return `<div class="panel"><div class="ph">${badge?`<span class="badge"><i data-lucide="${BADGE_ICONS[badge]||'sparkles'}" class="ico"></i> ${badge}</span>`:''}<b>${title}</b></div><div class="pb">${body}</div></div>`; }

function nbGitHubBase(){
  if(CONFIG.colabNotebookPath) return CONFIG.colabNotebookPath.replace(/\/+$/,'');
  if(!/\.github\.io$/.test(location.hostname)) return '';
  const owner = location.hostname.split('.')[0], parts = location.pathname.split('/').filter(Boolean);
  if(!parts.length) return '';
  const dir = parts.slice(1,-1).map(decodeURIComponent).join('/');
  return `${owner}/${parts[0]}/blob/main/${dir?dir+'/':''}${NB_DIR}`;
}

function iconFor(text){
  const t = String(text).trim(); let best = null;
  for(const k in HEAD_ICONS){ if((t === k || (t.startsWith(k) && !/[A-Za-z]/.test(t[k.length]))) && (!best || k.length > best.length)) best = k; }
  return best ? HEAD_ICONS[best] : null;
}
function decorateHeadings(root){
  $$('h2', root).forEach(h => { if(h.querySelector('i,svg') || h.closest('.nbcells')) return; h.insertAdjacentHTML('afterbegin', `<span class="h2ico">${ico(iconFor(h.textContent) || 'bookmark')}</span>`); });
  $$('h4', root).forEach(h => { if(h.querySelector('i,svg') || h.closest('.nbcells')) return; const n = iconFor(h.textContent); if(n) h.insertAdjacentHTML('afterbegin', ico(n, 'h4ico')); });
}
function stepExplorer(root, sel, items, onPick){
  const host = $(sel, root);
  host.innerHTML = `<div class="steps">${items.map((it,i)=>{ const n = iconFor(it.t); return `<button class="stepchip ${i===0?'on':''}" data-i="${i}">${n?ico(n):''}${it.t}</button>`; }).join('')}</div><div class="detail card" style="margin-top:12px"></div>`;
  const det = $('.detail', host);
  const show = i => { $$('.stepchip', host).forEach((b,j)=>b.classList.toggle('on', i===j)); det.innerHTML = items[i].d; typeset(det); onPick && onPick(i); };
  $$('.stepchip', host).forEach(b => b.addEventListener('click', () => show(+b.dataset.i)));
  show(0);
}

LAB.add({

<p class="callout src">More info: Alaa Khamis, <a href="https://alaakhamis.medium.com/the-7-step-procedure-of-machine-learning-c15c922e7300" target="_blank" rel="noopener">"The 7-Step Procedure of Machine Learning,"</a> <i>Towards Data Science</i>, 2019.</p>`,
  init(root){
    const S=[
      {t:'1. Characterize the problem', n:'Characterize the problem', d:'<b>Characterize the problem.</b> Check that ML is appropriate (a pattern exists, it cannot be pinned down mathematically, and data is available). Define control factors, signals, noise factors, responses, error states, edge cases, target performance, and the deployment tier.'},

      {t:'4. Know better your enemy', n:'Know better your enemy', d:'<b>Know better your enemy</b> (data exploration). Univariate and multivariate analyses reveal separability, linearity, and monotonicity, which guide the choice of model.'},
      {t:'5. Torture your data until it confesses', n:'Torture your data until it confesses', d:'<b>Torture your data until it confesses</b> (model development). Extract or learn features and try the right tools. The No Free Lunch theorem says no algorithm wins on every problem.'},

    const cardHTML=k=>`<div class="og-card" tabindex="0" role="button" data-k="${k}" aria-label="${S[k].n}">${ico(OG_ICON[k])}<span>${S[k].n}</span>${checked&&slots.indexOf(k)===k?`<small>${OG_NAME[k]}</small>`:''}</div>`;
    const draw=()=>{
      pileEl.innerHTML=pile.map(cardHTML).join('');

    const moveTo=(k,dest)=>{ // dest: a slot index or 'pile'
      const from=where(k); checked=false;
      if(dest==='pile'){ if(from.slot!==undefined){ slots[from.slot]=null; pile.push(k); } }
      else { const other=slots[dest]; if(from.slot!==undefined){ slots[from.slot]=other; } else { pile.splice(from.pile,1); if(other!==null) pile.push(other); } slots[dest]=k; }
      sel=null; draw(); };
    const shuffle=()=>{ pile=S.map((_,i)=>i); do{ for(let i=pile.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pile[i],pile[j]]=[pile[j],pile[i]];} }while(pile.every((v,i)=>v===i)); slots=S.map(()=>null); sel=null; checked=false; draw(); };
    // Pointer-based dragging works with mouse, pen, and touch; a press without movement is a tap that selects the card
    let drag=null;
    const targetAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&(el.closest('#ogTrack .og-slot')||el.closest('#ogPile')); };
    root.addEventListener('pointerdown',e=>{ const c=e.target.closest('.og-card'); if(!c||!root.contains(c)||e.button>0) return;
      drag={k:+c.dataset.k,el:c,x0:e.clientX,y0:e.clientY,ghost:null,over:null}; try { c.setPointerCapture(e.pointerId); } catch(err){} });
    root.addEventListener('pointermove',e=>{ if(!drag) return;
      if(!drag.ghost){ if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6) return; const r=drag.el.getBoundingClientRect(); const g=drag.el.cloneNode(true); g.classList.add('og-ghost'); g.style.width=r.width+'px'; g.style.left=r.left+'px'; g.style.top=r.top+'px'; document.body.appendChild(g); drag.ghost=g; drag.ox=drag.x0-r.left; drag.oy=drag.y0-r.top; drag.el.classList.add('dragging'); }
      drag.ghost.style.left=(e.clientX-drag.ox)+'px'; drag.ghost.style.top=(e.clientY-drag.oy)+'px';
      const t=targetAt(e.clientX,e.clientY); if(t!==drag.over){ if(drag.over) drag.over.classList.remove('target'); if(t) t.classList.add('target'); drag.over=t; } });
    const endDrag=e=>{ if(!drag) return; const d=drag; drag=null;
      if(!d.ghost){ sel = sel===d.k ? null : d.k; draw(); return; }
      d.ghost.remove(); d.el.classList.remove('dragging'); if(d.over) d.over.classList.remove('target');
      const t=e.type==='pointerup'?targetAt(e.clientX,e.clientY):null;
      if(t) moveTo(d.k, t.id==='ogPile'?'pile':+t.dataset.s); else draw(); };
    root.addEventListener('pointerup',endDrag); root.addEventListener('pointercancel',endDrag);
    // Tap a slot or the deck to drop the selected card there
    root.addEventListener('click',e=>{ if(sel===null||e.target.closest('.og-card')) return; const t=e.target.closest('#ogTrack .og-slot')||e.target.closest('#ogPile'); if(t) moveTo(sel, t.id==='ogPile'?'pile':+t.dataset.s); });
    // Keyboard: Enter places a deck card in the first free slot, keys 1-7 send a card to that slot, Delete returns it to the deck
    root.addEventListener('keydown',e=>{ const c=e.target.closest('.og-card'); if(!c||!root.contains(c)) return; const k=+c.dataset.k;
      if(e.key>='1'&&e.key<='7'){ e.preventDefault(); moveTo(k,+e.key-1); }
      else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); const free=slots.indexOf(null); if(where(k).pile!==undefined&&free>=0) moveTo(k,free); else { sel=sel===k?null:k; draw(); } }
      else if(e.key==='Backspace'||e.key==='Delete'){ e.preventDefault(); moveTo(k,'pile'); }
      else return;
      const f=$(`.og-card[data-k="${k}"]`,root); if(f) f.focus(); });
    $('#ordShuffle',root).onclick=shuffle;
    $('#ordReveal',root).onclick=()=>{ slots=S.map((_,i)=>i); pile=[]; sel=null; checked=true; draw(); msg.innerHTML='<span class="pill info">Here is the correct order.</span>'; };
    $('#ordCheck',root).onclick=()=>{ const placed=slots.filter(k=>k!==null).length; if(placed<S.length){ msg.innerHTML=`<span class="pill info">Place all ${S.length} cards first (${placed} placed).</span>`; return; }
      checked=true; draw(); const ok=slots.filter((k,i)=>k===i).length;
      msg.innerHTML= ok===S.length?'<span class="pill good">Perfect order! Each card now shows the formal step name.</span>':`<span class="pill bad">${ok} of ${S.length} in the right place.</span> Move the red cards and check again.`; };
    shuffle();
  },
  quiz:[
    {q:'In the 7-step procedure, the nickname "Know better your enemy" refers to:', o:['Data collection','Data exploration','Model deployment','Problem characterization'], a:1, e:'Data exploration (univariate and multivariate analysis) is about understanding the data before modeling.'},
    {q:'Which step is nicknamed "Massage the data"?', o:['Data preparation','Model evaluation','Model development','Data collection'], a:0, e:'Data preparation covers cleansing, labeling, normalization, balancing, and similar tasks.'},
    {q:'"Evaluate the confession" happens right after which step?', o:['Collect data','Deploy the model','Torture your data until it confesses (model development)','Characterize the problem'], a:2, e:'You first develop the model (step 5) and then evaluate and optimize it (step 6).'}
  ]
});

LAB.add({
  id:'problem', group:'The 7-Step Procedure', title:'Step 1: Problem Characterization', slides:'15-24', keywords:'requirements p-diagram edge cases unknowns',
  html: R`
<p>Right problems lead to opportunities. Data-driven ML is appropriate only when <b>three requirements</b> hold:</p>
<ol><li><b>A pattern exists.</b> Without discernible regularities, data is unsuitable for most ML approaches and is the hardest to predict and interpret.</li>
<li><b>The pattern cannot be pinned down mathematically</b> with attainable, tractable models. Example: pedestrians usually follow a linear motion model (a Kalman filter works), but jaywalkers and human behavior are too complex to model (JAAD, Joint Attention for Autonomous Driving dataset).</li>
<li><b>Data is available.</b> The intelligence is in the data: garbage in, garbage out.</li></ol>
${panel('Requirements checker', `<p class="small">For each scenario, tick the requirements you think hold, then check.</p><div id="reqGame"></div>`)}
${panel('What if data is lacking?', `<div id="lackX"></div>`)}
<h2>Problem definition: the P-diagram</h2>
<p>A parameter diagram (P-diagram) organizes a problem around the system being modeled. Click each block of the tire treadwear prediction example.</p>
${panel('P-diagram: tire treadwear prediction model', `<div class="grid2"><div id="pdSvg"></div><div id="pdTxt" class="card" style="margin:0"></div></div>`)}
<h2>Adversarial and edge cases</h2>
<p>Be aware of uncertainty. Combining domain knowledge (what we have) with meta-knowledge (what we know about our state) gives four quadrants.</p>
${panel('Knowns and unknowns', `<div class="grid2" id="kuGrid"></div><div id="kuTxt" class="callout" style="margin-top:12px">Click a quadrant.</div>`)}
<div class="card"><b>Edge cases from autonomous driving</b> (from the slides): construction zones; sudden temporary traffic shifts; banners with life-size human pictures or inflatable air puppets; a Tesla nearly hitting a moving train in fog; human guidance overriding traffic lights and signs; confusing roundabouts; traffic lights swinging in the wind; slippery snow with no lane markings or visible shoulder; a Tesla confusing the moon for a traffic light; sandstorms; a pedestrian wearing clothes the same color as a pole; a plastic bag filled with air; cohabitation with diverse transportation; unusual road users; and the Uber self-driving crash in Tempe, Arizona.</div>
<div class="grid2"><div class="mini"><h4>Target performance</h4><p>Accuracy; false alarm rate and false negative rate; memory footprint; inference time.</p></div><div class="mini"><h4>Deployment</h4><p>Edge, fog, or cloud. Decide early because it constrains model size and latency.</p></div></div>`,
  init(root){
    const sc=[['Predict the next reading of pure electrical (thermal) noise from a disconnected sensor.',[0,1,1],'No pattern exists: the readings are random, so ML cannot help however much data you collect.'],

      ['Predict whether a pedestrian will jaywalk, using thousands of labeled dashcam clips.',[1,1,1],'All three hold. This is a good ML problem.'],
      ['Predict a brand-new failure mode that has never been observed or recorded.',[1,1,0],'No data is available yet. Consider simulation, augmentation, few-shot, or transfer learning.']];
