    $$('#reqGame .mini',root).forEach(m=>{ $('.btn',m).onclick=()=>{ const s=sc[+m.dataset.i]; const v=$$('input',m).map(x=>x.checked?1:0); const ok=v.every((x,j)=>x===s[1][j]);
      $('.fb',m).innerHTML=(ok?'<span class="pill good">Correct</span> ':'<span class="pill bad">Not quite</span> ')+s[2]; }; });
    stepExplorer(root,'#lackX',[
      {t:'Collect data',d:'Collect more real data. The most reliable fix, but often expensive.'},
      {t:'Data augmentation',d:'Increase data diversity without collecting new data: flips, crops, rotations, color jitter, noise. CNNs can learn invariance to translation, viewpoint, size, or illumination this way.'},
      {t:'Simulation',d:'High-fidelity simulations and augmented reality (for example the CARLA driving simulator) produce labeled synthetic data, including rare edge cases.'},
      {t:'One-shot / few-shot',d:'Humans learn from a few examples. One-shot learning learns a similarity (or difference) function between two examples so that one or a few labeled images per class suffice.'},
      {t:'Unsupervised learning',d:'Clustering and dimensionality reduction (PCA/ICA, t-SNE) on unlabeled data. Choosing a good representation can be harder than labeling the data.'},
      {t:'Transfer learning',d:'Model S is trained on a large source dataset; its knowledge is transferred to model T, which is fine-tuned on a small target dataset. Useful when domains are similar but not identical.'},
      {t:'Active learning',d:'The model queries a trained annotator (human or machine) to label the most informative samples from an unlabeled pool, then retrains on the growing labeled set.'}]);
    const blocks={sig:['Signals','Inputs that drive the system in use: vehicle speed, acceleration, steering wheel angle, normal and tractive forces.'],
      ctl:['Control factors','Design choices you can set: tire type, production date, cords, section side tread, rolling resistance, wheel diameter, load, duration of usage.'],
      noi:['Noise factors','Uncontrollable influences: vehicle maneuvers, tire temperature and pressure, road conditions, weather conditions.'],
      res:['Response','What we predict: estimated tread depth, tire deformation, or projected lifespan.'],
      err:['Error states','Ways the prediction can fail: false alarms and false negatives.']};
    $('#pdSvg',root).innerHTML=`<svg viewBox="0 0 360 260" width="100%" style="max-width:420px">
      <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker></defs>
      <rect x="120" y="95" width="120" height="70" rx="10" fill="var(--primary)"/><text x="180" y="125" text-anchor="middle" fill="var(--primary-ink)" font-size="12" font-weight="700">Treadwear</text><text x="180" y="142" text-anchor="middle" fill="var(--primary-ink)" font-size="12" font-weight="700">prediction model</text>
      ${[['sig',10,105,'Signals'],['res',265,85,'Response'],['err',265,140,'Error states'],['ctl',120,10,'Control factors'],['noi',120,210,'Noise factors']].map(([k,x,y,t])=>`<g class="clickable" data-k="${k}" style="cursor:pointer"><rect x="${x}" y="${y}" width="${k==='ctl'||k==='noi'?120:88}" height="38" rx="8" fill="var(--surface2)" stroke="var(--border)"/><text x="${x+(k==='ctl'||k==='noi'?60:44)}" y="${y+23}" text-anchor="middle" font-size="12" fill="var(--text)">${t}</text></g>`).join('')}
      <line x1="98" y1="124" x2="118" y2="124" stroke="var(--muted)" marker-end="url(#ar)"/><line x1="240" y1="110" x2="263" y2="104" stroke="var(--muted)" marker-end="url(#ar)"/><line x1="240" y1="148" x2="263" y2="158" stroke="var(--muted)" marker-end="url(#ar)"/>
      <line x1="180" y1="48" x2="180" y2="93" stroke="var(--muted)" marker-end="url(#ar)"/><line x1="180" y1="208" x2="180" y2="167" stroke="var(--muted)" marker-end="url(#ar)"/></svg>`;
    const show=k=>{ $('#pdTxt',root).innerHTML=`<h4>${blocks[k][0]}</h4><p>${blocks[k][1]}</p>`; $$('#pdSvg g',root).forEach(g=>$('rect',g).setAttribute('stroke', g.dataset.k===k?'var(--primary)':'var(--border)')); };
    $$('#pdSvg g',root).forEach(g=>g.addEventListener('click',()=>show(g.dataset.k))); show('ctl');
    const ku=[['Known knowns','Information that we have and know that we have.','Documented failure modes in your training data.'],['Known unknowns','Information that we do not have and know that we lack.','You know you have no data for sandstorms, so you plan to collect or simulate it.'],
      ['Unknown knowns','Information that we have but do not know we have.','A sensor channel already logged that predicts failure, but nobody has analyzed it.'],['Unknown unknowns','Relevant information that we do not know we lack.','A plastic bag full of air or the moon mistaken for a traffic light: surprises you never thought to test.']];
    $('#kuGrid',root).innerHTML=ku.map((k,i)=>`<div class="mini clickable" data-i="${i}"><h4>${k[0]}</h4><p class="small muted">${i<2?'Meta-knowledge: known':'Meta-knowledge: unknown'} · Domain: ${i%2?'unknown':'known'}</p></div>`).join('');
    $$('#kuGrid .mini',root).forEach(m=>m.onclick=()=>{ $$('#kuGrid .mini',root).forEach(x=>x.classList.remove('selected')); m.classList.add('selected'); const k=ku[+m.dataset.i]; $('#kuTxt',root).innerHTML=`<b>${k[0]}:</b> ${k[1]} <br><span class="muted">Example: ${k[2]}</span>`; });
  },
  quiz:[
    {q:'Which is NOT one of the three requirements for applying data-driven ML?', o:['A pattern exists','The pattern cannot be pinned down with a tractable mathematical model','Data is available','A deep neural network is available'], a:3, e:'The three requirements concern the problem and the data, not a specific model family.'},
    {q:'In the tire treadwear P-diagram, "road conditions and weather conditions" are:', o:['Control factors','Signals','Noise factors','Responses'], a:2, e:'They influence the system but cannot be controlled, so they are noise factors.'},
    {q:'A relevant risk you have not even thought to test for is an:', o:['Known known','Known unknown','Unknown known','Unknown unknown'], a:3, e:'Unknown unknowns are relevant information that we do not know we lack, typical of surprising edge cases.'}
  ]
});

LAB.add({
  id:'datacollection', group:'The 7-Step Procedure', title:'Step 2: Data Collection', slides:'26-28', keywords:'design of experiments doe factorial fractional',
  html: R`
<p>How do you set up an experiment? <b>Design of Experiments (DOE)</b> plans which combinations of factor levels to run. Breadth (how many factors) and depth (how many levels) both matter.</p>
${panel('DOE run calculator', R`
<div class="controls"><div class="ctl"><label>Factors $k$ <output id="k_v"></output></label><input type="range" id="k" min="3" max="10" value="4"></div>
<div class="ctl"><label>Levels per factor $L$</label><div class="seg" id="lvSeg"><button class="on" data-v="2">2</button><button data-v="3">3</button></div></div>
<div class="ctl"><label>Fraction exponent $p$ <output id="p_v"></output></label><input type="range" id="p" min="0" max="3" value="1"></div></div>
<div class="grid3"><div class="mini"><h4>Full factorial</h4><div class="big" id="fullN"></div><p class="small muted" id="fullF"></p></div><div class="mini"><h4>Fractional factorial</h4><div class="big" id="fracN"></div><p class="small muted" id="fracF"></p></div><div class="mini"><h4>Savings</h4><div class="big" id="save"></div><p class="small muted">fewer runs</p></div></div>
<h4 style="margin-top:14px" id="dmTitle">Design matrix</h4><div id="dm" class="tblwrap"></div>`)}
<h3>Factors with different numbers of levels</h3>
<p>Real experiments rarely give every factor the same number of levels. A <b>mixed-level full factorial</b> needs one run for every combination, so the run count is the <b>product</b> of the level counts: $N = L_1 \times L_2 \times \cdots \times L_k$. For example, two 3-level factors, two 2-level factors, and one 4-level factor need $3 \cdot 3 \cdot 2 \cdot 2 \cdot 4 = 144$ runs.</p>
${panel('Mixed-level DOE planner', `<div class="controls"><div class="ctl"><label>Example</label><div class="seg" id="mxPre"><button class="on" data-v="motor">${ico('cog')} Motor test rig</button><button data-v="pump">${ico('droplets')} Pump trial</button><button data-v="blank">${ico('plus')} Start empty</button></div></div></div>
<div id="mxFactors"></div><div class="btnrow" style="margin:6px 0 12px"><button class="btn ghost sm" id="mxAdd">${ico('plus')} Add factor</button><span class="small muted">Up to 7 factors, 2 to 5 levels each.</span></div>
<div class="controls"><div class="ctl"><label>Replicates (repeat each run) <output id="mxRep_v"></output></label><input type="range" id="mxRep" min="1" max="5" value="1"></div><div class="ctl"><label>Minutes per run <output id="mxMin_v"></output></label><input type="range" id="mxMin" min="5" max="240" step="5" value="30"></div><div class="ctl"><label>Design</label><div class="seg" id="mxDes"><button class="on" data-v="full">Full factorial</button><button data-v="pair">Pairwise screening</button></div></div></div>
<div class="grid3"><div class="mini"><h4>${ico('grid-3x3','h4ico')}Full factorial</h4><div class="big" id="mxFull"></div><p class="small muted" id="mxFullF"></p></div><div class="mini"><h4>${ico('filter','h4ico')}Pairwise screening</h4><div class="big" id="mxPair"></div><p class="small muted" id="mxPairF"></p></div><div class="mini"><h4>${ico('clock','h4ico')}Test time (selected design)</h4><div class="big" id="mxTime"></div><p class="small muted" id="mxTimeF"></p></div></div>
<div class="callout" id="mxMsg" style="margin-top:10px"></div>
<h4 style="margin:12px 0 4px" id="mxTitle"></h4><div id="mxDm" class="tblwrap" style="max-height:360px;overflow:auto"></div>`)}
<p class="small">A <b>pairwise (all-pairs) screening design</b> guarantees that every combination of levels for every <i>pair</i> of factors appears at least once, so all main effects and two-factor combinations are exercised with far fewer runs. Higher-order interactions are not covered. Another standard option for mixed levels is an <b>orthogonal array</b>, such as the Taguchi $L_{18}$ array, which studies one 2-level factor and up to seven 3-level factors in only 18 balanced runs.</p>
<h3>Full versus fractional factorial</h3>
${table(['','Full factorial','Fractional factorial'],[['<b>Pros</b>','All possible combinations are covered. Analysis is straightforward because there is no aliasing.','Less memory and effort. Less time. Runs can be added to eliminate confounding.'],['<b>Cons</b>','Cost of the experiment grows quickly as the number of factors increases.','Analysis of higher-order interactions can be complex. Confounding (aliasing) can mask factor and interaction effects.']])}
<p class="callout key">A regular two-level fractional design $2^{k-p}$ builds the extra factors from products of the base factors (for example $D = ABC$). The price is that some effects become aliased: you cannot tell $D$ apart from the $ABC$ interaction. Three-level fractional designs ($3^{k-p}$) follow the same idea.</p>`,
  init(root){
    let L=2;
    const upd=()=>{ const k=+$('#k',root).value; const pEl=$('#p',root); pEl.max=k===3?1:Math.min(k-3,4); if(+pEl.value>+pEl.max) pEl.value=pEl.max; const p=+pEl.value; $('#p_v',root).textContent=p;
      const full=L**k, frac=L**(k-p); $('#fullN',root).textContent=full.toLocaleString(); $('#fullF',root).innerHTML=`$${L}^{${k}}$ runs`; $('#fracN',root).textContent=frac.toLocaleString(); $('#fracF',root).innerHTML=`$${L}^{${k}-${p}}$ runs`; $('#save',root).textContent=(100*(1-frac/full)).toFixed(0)+'%';
      const letters='ABCDEFGHIJ';
      if(L===2 && k<=5){ const base=k-p; const rows=[]; for(let r=0;r<2**base;r++){ const row=[]; for(let j=0;j<base;j++) row.push(((r>>(base-1-j))&1)?1:-1);
          const gens=[]; for(let g=0;g<p;g++){ // generator: product of all base factors except one (cycled)
            let prod=1; for(let j=0;j<base;j++) if(j!==g%base || base<3) prod*=row[j]; gens.push(prod);} rows.push(row.concat(gens)); }
        const hdr=letters.slice(0,k).split('').map((c,j)=> j<base?c: c+' = '+letters.slice(0,base).split('').filter((_,q)=> base<3 || q!==(j-base)%base).join(''));
        $('#dmTitle',root).textContent=`Design matrix (${rows.length} runs, -1 = low, +1 = high)`;
        $('#dm',root).innerHTML=`<table class="tbl"><thead><tr><th>Run</th>${hdr.map(h=>`<th class="c">${h}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td>${r.map(v=>`<td class="c ${v>0?'good':'bad'}">${v>0?'+1':'-1'}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      } else { $('#dmTitle',root).textContent='Design matrix'; $('#dm',root).innerHTML='<p class="small muted">Shown for two-level designs with up to 5 factors.</p>'; }
      typeset(root); };
    bindRange(root,'k',upd); bindRange(root,'p',upd); segmented(root,'#lvSeg',v=>{L=+v;upd();}); upd();
    { // Mixed-level DOE planner
      const PRE={
        motor:[['Load',['Low','Medium','High']],['Speed (RPM)',['1200','1500','1800']],['Ambient temp.',['20 °C','40 °C']],['Lubricant',['Grease A','Grease B']],['Bearing brand',['B1','B2','B3','B4']]],
        pump:[['Flow rate',['Low','Nominal','High']],['Inlet pressure',['1 bar','2 bar']],['Impeller',['Open','Closed']],['Fluid',['Water','Glycol','Oil']]],
        blank:[['Factor A',['L1','L2']],['Factor B',['L1','L2','L3']]]
      };
      let F=[], des='full';
      const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
      const lvNames=(f,n)=>Array.from({length:n},(_,q)=>f.names[q]||('L'+(q+1)));
      const pairwise=Ls=>{ const n=Ls.length; if(n<2) return Ls.length?Array.from({length:Ls[0]},(_,a)=>[a]):[];
        const key=(i,a,j,b)=>i+':'+a+'|'+j+':'+b; const unc=new Set();
        for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) for(let a=0;a<Ls[i];a++) for(let b=0;b<Ls[j];b++) unc.add(key(i,a,j,b));
        const rng=seeded(11), rows=[];
        const gain=(row,i,v)=>{ let g=0; for(let j=0;j<n;j++){ if(j===i||row[j]<0) continue; const k=i<j?key(i,v,j,row[j]):key(j,row[j],i,v); if(unc.has(k)) g++; } return g; };
        while(unc.size && rows.length<500){ let best=null, bestG=-1; const first=[...unc][0].split('|').map(t=>t.split(':').map(Number));
          for(let t=0;t<30;t++){ const row=Array(n).fill(-1); row[first[0][0]]=first[0][1]; row[first[1][0]]=first[1][1];
            const order=Array.from({length:n},(_,q)=>q).filter(q=>row[q]<0).sort(()=>rng()-.5);
            order.forEach(i=>{ let bv=0,bg=-1; for(let v=0;v<Ls[i];v++){ const g=gain(row,i,v)+rng()*0.01; if(g>bg){bg=g;bv=v;} } row[i]=bv; });
            let g=0; for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) if(unc.has(key(i,row[i],j,row[j]))) g++;
            if(g>bestG){ bestG=g; best=row; } }
          for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) unc.delete(key(i,best[i],j,best[j])); rows.push(best); }
        return rows; };
      const fullRows=Ls=>{ let rows=[[]]; Ls.forEach(l=>{ const nx=[]; rows.forEach(r=>{ for(let v=0;v<l;v++) nx.push(r.concat([v])); }); rows=nx; }); return rows; };
      const drawFactors=()=>{ $('#mxFactors',root).innerHTML=F.map((f,i)=>`<div class="mx-row"><span class="mx-badge">${String.fromCharCode(65+i)}</span><input class="mx-name" data-i="${i}" value="${esc(f.name)}" aria-label="Factor name"><label class="small">Levels <select class="mx-lv" data-i="${i}">${[2,3,4,5].map(n=>`<option ${n===f.L?'selected':''}>${n}</option>`).join('')}</select></label><span class="mx-levels">${lvNames(f,f.L).map((t,q)=>`<span class="mx-chip l${q}">${esc(t)}</span>`).join('')}</span><button class="btn ghost sm mx-del" data-i="${i}" ${F.length<=2?'disabled':''} aria-label="Remove factor">${ico('x')}</button></div>`).join('');
        $$('.mx-name',root).forEach(e=>e.oninput=()=>{ F[+e.dataset.i].name=e.value; calc(); });
        $$('.mx-lv',root).forEach(e=>e.onchange=()=>{ F[+e.dataset.i].L=+e.value; drawFactors(); calc(); });
        $$('.mx-del',root).forEach(e=>e.onclick=()=>{ F.splice(+e.dataset.i,1); drawFactors(); calc(); });
        $('#mxAdd',root).disabled=F.length>=7; refreshIcons($('#mxFactors',root)); };
      const calc=()=>{ const Ls=F.map(f=>f.L), rep=+$('#mxRep',root).value, mins=+$('#mxMin',root).value;
        const full=Ls.reduce((a,b)=>a*b,1), pr=pairwise(Ls), lb=Ls.length>1?[...Ls].sort((a,b)=>b-a).slice(0,2).reduce((a,b)=>a*b,1):Ls[0];
        const cnt={}; Ls.forEach(l=>cnt[l]=(cnt[l]||0)+1);
        $('#mxFull',root).textContent=full.toLocaleString(); $('#mxFullF',root).innerHTML=`$${Ls.join(' \\times ')}$ = $${Object.keys(cnt).sort().map(l=>cnt[l]>1?`${l}^{${cnt[l]}}`:l).join(' \\cdot ')}$ runs`;
        $('#mxPair',root).textContent=pr.length.toLocaleString(); $('#mxPairF',root).textContent=`${(100*(1-pr.length/full)).toFixed(0)}% fewer runs (at least ${lb} are needed: the two largest level counts multiplied)`;
        const runs=(des==='full'?full:pr.length)*rep, hrs=runs*mins/60;
        $('#mxTime',root).textContent=hrs<48?`${hrs.toFixed(1)} h`:`${(hrs/24).toFixed(1)} days`; $('#mxTimeF',root).textContent=`${runs.toLocaleString()} runs × ${mins} min${rep>1?` (${rep} replicates)`:''}, running around the clock`;
        $('#mxMsg',root).innerHTML= des==='full' ? `<b>Full factorial:</b> every one of the ${full.toLocaleString()} combinations is tested, so all main effects and all interactions can be estimated. Adding a 3-level factor multiplies the work by 3.` : `<b>Pairwise screening:</b> ${pr.length} runs still cover every pair of levels for every pair of factors. Use it to screen which factors matter, then run a full factorial on the few important ones.`;
        const rows=des==='full'?fullRows(Ls):pr, show=rows.slice(0,60);
        $('#mxTitle',root).textContent=`Design matrix: ${des==='full'?'full factorial':'pairwise screening'} (${rows.length} runs${rows.length>60?', first 60 shown':''})`;
        $('#mxDm',root).innerHTML=`<table class="tbl"><thead><tr><th>Run</th>${F.map((f,i)=>`<th>${String.fromCharCode(65+i)}: ${esc(f.name)}</th>`).join('')}</tr></thead><tbody>${show.map((r,k)=>`<tr><td>${k+1}</td>${r.map((v,i)=>`<td><span class="mx-chip l${v}">${esc(lvNames(F[i],F[i].L)[v])}</span></td>`).join('')}</tr>`).join('')}</tbody></table>`;
        typeset($('#mxFullF',root).closest('.panel')); };
      const load=v=>{ F=PRE[v].map(([name,names])=>({name,L:names.length,names})); drawFactors(); calc(); };
      segmented(root,'#mxPre',load); segmented(root,'#mxDes',v=>{ des=v; calc(); });
      ['mxRep','mxMin'].forEach(id=>bindRange(root,id,calc));
      $('#mxAdd',root).onclick=()=>{ if(F.length<7){ F.push({name:'Factor '+String.fromCharCode(65+F.length),L:2,names:[]}); drawFactors(); calc(); } };
      load('motor');
    }
  },
  quiz:[
    {q:'An experiment has 6 factors at 2 levels each. How many runs does a full factorial design need?', o:['12','36','64','128'], a:2, e:'$2^6 = 64$ runs.'},
    {q:'What is the main drawback of a fractional factorial design?', o:['It always needs more runs than a full factorial','Confounding (aliasing) can mask factor and interaction effects','It cannot be used with 2-level factors','There is no way to add runs later'], a:1, e:'Running only a fraction of combinations makes some effects indistinguishable (aliased).'},
    {q:'Why is analysis of a full factorial design straightforward?', o:['It uses random sampling','There is no aliasing between effects','It needs no replication','It only studies main effects'], a:1, e:'Every combination is run, so all main effects and interactions can be estimated separately.'}
  ]
});

LAB.add({
  id:'dataprep', group:'The 7-Step Procedure', title:'Step 3: Data Preparation', slides:'30-31', keywords:'cleaning missing normalization split train dev test',
  html: R`
<p><b>Massage your data.</b> Data preparation may include data cleansing, labeling, dealing with missing data, dealing with inconsistent data, normalization, data balancing, data fusion, data aggregation, and data flattening.</p>
${panel('Clean a raw sensor log', `<p class="small">Apply the preparation steps one at a time and watch the table change.</p><div class="btnrow"><button class="btn sm" data-a="impute">1. Impute missing values</button><button class="btn sm" data-a="outlier">2. Remove outliers</button><button class="btn sm" data-a="norm">3. Min-max normalize</button><button class="btn sm" data-a="label">4. Add labels</button><button class="btn ghost sm" data-a="reset">Reset</button></div><div id="cleanTbl" class="tblwrap"></div><p class="small muted" id="cleanMsg"></p>`)}
${panel('Split the collected data', R`
<div class="controls"><div class="ctl"><label>Samples $N$</label><input type="number" id="nS" value="10000" min="10" step="10"></div>
<div class="ctl"><label>Training % <output id="tr_v"></output></label><input type="range" id="tr" min="40" max="90" value="60"></div>
<div class="ctl"><label>Dev % <output id="dv_v"></output></label><input type="range" id="dv" min="5" max="40" value="20"></div></div>
<div id="splitBar" style="display:flex;height:38px;border-radius:10px;overflow:hidden;font-size:.82rem;font-weight:600"></div>
<div class="grid3" style="margin-top:12px" id="splitTxt"></div>`)}`,
  init(root){
    const raw=[['08:00',2.1,68,null,'OK'],['09:00',2.4,70,45,'OK'],['10:00',2.2,null,46,'ok'],['11:00',25.0,71,47,'OK'],['12:00',2.6,72,49,'OK'],['13:00',8.9,103,76,'FAIL'],['14:00',9.4,106,78,'Fail'],['15:00',9.1,null,77,'FAIL']];
    let d, cols=['Hour','Vibration','Temp','Acoustic','Log status'], msg='';
    const reset=()=>{ d=raw.map(r=>r.slice()); cols=['Hour','Vibration','Temp','Acoustic','Log status']; msg='Raw log: missing values, an impossible vibration spike (25 mm/s), and inconsistent status text.'; draw(); };
    const draw=()=>{ $('#cleanTbl',root).innerHTML=`<table class="tbl"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${d.map(r=>`<tr>${r.map(v=>`<td class="${v===null?'bad':''}">${v===null?'missing':typeof v==='number'?(+v.toFixed(3)):v}</td>`).join('')}</tr>`).join('')}</tbody></table>`; $('#cleanMsg',root).textContent=msg; };
    const colIdx=[1,2,3];
    $$('[data-a]',root).forEach(b=>b.onclick=()=>{ const a=b.dataset.a;
      if(a==='reset') return reset();
      if(a==='impute'){ colIdx.forEach(j=>{ const vals=d.map(r=>r[j]).filter(v=>v!==null&&typeof v==='number'); const m=vals.slice().sort((x,y)=>x-y)[Math.floor(vals.length/2)]; d.forEach(r=>{ if(r[j]===null) r[j]=m; }); }); msg='Missing values replaced by the column median (robust to the spike).'; }
      if(a==='outlier'){ const v=d.map(r=>r[1]).slice().sort((x,y)=>x-y); const q1=v[2], q3=v[5], iqr=q3-q1; const before=d.length; d=d.filter(r=> typeof r[1]!=='number' || (r[1]>=q1-1.5*iqr && r[1]<=q3+1.5*iqr)); msg=`Removed ${before-d.length} row(s) outside 1.5 x IQR on vibration (the 25 mm/s spike).`; }
      if(a==='norm'){ colIdx.forEach(j=>{ const v=d.map(r=>r[j]); if(v.some(x=>typeof x!=='number'||x===null)) return; const mn=Math.min(...v), mx=Math.max(...v); d.forEach(r=> r[j]=(r[j]-mn)/(mx-mn||1)); }); msg='Each numeric column rescaled to [0, 1] so no feature dominates by its units.'; }
      if(a==='label'){ if(cols.length===5){ cols=cols.slice(0,4).concat(['failure']); d.forEach(r=> r[4]= /fail/i.test(r[4])?1:0 ); } msg='Inconsistent status text mapped to a clean label: failure = 1, no failure = 0.'; }
      draw(); });
    reset();
    const upd=()=>{ const tr=+$('#tr',root).value; let dv=+$('#dv',root).value; if(tr+dv>95){ dv=95-tr; $('#dv',root).value=dv; $('#dv_v',root).textContent=dv; } const te=100-tr-dv; const N=Math.max(10,+$('#nS',root).value||0);
      const seg=[['Training',tr,'var(--c1)','to train the learning algorithm'],['Dev',dv,'var(--c2)','to tune parameters, select features, and make other decisions'],['Test',te,'var(--c3)','to evaluate the performance of the algorithm']];
      $('#splitBar',root).innerHTML=seg.map(s=>`<div style="width:${s[1]}%;background:${s[2]};color:#fff;display:grid;place-items:center">${s[1]}%</div>`).join('');
      $('#splitTxt',root).innerHTML=seg.map(s=>`<div class="mini"><h4>${s[0]} set</h4><div class="big">${Math.round(N*s[1]/100).toLocaleString()}</div><p class="small muted">${s[3]}</p></div>`).join(''); };
    bindRange(root,'tr',upd); bindRange(root,'dv',upd); $('#nS',root).oninput=upd; upd();
  },
  quiz:[
    {q:'In the slides\' default split, what is the development (dev) set used for?', o:['Training the weights','Tuning parameters, selecting features, and making other decisions about the algorithm','Reporting final, unbiased performance','Data augmentation'], a:1, e:'The dev set (hold-out cross-validation set, 20%) guides design decisions. The test set (20%) gives the final evaluation.'},
    {q:'Why normalize features such as temperature (°C) and vibration (mm/s)?', o:['To remove missing values','So no feature dominates just because of its units or scale','To label the data','To increase the dataset size'], a:1, e:'Scaling puts features on comparable ranges, which matters especially for distance-based and gradient-based methods.'},
    {q:'Mapping status strings "FAIL", "Fail", and "OK" to 1 and 0 is an example of:', o:['Dealing with inconsistent data and labeling','Data fusion','Data flattening','Data aggregation'], a:0, e:'Unifying inconsistent text and creating a numeric target are cleansing and labeling steps.'}
  ]
});

LAB.add({
  id:'exploration', group:'The 7-Step Procedure', title:'Step 4: Data Exploration', slides:'33', keywords:'eda separability linearity monotonicity histogram scatter',
  html: R`
<p><b>Know your enemy.</b> Univariate and multivariate analyses generate insights about <b>separability</b> (can classes be told apart?), <b>linearity</b> (can a straight boundary or line do it?), and <b>monotonicity</b> (does the target consistently rise or fall with a feature?). These insights tell you which models are worth trying.</p>
${panel('Explore a two-feature dataset', `<div class="controls"><div class="ctl"><label>Dataset</label><div class="seg" id="exSeg"><button class="on" data-v="lin">Linearly separable</button><button data-v="ovl">Overlapping</button><button data-v="ring">Nonlinear (ring)</button><button data-v="mono">Monotonic trend</button></div></div><div class="ctl"><label>Class spread <output id="sp_v"></output></label><input type="range" id="sp" min="0.3" max="2.5" step="0.1" value="1"></div></div>
<div class="grid2"><canvas class="plot" id="exScatter"></canvas><canvas class="plot" id="exHist"></canvas></div><div class="readout" id="exStats" style="margin-top:10px"></div>`)}`,
  init(root){
    let kind='lin';
    const draw=()=>{ const sp=+$('#sp',root).value; const rng=seeded(11); const A=[],B=[];
      for(let i=0;i<70;i++){
        if(kind==='lin'){ A.push([3+randn(rng)*sp*.7,3+randn(rng)*sp*.7]); B.push([7+randn(rng)*sp*.7,7+randn(rng)*sp*.7]); }
        if(kind==='ovl'){ A.push([4.3+randn(rng)*sp*1.2,4.6+randn(rng)*sp*1.2]); B.push([5.7+randn(rng)*sp*1.2,5.4+randn(rng)*sp*1.2]); }
        if(kind==='ring'){ const t=rng()*6.283, r=1.2*rng()*sp; A.push([5+r*Math.cos(t),5+r*Math.sin(t)]); const r2=3.3+randn(rng)*.3*sp; B.push([5+r2*Math.cos(t+1),5+r2*Math.sin(t+1)]); }
        if(kind==='mono'){ const x=rng()*10; A.push([x, 1+.8*x+randn(rng)*sp*.6]); }
      }
      const c1=cssVar('--c1'), c2=cssVar('--c4');
      const P=Plot($('#exScatter',root),{xmin:0,xmax:10,ymin:0,ymax:10,height:280}); P.axes({xlabel:'Feature x1',ylabel:kind==='mono'?'Target y':'Feature x2'});
      A.forEach(p=>P.dot(p[0],p[1],alpha(c1,.75),4)); B.forEach(p=>P.dot(p[0],p[1],alpha(c2,.75),4,null,'square'));
      // histogram of x1
      const H=Plot($('#exHist',root),{xmin:0,xmax:10,ymin:0,ymax:kind==='mono'?20:30,height:280}); H.axes({xlabel:'x1 (univariate view)',ylabel:'Count'});
      const bins=20, bw=10/bins; const hist=a=>{ const h=new Array(bins).fill(0); a.forEach(p=>{ const b=clamp(Math.floor(p[0]/bw),0,bins-1); h[b]++; }); return h; };
      [[A,c1],[B,c2]].forEach(([arr,c])=>{ if(!arr.length) return; hist(arr).forEach((v,i)=>{ H.ctx.fillStyle=alpha(c,.45); const x0=H.x(i*bw), x1=H.x((i+1)*bw); H.ctx.fillRect(x0+1,H.y(v),x1-x0-2,H.y(0)-H.y(v)); }); });
      let txt='';
      if(kind==='mono'){ const xs=A.map(p=>p[0]), ys=A.map(p=>p[1]); const mx=mean(xs), my=mean(ys); const r=sum(xs.map((x,i)=>(x-mx)*(ys[i]-my)))/Math.sqrt(sum(xs.map(x=>(x-mx)**2))*sum(ys.map(y=>(y-my)**2)));
        txt=`Pearson correlation r = ${r.toFixed(3)}\nInsight: the target rises steadily with x1 (monotonic, roughly linear).\nA linear regression is a sensible first model.`; }
      else { // best linear separation along mean-difference direction
        const mA=[mean(A.map(p=>p[0])),mean(A.map(p=>p[1]))], mB=[mean(B.map(p=>p[0])),mean(B.map(p=>p[1]))]; const w=[mB[0]-mA[0],mB[1]-mA[1]];
        const proj=p=>p[0]*w[0]+p[1]*w[1]; const all=A.map(p=>[proj(p),0]).concat(B.map(p=>[proj(p),1])).sort((a,b)=>a[0]-b[0]); let best=0;
        for(let i=0;i<=all.length;i++){ let ok=0; all.forEach((q,j)=>{ if((j<i&&q[1]===0)||(j>=i&&q[1]===1)) ok++; }); best=Math.max(best,ok, all.length-ok); }
        const acc=best/all.length;
        txt=`Best accuracy of a single straight boundary: ${(100*acc).toFixed(1)}%\n`+(acc>.98?'Insight: classes are linearly separable. Simple linear models will do.':acc>.8?'Insight: classes overlap. Expect some irreducible error; probabilistic models help.':'Insight: no straight line separates the classes. Use a nonlinear model (kernel SVM, tree, k-NN, neural network) or engineer a feature such as the distance from the center.');
        if(kind==='ring') txt+='\nNote the univariate histogram: x1 alone hides the ring structure.'; }
      $('#exStats',root).textContent=txt; };
    segmented(root,'#exSeg',v=>{kind=v;draw();}); bindRange(root,'sp',draw); draw(); onResize(draw);
  },
  quiz:[
    {q:'Your scatter plot shows one class forming a ring around the other. What does this suggest?', o:['The data is linearly separable','A nonlinear model or an engineered feature (such as distance from the center) is needed','The classes are identical','Only univariate analysis is needed'], a:1, e:'No straight line separates concentric classes, so linear models fail without feature engineering.'},
    {q:'Data exploration aims to generate insights about:', o:['Separability, linearity, and monotonicity','Deployment latency','Annotation cost only','GPU selection'], a:0, e:'The slides list these three properties as the goals of univariate and multivariate analysis.'},
    {q:'Why can a univariate histogram be misleading?', o:['It always overstates the mean','Structure that depends on feature combinations (multivariate structure) can be invisible in one feature','Histograms cannot show two classes','Histograms only work for categorical data'], a:1, e:'Classes that differ only jointly (like the ring) can have overlapping single-feature distributions.'}
  ]
});

LAB.add({
  id:'modeldev', group:'The 7-Step Procedure', title:'Step 5: Model Development', slides:'35-37', keywords:'feature extraction learning no free lunch tools',
  html: R`
<p><b>Torture your data until it confesses, using the right tools.</b> A predictive model needs good features. You can hand-craft a feature extractor and feed a separate classifier, or let a deep network learn the features with trainable kernels across its hidden layers.</p>
${panel('Hand-crafted versus learned features', `<div class="seg" id="feSeg"><button class="on" data-v="hand">Feature extractor + classifier</button><button data-v="learn">Trainable feature extractor (deep)</button></div><div class="flow" id="feFlow" style="margin-top:14px"></div><p class="small muted" id="feTxt" style="margin-top:8px"></p>`)}
<div class="card"><b>Use the right tool.</b> The slides show common tooling such as <b>scikit-learn</b> for classical ML and <b>MLflow</b> for experiment tracking, alongside deep learning frameworks (see the CNN implementation section for Keras, PyTorch, and TensorFlow).</div>
<h2>The No Free Lunch theorem</h2>
<p>There is <b>no universally superior ML algorithm</b>. Averaged over all possible problems, every learning algorithm performs the same (D. H. Wolpert, <i>Neural Computation</i>, 1996). An algorithm that excels on one kind of structure pays for it on another.</p>
${panel('No Free Lunch in action (illustrative accuracies)', `<p class="small">Click an algorithm to highlight it. Each wins somewhere and loses somewhere else.</p><div id="nflTbl"></div><div id="nflMsg" class="callout"></div>`)}
<p class="callout src">Alaa Khamis, <i>Optimization Algorithms: AI techniques for design, planning, and control problems</i>, Manning, 2024.</p>`,
  init(root){
    const set=v=>{ const a= v==='hand'?['Input data','Feature extractor<br><small>(hand-crafted)</small>','Feature vector','Classifier','Output']:['Input layer','Hidden layer 1','Hidden layer 2','...','Hidden layer M','Classifier / output layer'];
      $('#feFlow',root).innerHTML=a.map(x=>`<div class="box">${x}</div>`).join('<span class="arr">&#10140;</span>');
      $('#feTxt',root).textContent= v==='hand'?'An expert designs the features (for example vibration RMS, kurtosis, spectral peaks). The classifier only learns the decision rule.':'Each hidden layer acts as a learnable kernel. The network learns the features and the classifier jointly from data.'; };
    segmented(root,'#feSeg',set); set('hand');
    const algs=['Naive Bayes','k-NN','Decision tree','Neural network'], probs=['Text, many independent words','Small, low-dimensional, local clusters','Tabular with axis-aligned rules','Images with spatial structure'];
    const acc=[[92,71,74,60],[70,93,78,68],[73,76,94,63],[68,72,77,95]];
    let sel=-1;
    const draw=()=>{ $('#nflTbl',root).innerHTML=`<div class="tblwrap"><table class="tbl"><thead><tr><th>Algorithm</th>${probs.map(p=>`<th class="c">${p}</th>`).join('')}<th class="c">Average</th></tr></thead><tbody>${algs.map((a,i)=>`<tr class="${i===sel?'hl':''} clickable" data-i="${i}"><td><b>${a}</b></td>${acc[i].map((v,j)=>{ const best=Math.max(...acc.map(r=>r[j])); return `<td class="c ${v===best?'good':''}">${v}%</td>`; }).join('')}<td class="c">${mean(acc[i]).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>`;
      $$('#nflTbl tr[data-i]',root).forEach(tr=>tr.onclick=()=>{ sel=+tr.dataset.i; draw(); const j=acc[sel].indexOf(Math.max(...acc[sel])); $('#nflMsg',root).innerHTML=`<b>${algs[sel]}</b> is best on "${probs[j]}" but its average (${mean(acc[sel]).toFixed(1)}%) is about the same as everyone else's. Choose by matching the algorithm's assumptions to your data.`; }); };
    draw(); $('#nflMsg',root).textContent='Select a row.';
  },
  quiz:[
    {q:'What does the No Free Lunch theorem state?', o:['Deep learning always beats classical methods','No learning algorithm is universally superior across all problems','Free datasets are low quality','Training cost is the same for all models'], a:1, e:'Averaged over all problems, all algorithms perform equally; superiority is problem-specific.'},
    {q:'In a deep network, the hidden layers act as:', o:['A fixed hand-crafted feature extractor','A trainable feature extractor (learnable kernels)','A data cleaning step','A test set'], a:1, e:'Deep learning learns the features and the classifier jointly.'},
    {q:'A practical implication of the No Free Lunch theorem is to:', o:['Always use the most recent algorithm','Try several algorithms and match their assumptions to the data','Never use neural networks','Skip data exploration'], a:1, e:'Because no algorithm dominates, exploration and comparison guide the choice.'}
  ]
});
/* ---- shared numeric helpers ---- */
function erf(x){ const s=Math.sign(x); x=Math.abs(x); const t=1/(1+0.3275911*x); const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x); return s*y; }
const Phi = x => 0.5*(1+erf(x/Math.SQRT2));
function probit(p){ // Acklam inverse normal CDF
  p=clamp(p,1e-9,1-1e-9); const a=[-39.6968302866538,220.946098424521,-275.928510446969,138.357751867269,-30.6647980661472,2.50662827745924], b=[-54.4760987982241,161.585836858041,-155.698979859887,66.8013118877197,-13.2806815528857], c=[-0.00778489400243029,-0.322396458041136,-2.40075827716184,-2.54973253934373,4.37466414146497,2.93816398269878], d=[0.00778469570904146,0.32246712907004,2.445134137143,3.75440866190742];
  const pl=0.02425; let q,r;
  if(p<pl){ q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p>1-pl){ q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q=p-0.5; r=q*q; return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
function solveLin(A,b){ const n=b.length; A=A.map((r,i)=>r.concat([b[i]]));
  for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r; [A[c],A[p]]=[A[p],A[c]];
    for(let r=0;r<n;r++){ if(r===c) continue; const f=A[r][c]/(A[c][c]||1e-12); for(let k=c;k<=n;k++) A[r][k]-=f*A[c][k]; } }
  return A.map((r,i)=>r[n]/(r[i]||1e-12)); }
function polyFit(xs,ys,deg,ridge=1e-9){ const n=deg+1; const G=Array.from({length:n},()=>new Array(n).fill(0)), r=new Array(n).fill(0);
  xs.forEach((x,i)=>{ const p=[]; for(let k=0;k<n;k++) p.push(x**k); for(let a=0;a<n;a++){ r[a]+=p[a]*ys[i]; for(let b=0;b<n;b++) G[a][b]+=p[a]*p[b]; } });
  for(let a=0;a<n;a++) G[a][a]+=ridge; return solveLin(G,r); }
const polyEval=(c,x)=>c.reduce((s,ci,k)=>s+ci*x**k,0);

LAB.add({
  id:'evaluation', group:'The 7-Step Procedure', title:'Step 6: Evaluation and Optimization', slides:'39-55', keywords:'bias variance overfitting confusion matrix roc auc det precision recall robustness',
  html: R`
<p><b>Evaluate the confession.</b> Compare against baseline or target values rather than perfection. Key questions: probability of detection (PD), probability of false alarm (PFA), and the confidence you can place in the claimed PD and PFA. Tools: the confusion matrix, the ROC curve, the DET curve, generalization ability, and error analysis.</p>
<h2>Generalization: bias versus variance</h2>
<p>A model that is too simple has <b>high bias, low variance</b> and underfits (it fails to capture the pattern). A model that is too complex has <b>low bias, high variance</b> and overfits (it memorizes the training data). The best balance gives the smallest testing error with an acceptable training error.</p>
${panel('Polynomial fitting: find the sweet spot', `<div class="controls"><div class="ctl"><label>Model complexity (polynomial degree) <output id="deg_v"></output></label><input type="range" id="deg" min="0" max="12" value="3"></div><div class="ctl"><label>Noise <output id="nz_v"></output></label><input type="range" id="nz" min="0.05" max="0.6" step="0.05" value="0.25"></div><button class="btn ghost sm" id="bvNew">New sample</button></div>
<div class="grid2"><canvas class="plot" id="bvFit"></canvas><canvas class="plot" id="bvErr"></canvas></div><p id="bvMsg" class="small" style="margin-top:8px"></p>`)}
<h2>The confusion matrix</h2>
<p>A confusion matrix (also called a contingency table or error matrix) visualizes classifier performance. All correct guesses lie on the diagonal, so errors are easy to spot off the diagonal.</p>
${panel('Face recognizer: Wallace, Darwin, or Turing?', `<p class="small">27 photos: 8 of Alfred Russel Wallace, 6 of Charles Darwin, 13 of Alan Turing (one Turing photo wears Darwin's beard). Rows are the actual class and columns the predicted class, matching the slide's narrative. Click a class.</p>
<div class="grid2"><div id="cmTbl"></div><div id="cmTxt" class="readout"></div></div>`)}
${panel('Binary metrics calculator', R`<div class="controls">${['TP','FP','FN','TN'].map((k,i)=>`<div class="ctl" style="min-width:90px"><label>${k}</label><input type="number" id="m${k}" value="${[40,10,5,45][i]}" min="0"></div>`).join('')}</div>
<div class="grid2"><div><table class="tbl"><tr><th></th><th class="c">Actual +</th><th class="c">Actual -</th></tr><tr><th>Predicted +</th><td class="c" id="cTP"></td><td class="c" id="cFP"></td></tr><tr><th>Predicted -</th><td class="c" id="cFN"></td><td class="c" id="cTN"></td></tr></table><p class="small muted">FP is a Type I error (false alarm). FN is a Type II error (miss).</p></div><div id="mOut"></div></div>`)}
<h2>ROC and DET curves</h2>
<p>A receiver operating characteristic (ROC) curve plots the true-positive rate (sensitivity, recall) against the false-positive rate (1 - specificity) as the discrimination threshold varies. The <b>area under the curve (AUC)</b> compares classifiers: close to 1 is excellent, 0.5 (the diagonal) has no information content. A detection error trade-off (DET) curve plots the two error rates (false reject versus false accept, or miss versus false alarm), usually on normal-deviate axes where curves become nearly straight lines.</p>
${panel('Threshold explorer', `<div class="controls"><div class="ctl"><label>Class separation d′ <output id="dp_v"></output></label><input type="range" id="dp" min="0" max="4" step="0.1" value="1.8"></div><div class="ctl"><label>Threshold <output id="th_v"></output></label><input type="range" id="th" min="-3" max="6" step="0.05" value="0.9"></div><div class="ctl"><label>Curve</label><div class="seg" id="rocSeg"><button class="on" data-v="roc">ROC</button><button data-v="det">DET</button></div></div></div>
<div class="grid2"><canvas class="plot" id="distCv"></canvas><canvas class="plot" id="rocCv"></canvas></div><div class="readout" id="rocOut" style="margin-top:10px"></div>`)}
${panel('Reading ROC space (Fawcett)', `<div id="rocSpace"></div>`, 'Explore')}
<h2>Model robustness</h2>
<p>A model should not be overly sensitive to small perturbations. The <b>one-pixel attack</b> showed that changing a single pixel can flip the prediction of a deep network (J. Su, D. Vargas, and K. Sakurai, arXiv:1710.08864, 2017). Robustness testing with perturbed inputs belongs in every evaluation plan.</p>`,
  init(root){
    let seed=3;
    const truth=x=>Math.sin(Math.PI*x)*0.9+0.3*x;
    const gen=()=>{ const nz=+$('#nz',root).value; const r=seeded(seed); const tx=[],ty=[],vx=[],vy=[]; for(let i=0;i<14;i++){ const x=-1+2*(i+r()*.8)/14; tx.push(x); ty.push(truth(x)+randn(r)*nz); } for(let i=0;i<200;i++){ const x=-1+2*r(); vx.push(x); vy.push(truth(x)+randn(r)*nz); } return {tx,ty,vx,vy}; };
    let D=gen(), curve=[];
    const mse=(c,xs,ys)=>mean(xs.map((x,i)=>(polyEval(c,x)-ys[i])**2));
    const compute=()=>{ D=gen(); curve=[]; for(let d=0;d<=12;d++){ const c=polyFit(D.tx,D.ty,d); curve.push([mse(c,D.tx,D.ty),mse(c,D.vx,D.vy)]); } };
    const draw=()=>{ const deg=+$('#deg',root).value; const c=polyFit(D.tx,D.ty,deg);
      const P=Plot($('#bvFit',root),{xmin:-1,xmax:1,ymin:-1.8,ymax:1.8,height:270}); P.axes({xlabel:'x',ylabel:'y'});
      P.fn(truth,alpha(cssVar('--c3'),.8),2,[5,4]); D.vx.forEach((x,i)=>i%3===0&&P.dot(x,D.vy[i],alpha(cssVar('--muted'),.35),2.5)); P.fn(x=>clamp(polyEval(c,x),-5,5),cssVar('--c1'),2.5); D.tx.forEach((x,i)=>P.dot(x,D.ty[i],cssVar('--c2'),5,cssVar('--surface')));
      P.legend([['True function',cssVar('--c3'),[5,4]],['Fitted model',cssVar('--c1')]]);
      const ymax=Math.min(1.2, Math.max(...curve.map(v=>v[1]))*1.1);
      const E=Plot($('#bvErr',root),{xmin:0,xmax:12,ymin:0,ymax:ymax,height:270}); E.axes({xlabel:'Model complexity (degree)',ylabel:'Mean squared error',nx:12});
      const ds=curve.map((_,i)=>i); E.line(ds,curve.map(v=>v[0]),cssVar('--c1'),2.5); E.line(ds,curve.map(v=>Math.min(v[1],ymax*1.5)),cssVar('--c4'),2.5);
      const best=curve.reduce((b,v,i)=>v[1]<curve[b][1]?i:b,0); E.vline(best,cssVar('--c3')); E.dot(deg,Math.min(curve[deg][1],ymax),cssVar('--c4'),6,cssVar('--surface')); E.dot(deg,curve[deg][0],cssVar('--c1'),6,cssVar('--surface'));
      E.legend([['Training error',cssVar('--c1')],['Testing error',cssVar('--c4')],['Best balance',cssVar('--c3'),[5,4]]], E.w-150);
      const zone= deg<best-1?'<span class="pill bad">Underfitting</span> high bias, low variance: the model is too simple.': deg>best+2?'<span class="pill bad">Overfitting</span> low bias, high variance: training error keeps falling while testing error rises.':'<span class="pill good">Good balance</span> testing error is near its minimum.';
      $('#bvMsg',root).innerHTML=`${zone} Train MSE ${curve[deg][0].toFixed(3)}, test MSE ${curve[deg][1].toFixed(3)}.`; };
    compute(); bindRange(root,'deg',draw); bindRange(root,'nz',()=>{compute();draw();}); $('#bvNew',root).onclick=()=>{seed++;compute();draw();}; draw(); onResize(draw);
    // confusion matrix
    const cls=['Wallace','Darwin','Turing'], M=[[5,3,0],[2,3,1],[0,2,11]]; let sel=0;
    const cm=()=>{ $('#cmTbl',root).innerHTML=`<table class="tbl heat"><tr><th>Actual \\ Pred.</th>${cls.map((c,j)=>`<th class="c clickable" data-c="${j}">${c}</th>`).join('')}</tr>${M.map((r,i)=>`<tr><th class="clickable" data-c="${i}">${cls[i]}</th>${r.map((v,j)=>`<td style="background:${heatColor(v/11)};color:${heatText(v/11)};${(i===sel||j===sel)?'outline:2px solid var(--amber);outline-offset:-2px':''}">${v}</td>`).join('')}</tr>`).join('')}</table>`;
      const tp=M[sel][sel], rowS=sum(M[sel]), colS=sum(M.map(r=>r[sel])); const acc=sum(M.map((r,i)=>r[i]))/sum(M.map(sum));
      $('#cmTxt',root).textContent=`Class: ${cls[sel]}\nActual ${cls[sel]} photos: ${rowS}\nCorrectly recognized (TP): ${tp}\nRecall    = ${tp}/${rowS} = ${(tp/rowS).toFixed(3)}\nPrecision = ${tp}/${colS} = ${(tp/colS).toFixed(3)}\nOverall accuracy = ${sum(M.map((r,i)=>r[i]))}/27 = ${acc.toFixed(3)}\n\n`+(sel===2?'Turing is separated well from the other two.':'Wallace and Darwin are often confused with each other.');
      $$('#cmTbl [data-c]',root).forEach(e=>e.onclick=()=>{sel=+e.dataset.c;cm();}); };
    cm();
    // metrics
    const met=()=>{ const g=k=>Math.max(0,+$('#m'+k,root).value||0); const TP=g('TP'),FP=g('FP'),FN=g('FN'),TN=g('TN'); ['TP','FP','FN','TN'].forEach(k=>$('#c'+k,root).textContent=g(k));
      const d=(a,b)=>b?a/b:NaN; const P=d(TP,TP+FP), Rc=d(TP,TP+FN), Sp=d(TN,TN+FP), A=d(TP+TN,TP+TN+FP+FN), F1=d(2*P*Rc,P+Rc), FPR=d(FP,FP+TN);
      const rows=[['Accuracy (overall correct fraction)','(TP+TN)/all',A],['Precision (positive predictive value)','TP/(TP+FP)',P],['Recall / sensitivity / TPR / PD','TP/(TP+FN)',Rc],['Specificity (true negative rate)','TN/(TN+FP)',Sp],['False alarm rate (FPR / PFA)','FP/(FP+TN)',FPR],['F1 (harmonic precision-recall mean)','2PR/(P+R)',F1]];
      $('#mOut',root).innerHTML=table(['Metric','Formula','Value'],rows.map(r=>[r[0],`<code>${r[1]}</code>`,isNaN(r[2])?'n/a':`<b>${r[2].toFixed(3)}</b>`])); };
    ['TP','FP','FN','TN'].forEach(k=>$('#m'+k,root).oninput=met); met();
    // ROC / DET
    let mode='roc';
    const roc=()=>{ const dp=+$('#dp',root).value, th=+$('#th',root).value;
      const P=Plot($('#distCv',root),{xmin:-4,xmax:7,ymin:0,ymax:0.45,height:260}); P.axes({xlabel:'Classifier score',ylabel:'Density'});
      const pdf=(x,m)=>Math.exp(-((x-m)**2)/2)/Math.sqrt(2*Math.PI);
      const xs=[],n0=[],n1=[],z=[]; for(let x=-4;x<=7;x+=.05){xs.push(x);n0.push(pdf(x,0));n1.push(pdf(x,dp));z.push(0);}
      const sx=xs.filter(x=>x>=th); P.fillBetween(sx,sx.map(x=>pdf(x,0)),sx.map(()=>0),alpha(cssVar('--c4'),.3)); P.fillBetween(sx,sx.map(x=>pdf(x,dp)),sx.map(()=>0),alpha(cssVar('--c3'),.3));
      P.line(xs,n0,cssVar('--c4'),2); P.line(xs,n1,cssVar('--c3'),2); P.vline(th,cssVar('--text'),[]); P.legend([['Negatives (healthy)',cssVar('--c4')],['Positives (faulty)',cssVar('--c3')]]);
      const tpr=1-Phi(th-dp), fpr=1-Phi(th), auc=Phi(dp/Math.SQRT2);
      if(mode==='roc'){ const R2=Plot($('#rocCv',root),{xmin:0,xmax:1,ymin:0,ymax:1,height:260}); R2.axes({xlabel:'False-positive rate (1 - specificity)',ylabel:'True-positive rate',nx:5});
        R2.ctx.fillStyle=alpha(cssVar('--muted'),.08); R2.ctx.beginPath(); R2.ctx.moveTo(R2.x(0),R2.y(0)); R2.ctx.lineTo(R2.x(1),R2.y(0)); R2.ctx.lineTo(R2.x(1),R2.y(1)); R2.ctx.fill();
        R2.line([0,1],[0,1],cssVar('--muted'),1.5,[5,4]); const rx=[],ry=[]; for(let t=8;t>=-5;t-=.05){ rx.push(1-Phi(t)); ry.push(1-Phi(t-dp)); } R2.line(rx,ry,cssVar('--c1'),2.5); R2.dot(fpr,tpr,cssVar('--c2'),6,cssVar('--surface')); R2.dot(0,1,cssVar('--c3'),4); R2.text('Ideal (0,1)',0.03,0.94,cssVar('--c3'));
      } else { const lim=[0.001,0.01,0.05,0.2,0.5,0.8,0.95]; const R2=Plot($('#rocCv',root),{xmin:probit(0.001),xmax:probit(0.95),ymin:probit(0.001),ymax:probit(0.95),height:260}); R2.axes({xlabel:'False alarm rate (normal-deviate scale)',ylabel:'Miss rate',xfmt:v=>(Phi(v)*100).toFixed(1)+'%',yfmt:v=>(Phi(v)*100).toFixed(1)+'%',nx:4,ny:4});
        const rx=[],ry=[]; for(let t=8;t>=-5;t-=.05){ rx.push(probit(1-Phi(t))); ry.push(probit(Phi(t-dp))); } R2.line(rx,ry,cssVar('--c1'),2.5); R2.dot(probit(fpr),probit(1-tpr),cssVar('--c2'),6,cssVar('--surface')); }
      $('#rocOut',root).textContent=`Threshold ${th.toFixed(2)}:  TPR (recall, PD) = ${tpr.toFixed(3)}   FPR (PFA) = ${fpr.toFixed(3)}   Miss rate = ${(1-tpr).toFixed(3)}\nAUC = ${auc.toFixed(3)}  `+(auc>.9?'(excellent)':auc>.75?'(good)':auc>.6?'(fair)':'(close to chance)')+`\nRaising the threshold makes the classifier more conservative: fewer false alarms, more misses.`; };
    bindRange(root,'dp',roc); bindRange(root,'th',roc); segmented(root,'#rocSeg',v=>{mode=v;roc();}); roc(); onResize(roc);
    stepExplorer(root,'#rocSpace',[
      {t:'A (0, 0)',d:'Never labels anything positive: no false positives, but every positive case is a false negative.'},
      {t:'B (0, 1)',d:'The ideal classifier: perfect classification.'},
      {t:'C (1, 1)',d:'The converse of A: labels everything positive, so there are no false negatives.'},
      {t:'D (1, 0)',d:'Labels every case incorrectly. Inverting its predictions gives a perfect classifier.'},
      {t:'Diagonal A-C',d:'Chance performance: tossing a coin gives the same result. Classifiers below the diagonal (the gray area) are worse than chance. Classifiers near the line can be tested for significance.'},
      {t:'Conservative vs liberal',d:'Better classifiers lie toward the top-left. Those to the left of the arrow are <b>conservative</b>: positive only with strong evidence, few false positives, many misses. Those to the right are <b>liberal</b>: positive on weak evidence, catching positives at the cost of a high false-positive rate.'}]);
  },
  quiz:[
    {q:'Training error keeps decreasing as complexity grows, but testing error starts rising. The model is:', o:['Underfitting (high bias)','Overfitting (high variance)','Perfectly balanced','Not trained'], a:1, e:'A widening gap between low training error and rising testing error is the signature of overfitting.'},
    {q:'In the Wallace/Darwin/Turing confusion matrix, what is the recall for Darwin (6 actual Darwin photos, 3 recognized)?', o:['0.375','0.500','0.750','0.600'], a:1, e:'Recall = TP / actual positives = 3 / 6 = 0.5. (0.375 = 3 / 8 is Darwin\'s precision: 8 photos were predicted as Darwin.)'},
    {q:'An ROC curve that lies on the diagonal (AUC = 0.5) means:', o:['A perfect classifier','The classifier has no information content: no better than chance','The threshold is too high','Precision is 0.5'], a:1, e:'The diagonal corresponds to random guessing, such as tossing a coin.'}
  ]
});

LAB.add({
  id:'deployment', group:'The 7-Step Procedure', title:'Step 7: Model Deployment', slides:'57-65', keywords:'cloud fog edge drift nonstationary iid explainability xai',
  html: R`
<h2>Edge versus fog versus cloud</h2>
${panel('Where should the model run?', `<div class="grid3" id="tiers"></div><h4 style="margin-top:16px">Requirements</h4><div class="btnrow" id="reqs"></div><div class="callout" id="tierRec"></div>`)}
<h2>Independent and identically distributed (IID) data</h2>
<p>Almost every learning algorithm assumes that the data it learns from, and the data it will meet in service, are <b>IID</b>. Before looking at industrial data, start with a simple picture classifier.</p>
${panel('Warm-up: a cats-versus-dogs classifier', `<p class="small" style="margin-top:0">The model was trained on thousands of daylight photos of many different cats and dogs. Pick what it is tested on.</p>
<div class="controls"><div class="ctl"><label>Test it on</label><div class="seg" id="iwSeg"><button class="on" data-v="iid">${ico('sun')} New cats and dogs</button><button data-v="night">${ico('moon')} Night-vision cats</button><button data-v="human">${ico('user')} A human</button><button data-v="video">${ico('film')} Frames from one video</button></div></div></div>
<div class="iw-box" id="iwStripBox" style="margin-bottom:12px;display:none"><div class="og-label">${ico('film')} The whole video, in time order</div><div class="iw-player"><div class="iw-screen" id="iwScreen"><span class="iw-cat" id="iwBigCat">${ico('cat')}</span><em id="iwFrameNo">Frame 1 of 16</em></div><div class="iw-pctl"><button class="btn ghost sm" id="iwPlay">${ico('pause')} Pause</button><div class="og-meter"><i id="iwProg" style="width:0"></i></div></div><p class="small muted" style="margin:4px 0 0">Watch the video, then look at the frames it was cut into.</p></div><div class="iw-strip" id="iwStrip"></div><p class="small muted" style="margin:6px 0 0">Neighboring frames are near-copies; frames far apart in time look clearly different. Green outline = training, blue outline = test.</p></div><div class="grid2"><div class="iw-box"><div class="og-label">${ico('graduation-cap')} Training data</div><div class="iw-grid" id="iwTrain"></div><p class="small muted" id="iwTrainCap"></p></div><div class="iw-box"><div class="og-label">${ico('clipboard-check')} Test data</div><div class="iw-grid" id="iwTest"></div><p class="small muted" id="iwTestCap"></p></div></div>
<div class="iw-box" style="margin-top:12px"><div class="og-label">${ico('gauge')} What the model reports</div><div id="iwRes"></div></div>
<div class="btnrow" id="iwVerdict" style="margin-top:10px"></div><div class="callout" id="iwMsg" style="margin-top:8px"></div><p class="small muted" style="margin:6px 0 0">Accuracy and confidence values are illustrative.</p>`, 'Explore')}
<div class="grid2"><div class="mini"><h4>${ico('unlink','h4ico')}1. Independence</h4><p>Knowing one reading tells you nothing about another. Readings taken one second apart from the <b>same pump</b> break this: if the bearing vibrates strongly now, it will almost certainly still vibrate strongly a second later.</p><p class="small">$p(x_1, \dots, x_n) = \prod_i p(x_i)$</p></div><div class="mini"><h4>${ico('copy','h4ico')}2. Identical distribution</h4><p>Every reading follows the <b>same distribution</b> $f(x; \mu, \sigma^2)$: same mean, same spread, same shape. A model trained on new pumps in a cool plant, then deployed on aged pumps in a hot plant, breaks this.</p><p class="small">Same $\mu$, same $\sigma^2$ in training and in service</p></div></div>
<p>Now move the same idea to industry. Picture a predictive maintenance model that watches pump bearings: each observation is one vibration reading (RMS velocity in mm/s), and the model raises an alarm when a reading looks abnormal. Consecutive readings from one pump play the role of the video frames, and a new site or an aging fleet plays the role of the night-vision camera.</p>
${panel('Is your vibration data IID?', `<div class="controls"><div class="ctl"><label>Scenario</label><div class="seg" id="iidSeg"><button class="on" data-v="iid">IID (ideal)</button><button data-v="dep">Consecutive readings</button><button data-v="shift">New site, aging fleet</button><button data-v="both">Both</button></div></div></div>
<div class="controls"><div class="ctl"><label>Correlation between consecutive readings &rho; <output id="iRho_v"></output></label><input type="range" id="iRho" min="0" max="0.95" step="0.05" value="0"><span class="small muted" style="display:block;font-weight:400;margin-top:2px;max-width:280px">How strongly each reading resembles the one just before it. 0 means no memory (independent); near 1 means each reading almost repeats the last.</span></div><div class="ctl"><label>Mean shift in service &Delta;&mu; (mm/s) <output id="iMu_v"></output></label><input type="range" id="iMu" min="0" max="1.5" step="0.05" value="0"><span class="small muted" style="display:block;font-weight:400;margin-top:2px;max-width:280px">How far the average vibration in service has moved from the training average, for example due to a hotter site or older pumps.</span></div><div class="ctl"><label>Spread ratio &sigma;<sub>service</sub> / &sigma;<sub>train</sub> <output id="iSd_v"></output></label><input type="range" id="iSd" min="1" max="2.5" step="0.1" value="1"><span class="small muted" style="display:block;font-weight:400;margin-top:2px;max-width:280px">How much more the readings scatter in service than in training. 1 means the same spread; 2 means twice as spread out.</span></div></div>
<canvas class="plot" id="iTs"></canvas>
<div class="grid2" style="margin-top:10px"><div><h4 style="margin:0 0 4px">${ico('unlink','h4ico')}Independence check: lag plot</h4><canvas class="plot" id="iLag"></canvas></div><div><h4 style="margin:0 0 4px">${ico('copy','h4ico')}Distribution check: training versus service</h4><canvas class="plot" id="iHist"></canvas></div></div>
<div id="iVerdict" class="btnrow" style="margin-top:10px"></div><div class="readout" id="iOut" style="margin-top:8px"></div>`)}
<div class="grid2"><div class="mini"><h4>${ico('wrench','h4ico')}If readings are not independent</h4><p>Split data <b>by time or by machine</b>, never at random, or near-identical neighbors land in both the training and test sets and inflate the test score. Summarize windows into features (RMS, kurtosis, trend), or use a sequence model (RNN, LSTM) that expects dependence.</p></div><div class="mini"><h4>${ico('radar','h4ico')}If the distribution is not identical</h4><p><b>Monitor drift</b>: compare live statistics with the training data. Recalibrate sensors, collect data from the new site or older machines, and retrain or adapt the model, which is the topic of the next part.</p></div></div>
<p class="callout key"><b>IID = Independence + Identical distribution.</b> When either part fails, the accuracy you measured during development no longer predicts the accuracy you will get in the field.</p>
<h2>Learning in nonstationary environments</h2>
<p>The IID assumption also implies that behavior does not change over time. Training and test data are assumed to be drawn independently from the same distribution. In many applications this naive assumption is simply not true. There is <b>no "set and forget"</b>.</p>
<div class="grid4"><div class="mini"><h4>Sensor imperfection</h4><p>Faults, aging, and miscalibration.</p></div><div class="mini"><h4>Non-stationarity</h4><p>The data-generating process itself changes.</p></div><div class="mini"><h4>Drift over time</h4><p>Gradual concept drift (wear, seasons).</p></div><div class="mini"><h4>Evolving data</h4><p>New classes, new operating regimes.</p></div></div>
${panel('Concept drift: static versus adaptive model', `<div class="controls"><div class="ctl"><label>Drift type</label><div class="seg" id="drSeg"><button class="on" data-v="grad">Gradual</button><button data-v="abr">Abrupt</button><button data-v="none">None (IID)</button></div></div><div class="ctl"><label>Drift speed <output id="ds_v"></output></label><input type="range" id="ds" min="0.2" max="3" step="0.1" value="1.2"></div><div class="ctl"><label>Adaptive window <output id="win_v"></output></label><input type="range" id="win" min="50" max="600" step="25" value="200"></div></div><canvas class="plot" id="drCv"></canvas><p class="small muted" style="margin-top:6px">Nearest-centroid classifiers. The static model is trained once on the first 200 samples. The adaptive model (passive approach) retrains on the most recent window of labeled samples.</p>`)}

    {q:'An adaptation strategy that updates the model with every new batch of data, whether or not drift is present, is called:', o:['The active approach','The passive approach','Model induction','Data flattening'], a:1, e:'The passive approach updates continuously; the active approach waits for a change detector to fire.'}
  ]
});
